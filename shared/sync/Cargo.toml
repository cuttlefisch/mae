[package]
name = "mae-sync"
version = "0.14.199"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
yrs = { version = "0.27", features = ["sync"] }
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
similar = "3"
tracing = "0.1"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = "2" # ADR-036: signed, hash-chained membership ops
rand = "0.10" # #72: unpredictable authorization-epoch tokens (fresh_epoch_token)
# ADR-037 E2E content encryption (#131): `content_crypto` lives in mae-crypto (pure,
# builds for wasm32, shared with the browser) and is re-exported from src/lib.rs. Its
# AEAD, X25519 and curve crates, and why they are pinned where they are, are listed
# in shared/crypto/Cargo.toml.
mae-crypto = { path = "../crypto" }
# #156 F9: zeroize key material on drop (ContentKey + DH/scalar intermediates). Same
# version the dalek siblings already pull, so no new transitive cost.
zeroize = { version = "1", features = ["zeroize_derive"] }
# ADR-115 D4: NFC for the attachment NAME collision key (portable_name::fold_key).
# Already in both lock files (mae-crypto, mae-site, the daemon).
unicode-normalization = "0.1.25"
# ADR-115 D4: full default case folding (CaseFolding.txt C+F) for the same key.
# ICU4X, the Unicode Consortium's own library (Unicode-3.0, allowed by deny.toml);
# its icu_collections/icu_properties/icu_provider are the versions both lock files
# already carry through idna, so only icu_casemap and its data crate are new.
icu_casemap = "~2.2.0"

[dev-dependencies]
tempfile = "3"
proptest = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.11"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "crdt_ops"
harness = false
