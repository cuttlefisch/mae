[package]
name = "mae-kb"
description = "Knowledge base layer (graph store, links)"
version = "0.14.119"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
# sqlite is THE backend (ADR-108). sled is retained only so the one-time
# sled->sqlite migration can still read an old store -- no code path may create
# one. See `migrate_sled_to_sqlite`.
default = ["storage-sqlite"]
storage-sled = ["cozo/storage-sled"]
# SQLite (WAL) backend — lets N processes share one on-disk store safely (multiple
# readers + serialized writer). Compiled ALONGSIDE sled so the one-time sled→sqlite
# migration can read the old store. Editor pulls no rusqlite, so cozo's sqlite3
# native lib has no `links` conflict.
storage-sqlite = ["cozo/storage-sqlite", "dep:sqlite"]
crdt = ["dep:mae-sync"]
# ADR-062 Phase C/D: `RemoteHubQueryLayer`, a `KbQueryLayer` backed by blocking HTTP
# calls to ADR-053's `kb/query.*` surface. Optional because it pulls a TLS+HTTP client
# into every consumer of `mae-kb`, including the interactive editor GUI/TUI binary —
# gated behind a feature (matching the `gui`-feature-gating precedent for other heavy,
# not-universally-needed dependencies) so a build with no RemoteHub instances registered
# pays nothing for it.
remote-hub = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
walkdir = "2"
notify = "8"
lru = "0.18"
mae-sync = { path = "../sync", optional = true }
mae-mcp = { path = "../mcp" }
cozo = { version = "0.7", default-features = false, features = ["rayon"] }
# Same crate cozo's own `storage-sqlite` uses, so the versions unify and there is
# no second `links = "sqlite3"` native library (the conflict ADR-012 records
# hitting with rusqlite). Used ONLY to set `journal_mode=WAL` out of band --
# see `wal::ensure_wal`.
sqlite = { version = "0.32", optional = true }
sha2 = "0.11"
# ADR-105 D4: `generate_uuid` mints KB instance ids and collab ids. Not a new
# dependency in the tree — `mae-sync` and `mae-mcp`, both of which this crate
# already depends on, pin the same 0.10.
rand = "0.10"
ndarray = "0.15"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"], optional = true }

[dev-dependencies]
tempfile = "3"
mae-sync = { path = "../sync" }
