# SPDX-License-Identifier: GPL-3.0-or-later
# Palette horizon, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-horizon: the same hues, darker, on a near-white paper.
# - dark: doom-horizon, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f4f6ff"
    panel: "#e8eaf3"
    foreground: "#2c2e2f"
    muted: "#959595"
    link: "#007678"
    accent: "#8848a8"
    mark: "#ffcab088"
  gallery:
    title: "#c7c9cb"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#f9faff"
    node-control: "#fad1cf"
    line: "#959595"
    outline: "#b5b6b9"
    highlight: "#8848a8"
    blocked: "#b6224f"
    zone-blue: "#cef1f6"
    zone-green: "#d0efe4"
    zone-amber: "#f6e5e2"
    zone-orange: "#f9e3e5"
    zone-violet: "#efe3ff"
    zone-grey: "#e7e9f2"
    zone-brown: "#efdce4"
  graph:
    ink: "{ui.foreground}"
    accent: "#8848a8"
    neighbour: "#009a9c"
    visited: "#d6d8e1"
    edge: "#b1b1b4"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#8d8e97"
    string: "#a76a4a"
    number: "#ab5548"
    constant: "#ab5548"
    keyword: "#8848a8"
    operator: "#3c839e"
    function: "#3c839e"
    type: "#3c839e"
    variable: "#b6224f"

dark:
  ui:
    background: "#232530"
    panel: "#1c1e26"
    foreground: "#c7c9cb"
    muted: "#6a6a6a"
    link: "#21bfc2"
    accent: "#b877db"
    mark: "#6a6a6a66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#45464e"
    node-soft: "#3b3c43"
    node-control: "#533638"
    line: "#6a6a6a"
    outline: "#505155"
    highlight: "#b877db"
    blocked: "#e95678"
    zone-blue: "#1c333c"
    zone-green: "#173630"
    zone-amber: "#382c2e"
    zone-orange: "#3a2a30"
    zone-violet: "#342a44"
    zone-grey: "#2d2f3a"
    zone-brown: "#3e303a"
  graph:
    ink: "{ui.foreground}"
    accent: "#ad6ccf"
    neighbour: "#00a0a3"
    visited: "{ui.panel}"
    edge: "#535458"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#6c6f77"
    string: "#fab795"
    number: "#f09383"
    constant: "#f09383"
    keyword: "#b877db"
    operator: "#87ceeb"
    function: "#87ceeb"
    type: "#87ceeb"
    variable: "#e95678"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: violet
  swatches:
    - id: yellow
      name: yellow
      light: { graphic: "#a76a4a", text: "#975b3c", graph: "#b36336" }
      dark: { graphic: "#fab795", text: "#fab795", graph: "#c67447" }
    - id: violet
      name: violet
      light: { graphic: "#8848a8", text: "#8848a8", graph: "#8848a8" }
      dark: { graphic: "#b877db", text: "#b877db", graph: "#ad6ccf" }
    - id: magenta
      name: magenta
      light: { graphic: "#55587a", text: "#55587a", graph: "#50519d" }
      dark: { graphic: "#6c6f93", text: "#868aaf", graph: "#6668b7" }
