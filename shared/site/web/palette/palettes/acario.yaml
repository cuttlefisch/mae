# SPDX-License-Identifier: GPL-3.0-or-later
# Palette acario, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: doom-acario-light, as is.
# - dark: doom-acario-dark, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f5f5f9"
    panel: "#e9e9f2"
    foreground: "#0f1019"
    muted: "#585c6c"
    link: "#1f55a0"
    accent: "#8700af"
    mark: "#f3d48988"
  gallery:
    title: "#cedbe5"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#f9f9fc"
    node-control: "#ffd2bd"
    line: "#585c6c"
    outline: "#8c8f9b"
    highlight: "#8700af"
    blocked: "#d70000"
    zone-blue: "#dce9ff"
    zone-green: "#dceede"
    zone-amber: "#f0e7d6"
    zone-orange: "#ffe1d5"
    zone-violet: "#f3e0ff"
    zone-grey: "#e8e8ec"
    zone-brown: "#f4dad6"
  graph:
    ink: "{ui.foreground}"
    accent: "#8700af"
    neighbour: "#2056a1"
    visited: "#d7d7db"
    edge: "#848794"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#4e4e4e"
    string: "#005f00"
    number: "#d75f00"
    constant: "#af005f"
    keyword: "#d70000"
    operator: "#1f55a0"
    function: "#af8700"
    type: "#1f55a0"
    variable: "#004751"

dark:
  ui:
    background: "#0d0e16"
    panel: "#040408"
    foreground: "#cedbe5"
    muted: "#767676"
    link: "#377ad9"
    accent: "#bf34ed"
    mark: "#76767666"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#2c2d32"
    node-soft: "#222328"
    node-control: "#3f190b"
    line: "#767676"
    outline: "#4e4e52"
    highlight: "#ab11d8"
    blocked: "#d83441"
    zone-blue: "#0c172d"
    zone-green: "#0b1c0e"
    zone-amber: "#1b170e"
    zone-orange: "#24120f"
    zone-violet: "#210c2f"
    zone-grey: "#16171f"
    zone-brown: "#25181c"
  graph:
    ink: "{ui.foreground}"
    accent: "#ab11d8"
    neighbour: "#3679d8"
    visited: "{ui.panel}"
    edge: "#535457"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#767676"
    string: "#79d836"
    number: "#d85f00"
    constant: "#8041d8"
    keyword: "#d83441"
    operator: "#3679d8"
    function: "#d8b941"
    type: "#3679d8"
    variable: "#86e8d7"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: violet
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#d75f00", text: "#af4c00", graph: "#d75f00" }
      dark: { graphic: "#d85f00", text: "#d85f00", graph: "#d85f00" }
    - id: yellow
      name: yellow
      light: { graphic: "#a78100", text: "#846500", graph: "#a78100" }
      dark: { graphic: "#d8b941", text: "#d8b941", graph: "#a68a00" }
    - id: green
      name: green
      light: { graphic: "#005f00", text: "#005f00", graph: "#156b13" }
      dark: { graphic: "#79d836", text: "#79d836", graph: "#52a400" }
    - id: teal
      name: green azulado
      light: { graphic: "#00987a", text: "#00785f", graph: "#00987a" }
      dark: { graphic: "#2d9574", text: "#2d9574", graph: "#0d9772" }
    - id: violet
      name: violet
      light: { graphic: "#8700af", text: "#8700af", graph: "#8700af" }
      dark: { graphic: "#ab11d8", text: "#bf34ed", graph: "#ab11d8" }
