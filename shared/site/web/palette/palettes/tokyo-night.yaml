# SPDX-License-Identifier: GPL-3.0-or-later
# Palette tokyo-night, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-tokyo-night: the same hues, darker, on a near-white paper.
# - dark: doom-tokyo-night, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f5f6ff"
    panel: "#e7e9f2"
    foreground: "#292d3d"
    muted: "#666b7d"
    link: "#4366b6"
    accent: "#a95007"
    mark: "#fecf8b88"
  gallery:
    title: "#a9b1d6"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fafaff"
    node-control: "#fcd4c3"
    line: "#666b7d"
    outline: "#9599a9"
    highlight: "#b35918"
    blocked: "#b73c59"
    zone-blue: "#dce7ff"
    zone-green: "#d6eff1"
    zone-amber: "#f2e7df"
    zone-orange: "#fae4df"
    zone-violet: "#e7dfff"
    zone-grey: "#e8e9f2"
    zone-brown: "#eedee3"
  graph:
    ink: "{ui.foreground}"
    accent: "#b35918"
    neighbour: "#466aba"
    visited: "#d7d8e1"
    edge: "#8e92a2"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#888da1"
    string: "#5a861d"
    number: "#b35918"
    constant: "#b35918"
    keyword: "#7e5db4"
    operator: "#2d83af"
    function: "#466aba"
    type: "#121524"
    variable: "#121524"

dark:
  ui:
    background: "#1a1b26"
    panel: "#13141c"
    foreground: "#a9b1d6"
    muted: "#71799d"
    link: "#7aa2f7"
    accent: "#ff9e64"
    mark: "#71799d66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#3b3c43"
    node-soft: "#303138"
    node-control: "#492c22"
    line: "#71799d"
    outline: "#505670"
    highlight: "#ff9e64"
    blocked: "#f7768e"
    zone-blue: "#1b243e"
    zone-green: "#15292e"
    zone-amber: "#2b2422"
    zone-orange: "#302121"
    zone-violet: "#28213d"
    zone-grey: "#232430"
    zone-brown: "#32262e"
  graph:
    ink: "{ui.foreground}"
    accent: "#cd7035"
    neighbour: "#5e84d6"
    visited: "{ui.panel}"
    edge: "#555b77"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#5f6689"
    string: "#9ece6a"
    number: "#ff9e64"
    constant: "#ff9e64"
    keyword: "#bb9af7"
    operator: "#7dcfff"
    function: "#7aa2f7"
    type: "#c0caf5"
    variable: "#c0caf5"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: orange
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#b35918", text: "#a95007", graph: "#b35918" }
      dark: { graphic: "#ff9e64", text: "#ff9e64", graph: "#cd7035" }
    - id: yellow
      name: yellow
      light: { graphic: "#996c20", text: "#8d610f", graph: "#9d6a00" }
      dark: { graphic: "#e0af68", text: "#e0af68", graph: "#b68028" }
    - id: green
      name: green
      light: { graphic: "#138d7f", text: "#00776b", graph: "#009485" }
      dark: { graphic: "#73daca", text: "#73daca", graph: "#00a292" }
