# SPDX-License-Identifier: GPL-3.0-or-later
# Palette one, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: doom-one-light, as is.
# - dark: doom-one, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#fafafa"
    panel: "#f0f0f0"
    foreground: "#383a42"
    muted: "#9ca0a4"
    link: "#3066df"
    accent: "#a626a4"
    mark: "#fdcf8b88"
  gallery:
    title: "#bbc2cf"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fefefe"
    node-control: "#fed8bf"
    line: "#9ca0a4"
    outline: "#bcbfc1"
    highlight: "#a626a4"
    blocked: "#e45649"
    zone-blue: "#e4edff"
    zone-green: "#e1f3e0"
    zone-amber: "#f7ebda"
    zone-orange: "#fee8da"
    zone-violet: "#fce4fb"
    zone-grey: "#ededed"
    zone-brown: "#f4e1da"
  graph:
    ink: "{ui.foreground}"
    accent: "#a626a4"
    neighbour: "#4078f2"
    visited: "#dcdcdc"
    edge: "#b7babd"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#8e9296"
    string: "#50a14f"
    number: "#d07c3e"
    constant: "#b751b6"
    keyword: "#e45649"
    operator: "#4078f2"
    function: "#a626a4"
    type: "#986801"
    variable: "#6a1869"

dark:
  ui:
    background: "#282c34"
    panel: "#21242b"
    foreground: "#bbc2cf"
    muted: "#73797e"
    link: "#51afef"
    accent: "#c678dd"
    mark: "#73797e66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#4b4e53"
    node-soft: "#404348"
    node-control: "#593f31"
    line: "#73797e"
    outline: "#575d63"
    highlight: "#c678dd"
    blocked: "#ff6c6b"
    zone-blue: "#25384a"
    zone-green: "#2e3930"
    zone-amber: "#3b3530"
    zone-orange: "#3f332f"
    zone-violet: "#3b3048"
    zone-grey: "#32363e"
    zone-brown: "#42383b"
  graph:
    ink: "{ui.foreground}"
    accent: "#b567cb"
    neighbour: "#3394d3"
    visited: "{ui.panel}"
    edge: "#5b6167"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#6f767c"
    string: "#98be65"
    number: "#da8548"
    constant: "#a9a1e1"
    keyword: "#51afef"
    operator: "#51afef"
    function: "#c678dd"
    type: "#ecbe7b"
    variable: "#ddaeeb"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: magenta
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#c97638", text: "#a95812", graph: "#c97638" }
      dark: { graphic: "#da8548", text: "#da8548", graph: "#c77436" }
    - id: green
      name: green
      light: { graphic: "#4a9b49", text: "#2a7d2b", graph: "#4a9b49" }
      dark: { graphic: "#98be65", text: "#98be65", graph: "#769a41" }
    - id: magenta
      name: magenta
      light: { graphic: "#a626a4", text: "#a626a4", graph: "#a626a4" }
      dark: { graphic: "#c678dd", text: "#c678dd", graph: "#b567cb" }
