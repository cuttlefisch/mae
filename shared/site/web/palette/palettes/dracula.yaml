# SPDX-License-Identifier: GPL-3.0-or-later
# Palette dracula, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-dracula: the same hues, darker, on a near-white paper.
# - dark: doom-dracula, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f5f6ff"
    panel: "#e6e8f1"
    foreground: "#2e2e2a"
    muted: "#9aa1b5"
    link: "#006ea5"
    accent: "#00792e"
    mark: "#d8df9188"
  gallery:
    title: "#f8f8f2"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fafaff"
    node-control: "#f5d8c1"
    line: "#9aa1b5"
    outline: "#b9bece"
    highlight: "#009a3d"
    blocked: "#c50e25"
    zone-blue: "#d9ebff"
    zone-green: "#d7f1e1"
    zone-amber: "#e7ebda"
    zone-orange: "#f5e6de"
    zone-violet: "#ece5ff"
    zone-grey: "#e8e9f2"
    zone-brown: "#efdee0"
  graph:
    ink: "{ui.foreground}"
    accent: "#009a3d"
    neighbour: "#087cb8"
    visited: "#d7d8e1"
    edge: "#b4bacb"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#888fa2"
    string: "#8b9117"
    number: "#8157b8"
    constant: "#2a8fa2"
    keyword: "#b83787"
    operator: "#8157b8"
    function: "#009a3d"
    type: "#8157b8"
    variable: "#a1718e"

dark:
  ui:
    background: "#282a36"
    panel: "#1e2029"
    foreground: "#f8f8f2"
    muted: "#6272a4"
    link: "#61bfff"
    accent: "#50fa7b"
    mark: "#6272a466"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#4b4c54"
    node-soft: "#404149"
    node-control: "#553f30"
    line: "#6272a4"
    outline: "#4d587b"
    highlight: "#50fa7b"
    blocked: "#ff5555"
    zone-blue: "#24364c"
    zone-green: "#1f3c31"
    zone-amber: "#32362f"
    zone-orange: "#3c3230"
    zone-violet: "#36304c"
    zone-grey: "#323440"
    zone-brown: "#42363d"
  graph:
    ink: "{ui.foreground}"
    accent: "#00a943"
    neighbour: "#3295d2"
    visited: "{ui.panel}"
    edge: "#505b81"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#6272a4"
    string: "#f1fa8c"
    number: "#bd93f9"
    constant: "#8be9fd"
    keyword: "#ff79c6"
    operator: "#bd93f9"
    function: "#50fa7b"
    type: "#bd93f9"
    variable: "#ffc9e8"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: green
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#ac6a11", text: "#975b00", graph: "#ac6a11" }
      dark: { graphic: "#ffb86c", text: "#ffb86c", graph: "#be7b2b" }
    - id: yellow
      name: yellow
      light: { graphic: "#858b08", text: "#686d00", graph: "#858b08" }
      dark: { graphic: "#f1fa8c", text: "#f1fa8c", graph: "#8e941b" }
    - id: green
      name: green
      light: { graphic: "#009a3d", text: "#00792e", graph: "#009a3d" }
      dark: { graphic: "#50fa7b", text: "#50fa7b", graph: "#00a943" }
    - id: magenta
      name: magenta
      light: { graphic: "#b83787", text: "#b53485", graph: "#b83787" }
      dark: { graphic: "#ff79c6", text: "#ff79c6", graph: "#d754a2" }
