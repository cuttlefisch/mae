# SPDX-License-Identifier: GPL-3.0-or-later
# Palette earl-grey, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: doom-earl-grey, as is.
# - dark: composed from doom-earl-grey: the same hues, lighter, on a dark paper.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#fcfbf9"
    panel: "#f7f3ee"
    foreground: "#605a52"
    muted: "#aeaba6"
    link: "#556995"
    accent: "#6c7345"
    mark: "#f3d1a888"
  gallery:
    title: "#d7d0c7"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#ffffff"
    node-control: "#f0dbeb"
    line: "#aeaba6"
    outline: "#c9c6c2"
    highlight: "#747b4d"
    blocked: "#8f5652"
    zone-blue: "#e6eefe"
    zone-green: "#edf1d8"
    zone-amber: "#fbead6"
    zone-orange: "#fbead6"
    zone-violet: "#fae8f5"
    zone-grey: "#efeeec"
    zone-brown: "#f3e2d9"
  graph:
    ink: "{ui.foreground}"
    accent: "#7f8a28"
    neighbour: "#5272bc"
    visited: "#dedddb"
    edge: "#c5c2be"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#95918c"
    string: "#747b4d"
    number: "#477a7b"
    constant: "#477a7b"
    keyword: "#83577d"
    operator: "#605a52"
    function: "#605a52"
    type: "#605a52"
    variable: "#556995"

dark:
  ui:
    background: "#1f1e1d"
    panel: "#191713"
    foreground: "#d7d0c7"
    muted: "#6f6c67"
    link: "#97addd"
    accent: "#b1b988"
    mark: "#6f6c6766"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#3f3e3e"
    node-soft: "#353433"
    node-control: "#41313e"
    line: "#6f6c67"
    outline: "#514f4c"
    highlight: "#b1b988"
    blocked: "#d99a95"
    zone-blue: "#222834"
    zone-green: "#272a15"
    zone-amber: "#332617"
    zone-orange: "#332617"
    zone-violet: "#30232d"
    zone-grey: "#292827"
    zone-brown: "#352a25"
  graph:
    ink: "{ui.foreground}"
    accent: "#899535"
    neighbour: "#6989d5"
    visited: "{ui.panel}"
    edge: "#55534f"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#837f7a"
    string: "#b1b988"
    number: "#87bcbc"
    constant: "#87bcbc"
    keyword: "#cb9bc4"
    operator: "#d7d0c7"
    function: "#d7d0c7"
    type: "#d7d0c7"
    variable: "#97addd"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: green
  swatches:
    - id: green
      name: green
      light: { graphic: "#747b4d", text: "#6c7345", graph: "#7f8a28" }
      dark: { graphic: "#b1b988", text: "#b1b988", graph: "#899535" }
