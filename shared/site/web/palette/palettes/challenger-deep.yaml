# SPDX-License-Identifier: GPL-3.0-or-later
# Palette challenger-deep, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-challenger-deep: the same hues, darker, on a near-white paper.
# - dark: doom-challenger-deep, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f6f6ff"
    panel: "#e4e3ec"
    foreground: "#1e3235"
    muted: "#6b7385"
    link: "#1b6e8c"
    accent: "#6b40d0"
    mark: "#ebd69888"
  gallery:
    title: "#cbe3e7"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fafaff"
    node-control: "#f6d7c6"
    line: "#6b7385"
    outline: "#999fae"
    highlight: "#6b40d0"
    blocked: "#ba4247"
    zone-blue: "#d7edfe"
    zone-green: "#daf0e3"
    zone-amber: "#efe9df"
    zone-orange: "#f8e5df"
    zone-violet: "#e7e5ff"
    zone-grey: "#e9e9f2"
    zone-brown: "#efdee0"
  graph:
    ink: "{ui.foreground}"
    accent: "#6b40d0"
    neighbour: "#008bb4"
    visited: "#d8d8e1"
    edge: "#9298a8"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#8d8da1"
    string: "#9a864a"
    number: "#ad672a"
    constant: "#459a82"
    keyword: "#ba4247"
    operator: "#009494"
    function: "#8c57a2"
    type: "#3c89a8"
    variable: "#9a864a"

dark:
  ui:
    background: "#1e1c31"
    panel: "#12111e"
    foreground: "#cbe3e7"
    muted: "#858fa5"
    link: "#91ddff"
    accent: "#906cff"
    mark: "#858fa566"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#3f3e4c"
    node-soft: "#343441"
    node-control: "#49312d"
    line: "#858fa5"
    outline: "#5e647a"
    highlight: "#906cff"
    blocked: "#ff8080"
    zone-blue: "#172a41"
    zone-green: "#1b2c2f"
    zone-amber: "#2b272e"
    zone-orange: "#31242c"
    zone-violet: "#29204c"
    zone-grey: "#27263b"
    zone-brown: "#352938"
  graph:
    ink: "{ui.foreground}"
    accent: "#906cff"
    neighbour: "#1899c5"
    visited: "{ui.panel}"
    edge: "#646a80"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#676687"
    string: "#ffe9aa"
    number: "#ffb378"
    constant: "#aaffe4"
    keyword: "#ff8080"
    operator: "#63f2f1"
    function: "#c991e1"
    type: "#91ddff"
    variable: "#ffe9aa"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: violet
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#ad672a", text: "#995512", graph: "#ae6626" }
      dark: { graphic: "#ffb378", text: "#ffb378", graph: "#c2783a" }
    - id: yellow
      name: yellow
      light: { graphic: "#948044", text: "#786427", graph: "#9c7e0f" }
      dark: { graphic: "#ffe9aa", text: "#ffe9aa", graph: "#a78922" }
    - id: green
      name: green
      light: { graphic: "#239540", text: "#00762a", graph: "#239540" }
      dark: { graphic: "#95ffa4", text: "#95ffa4", graph: "#38a54f" }
    - id: violet
      name: violet
      light: { graphic: "#6b40d0", text: "#6b40d0", graph: "#6b40d0" }
      dark: { graphic: "#906cff", text: "#906cff", graph: "#906cff" }
    - id: magenta
      name: magenta
      light: { graphic: "#8c57a2", text: "#85509b", graph: "#8c57a2" }
      dark: { graphic: "#c991e1", text: "#c991e1", graph: "#a973c0" }
