# SPDX-License-Identifier: GPL-3.0-or-later
# Palette rouge, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-rouge: the same hues, darker, on a near-white paper.
# - dark: doom-rouge, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f2f7ff"
    panel: "#e9edf5"
    foreground: "#2c2f28"
    muted: "#9f8688"
    link: "#456a8d"
    accent: "#8b6342"
    mark: "#e9d6a288"
  gallery:
    title: "#fafff6"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#f8fbff"
    node-control: "#e9d7cb"
    line: "#9f8688"
    outline: "#bcacb0"
    highlight: "#9a7250"
    blocked: "#964e54"
    zone-blue: "#d7ebff"
    zone-green: "#e1eedb"
    zone-amber: "#ebe5d3"
    zone-orange: "#f2e7e0"
    zone-violet: "#f1e4f9"
    zone-grey: "#e5eaf2"
    zone-brown: "#e9e0e3"
  graph:
    ink: "{ui.foreground}"
    accent: "#ae6922"
    neighbour: "#206aa7"
    visited: "#d4d9e1"
    edge: "#b8a7aa"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#82919d"
    string: "#697561"
    number: "#9a7250"
    constant: "#964e54"
    keyword: "#7f5c80"
    operator: "#7f5c80"
    function: "#a66861"
    type: "#964e54"
    variable: "#964e54"

dark:
  ui:
    background: "#172030"
    panel: "#101828"
    foreground: "#fafff6"
    muted: "#b16e75"
    link: "#6e94b9"
    accent: "#eabe9a"
    mark: "#b16e7566"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#3b414b"
    node-soft: "#303641"
    node-control: "#3f3636"
    line: "#b16e75"
    outline: "#78525c"
    highlight: "#eabe9a"
    blocked: "#c6797e"
    zone-blue: "#112b45"
    zone-green: "#222d23"
    zone-amber: "#2f2e28"
    zone-orange: "#312927"
    zone-violet: "#2d253b"
    zone-grey: "#202a3a"
    zone-brown: "#342c35"
  graph:
    ink: "{ui.foreground}"
    accent: "#c07937"
    neighbour: "#4b91d1"
    visited: "{ui.panel}"
    edge: "#805660"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#64727d"
    string: "#a3b09a"
    number: "#eabe9a"
    constant: "#c6797e"
    keyword: "#b18bb1"
    operator: "#b18bb1"
    function: "#f9b5ac"
    type: "#c6797e"
    variable: "#c6797e"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: orange
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#9a7250", text: "#8b6342", graph: "#ae6922" }
      dark: { graphic: "#eabe9a", text: "#eabe9a", graph: "#c07937" }
    - id: green
      name: green
      light: { graphic: "#697561", text: "#636f5b", graph: "#547f2f" }
      dark: { graphic: "#a3b09a", text: "#a3b09a", graph: "#709b4b" }
    - id: magenta
      name: magenta
      light: { graphic: "#7f5c80", text: "#7f5c80", graph: "#9f60a1" }
      dark: { graphic: "#b18bb1", text: "#b18bb1", graph: "#a060a1" }
