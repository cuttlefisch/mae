# SPDX-License-Identifier: GPL-3.0-or-later
# Palette bluloco, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: doom-bluloco-light, as is.
# - dark: doom-bluloco-dark, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f9f9f9"
    panel: "#e7e7e7"
    foreground: "#383a42"
    muted: "#9ca0a4"
    link: "#006ea1"
    accent: "#b914ad"
    mark: "#f0d68988"
  gallery:
    title: "#abb2bf"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fdfdfd"
    node-control: "#ffd5c3"
    line: "#9ca0a4"
    outline: "#bcbec1"
    highlight: "#ce33c0"
    blocked: "#d52753"
    zone-blue: "#daefff"
    zone-green: "#ddf3e0"
    zone-amber: "#f3ecd7"
    zone-orange: "#ffe6db"
    zone-violet: "#ece8ff"
    zone-grey: "#ececec"
    zone-brown: "#f6dfdc"
  graph:
    ink: "{ui.foreground}"
    accent: "#ce33c0"
    neighbour: "#0098dd"
    visited: "#dbdbdb"
    edge: "#b7babd"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#8f9096"
    string: "#af8d0c"
    number: "#ce33c0"
    constant: "#823ff1"
    keyword: "#0098dd"
    operator: "#7a82da"
    function: "#23974a"
    type: "#d52753"
    variable: "#199fac"

dark:
  ui:
    background: "#282c34"
    panel: "#23252a"
    foreground: "#abb2bf"
    muted: "#595e68"
    link: "#10b1fe"
    accent: "#ff78f8"
    mark: "#595e6866"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#4b4e53"
    node-soft: "#404348"
    node-control: "#5e3c34"
    line: "#595e68"
    outline: "#474c55"
    highlight: "#ff78f8"
    blocked: "#ff6480"
    zone-blue: "#21384d"
    zone-green: "#233c33"
    zone-amber: "#3a352b"
    zone-orange: "#423131"
    zone-violet: "#34324f"
    zone-grey: "#32363e"
    zone-brown: "#43373d"
  graph:
    ink: "{ui.foreground}"
    accent: "#d14bcb"
    neighbour: "#0096d9"
    visited: "{ui.panel}"
    edge: "#4a4e58"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#7a808b"
    string: "#f9c859"
    number: "#ff78f8"
    constant: "#9f7efe"
    keyword: "#10b1fe"
    operator: "#7a82da"
    function: "#3fc56b"
    type: "#ff6480"
    variable: "#8bcdef"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: magenta
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#db5f15", text: "#b04700", graph: "#db5f15" }
      dark: { graphic: "#ff936a", text: "#ff936a", graph: "#d26a42" }
    - id: yellow
      name: yellow
      light: { graphic: "#a18100", text: "#7e6500", graph: "#a18100" }
      dark: { graphic: "#f9c859", text: "#f9c859", graph: "#b08400" }
    - id: green
      name: green
      light: { graphic: "#23974a", text: "#007834", graph: "#23974a" }
      dark: { graphic: "#3fc56b", text: "#3fc56b", graph: "#0aa850" }
    - id: violet
      name: violet
      light: { graphic: "#823ff1", text: "#7f3bed", graph: "#823ff1" }
      dark: { graphic: "#9f7efe", text: "#9f7efe", graph: "#825fdc" }
    - id: magenta
      name: magenta
      light: { graphic: "#ce33c0", text: "#b914ad", graph: "#ce33c0" }
      dark: { graphic: "#ff78f8", text: "#ff78f8", graph: "#d14bcb" }
