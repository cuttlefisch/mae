# SPDX-License-Identifier: GPL-3.0-or-later
# Palette nova, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-nova: the same hues, darker, on a near-white paper.
# - dark: doom-nova, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#eff8fe"
    panel: "#e1eaef"
    foreground: "#243037"
    muted: "#697a85"
    link: "#416b9c"
    accent: "#9e7341"
    mark: "#dddd9588"
  gallery:
    title: "#c5d4dd"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#f6fbff"
    node-control: "#e9d9c6"
    line: "#697a85"
    outline: "#96a4ae"
    highlight: "{ui.accent}"
    blocked: "#a15556"
    zone-blue: "#d7eaff"
    zone-green: "#daf1da"
    zone-amber: "#e1e7cf"
    zone-orange: "#efe8df"
    zone-violet: "#f0e4f6"
    zone-grey: "#e2ebf1"
    zone-brown: "#e6e1e1"
  graph:
    ink: "{ui.foreground}"
    accent: "#aa6e18"
    neighbour: "#3972b5"
    visited: "#d1dae0"
    edge: "#8f9ea8"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#697a85"
    string: "#3d7f88"
    number: "#3d7f88"
    constant: "#3d7f88"
    keyword: "#6860a9"
    operator: "#61844d"
    function: "#4973a5"
    type: "#61844d"
    variable: "#a15556"

dark:
  ui:
    background: "#3c4c55"
    panel: "#44545d"
    foreground: "#c5d4dd"
    muted: "#899ba6"
    link: "#9bc8ff"
    accent: "#f2c38f"
    mark: "#899ba666"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#656f75"
    node-soft: "#5a646a"
    node-control: "#6b6458"
    line: "#899ba6"
    outline: "#6d7e89"
    highlight: "{ui.accent}"
    blocked: "#df8c8c"
    zone-blue: "#3e576f"
    zone-green: "#425b4b"
    zone-amber: "#535d4c"
    zone-orange: "#56544e"
    zone-violet: "#545263"
    zone-grey: "#475760"
    zone-brown: "#5b595b"
  graph:
    ink: "{ui.foreground}"
    accent: "#bb7d2e"
    neighbour: "#568fd3"
    visited: "{ui.panel}"
    edge: "#71828d"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#899ba6"
    string: "#7fc1ca"
    number: "#7fc1ca"
    constant: "#7fc1ca"
    keyword: "#9a93e1"
    operator: "#a8ce93"
    function: "#83afe5"
    type: "#a8ce93"
    variable: "#df8c8c"
