# SPDX-License-Identifier: GPL-3.0-or-later
# Palette peacock, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-peacock: the same hues, darker, on a near-white paper.
# - dark: doom-peacock, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f8f7f3"
    panel: "#e6e5e3"
    foreground: "#362c1e"
    muted: "#8e959a"
    link: "#006ca4"
    accent: "#9145a7"
    mark: "#d1e19588"
  gallery:
    title: "#ede0ce"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fcfbf9"
    node-control: "#f2d1f9"
    line: "#8e959a"
    outline: "#b2b6b8"
    highlight: "#9145a7"
    blocked: "#be2c00"
    zone-blue: "#dbedf8"
    zone-green: "#e1f1cc"
    zone-amber: "#e0e8bf"
    zone-orange: "#ffe3d7"
    zone-violet: "#f5e3f7"
    zone-grey: "#ebeae6"
    zone-brown: "#f5dcd1"
  graph:
    ink: "{ui.foreground}"
    accent: "#9145a7"
    neighbour: "#0075b1"
    visited: "#dad9d5"
    edge: "#adb1b4"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#889095"
    string: "#748400"
    number: "#be2c00"
    constant: "#be2c00"
    keyword: "#007777"
    operator: "#be2c00"
    function: "#748400"
    type: "#1d1d18"
    variable: "#1d1d18"

dark:
  ui:
    background: "#2b2a27"
    panel: "#1f1e1d"
    foreground: "#ede0ce"
    muted: "#73797e"
    link: "#51afef"
    accent: "#c678dd"
    mark: "#73797e66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#4c4c4a"
    node-soft: "#42413f"
    node-control: "#633624"
    line: "#73797e"
    outline: "#595c5e"
    highlight: "#c678dd"
    blocked: "#ff5d38"
    zone-blue: "#28363f"
    zone-green: "#2f381f"
    zone-amber: "#363c12"
    zone-orange: "#462d23"
    zone-violet: "#3d2e3e"
    zone-grey: "#353431"
    zone-brown: "#47352d"
  graph:
    ink: "{ui.foreground}"
    accent: "#b567cb"
    neighbour: "#3394d3"
    visited: "{ui.panel}"
    edge: "#5c6062"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#6d757b"
    string: "#bcd42a"
    number: "#ff5d38"
    constant: "#ff5d38"
    keyword: "#26a6a6"
    operator: "#ff5d38"
    function: "#bcd42a"
    type: "#f8f8f0"
    variable: "#f8f8f0"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: magenta
  swatches:
    - id: green
      name: green
      light: { graphic: "#5c7f24", text: "#4f7110", graph: "#5c7f24" }
      dark: { graphic: "#98be65", text: "#98be65", graph: "#769a41" }
    - id: magenta
      name: magenta
      light: { graphic: "#9145a7", text: "#9145a7", graph: "#9145a7" }
      dark: { graphic: "#c678dd", text: "#c678dd", graph: "#b567cb" }
