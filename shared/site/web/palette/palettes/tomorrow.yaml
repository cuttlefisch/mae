# SPDX-License-Identifier: GPL-3.0-or-later
# Palette tomorrow, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: doom-tomorrow-day, as is.
# - dark: doom-tomorrow-night, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#ffffff"
    panel: "#f2f2f2"
    foreground: "#4d4d4c"
    muted: "#a3a1a1"
    link: "#4170ad"
    accent: "#ab5900"
    mark: "#f3d48988"
  gallery:
    title: "#c5c8c6"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#ffffff"
    node-control: "#ffdac1"
    line: "#a3a1a1"
    outline: "#c2c1c1"
    highlight: "#d67100"
    blocked: "#c82829"
    zone-blue: "#e6f1ff"
    zone-green: "#edf6dc"
    zone-amber: "#fcf0d2"
    zone-orange: "#ffeee3"
    zone-violet: "#f7ecff"
    zone-grey: "#f2f2f2"
    zone-brown: "#fde4db"
  graph:
    ink: "{ui.foreground}"
    accent: "#d67100"
    neighbour: "#3c71b4"
    visited: "#e1e1e1"
    edge: "#bebcbc"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#8e908c"
    string: "#718c00"
    number: "#e27800"
    constant: "#e27800"
    keyword: "#8959a8"
    operator: "#4d4d4c"
    function: "#4271ae"
    type: "#b78f00"
    variable: "#c82829"

dark:
  ui:
    background: "#1d1f21"
    panel: "#161719"
    foreground: "#c5c8c6"
    muted: "#757878"
    link: "#81a2be"
    accent: "#de935f"
    mark: "#75787866"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#3e3f41"
    node-soft: "#343536"
    node-control: "#493122"
    line: "#757878"
    outline: "#545758"
    highlight: "#de935f"
    blocked: "#cc6666"
    zone-blue: "#1b2a37"
    zone-green: "#272b16"
    zone-amber: "#342a17"
    zone-orange: "#33251d"
    zone-violet: "#2e2432"
    zone-grey: "#27292b"
    zone-brown: "#352b29"
  graph:
    ink: "{ui.foreground}"
    accent: "#c3763e"
    neighbour: "#4393d0"
    visited: "{ui.panel}"
    edge: "#595b5c"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#6a6b6a"
    string: "#b5bd68"
    number: "#de935f"
    constant: "#de935f"
    keyword: "#b294bb"
    operator: "#c5c8c6"
    function: "#81a2be"
    type: "#f0c674"
    variable: "#cc6666"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: orange
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#d67100", text: "#ab5900", graph: "#d67100" }
      dark: { graphic: "#de935f", text: "#de935f", graph: "#c3763e" }
    - id: yellow
      name: yellow
      light: { graphic: "#ad8600", text: "#896a00", graph: "#ad8600" }
      dark: { graphic: "#f0c674", text: "#f0c674", graph: "#af8423" }
    - id: green
      name: green
      light: { graphic: "#718c00", text: "#607700", graph: "#718c00" }
      dark: { graphic: "#b5bd68", text: "#b5bd68", graph: "#8c9432" }
    - id: magenta
      name: magenta
      light: { graphic: "#bb6dd1", text: "#9b4fb1", graph: "#bb6dd1" }
      dark: { graphic: "#c9b4cf", text: "#c9b4cf", graph: "#945da3" }
