# SPDX-License-Identifier: GPL-3.0-or-later
# Palette henna, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-henna: the same hues, darker, on a near-white paper.
# - dark: doom-henna, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f1f7ff"
    panel: "#e7edf3"
    foreground: "#2e2e28"
    muted: "#9ba2ae"
    link: "#007681"
    accent: "#7c5ab0"
    mark: "#fdcf8c88"
  gallery:
    title: "#f8f8f0"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#f7fbff"
    node-control: "#f0cfdf"
    line: "#9ba2ae"
    outline: "#b8bfca"
    highlight: "#8260b6"
    blocked: "#b9180e"
    zone-blue: "#d0f0f9"
    zone-green: "#d5f1e5"
    zone-amber: "#efe8df"
    zone-orange: "#ffe1e1"
    zone-violet: "#e8e6ff"
    zone-grey: "#e4eaf2"
    zone-brown: "#f0dde0"
  graph:
    ink: "{ui.foreground}"
    accent: "#8260b6"
    neighbour: "#009baa"
    visited: "#d3d9e1"
    edge: "#b4bbc6"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#829195"
    string: "#009046"
    number: "#008069"
    constant: "#008069"
    keyword: "#008069"
    operator: "#b9180e"
    function: "#b9180e"
    type: "#b9180e"
    variable: "#2e2e28"

dark:
  ui:
    background: "#21272e"
    panel: "#1b1f23"
    foreground: "#f8f8f0"
    muted: "#6b717d"
    link: "#56b5c2"
    accent: "#c5a3ff"
    mark: "#6b717d66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#44484d"
    node-soft: "#3a3d42"
    node-control: "#4c3945"
    line: "#6b717d"
    outline: "#505660"
    highlight: "#c5a3ff"
    blocked: "#e74c3c"
    zone-blue: "#18353d"
    zone-green: "#1b372d"
    zone-amber: "#33302a"
    zone-orange: "#40292a"
    zone-violet: "#2f2d43"
    zone-grey: "#2b3138"
    zone-brown: "#3e3135"
  graph:
    ink: "{ui.foreground}"
    accent: "#9978d0"
    neighbour: "#009eae"
    visited: "{ui.panel}"
    edge: "#535a64"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#637276"
    string: "#53df83"
    number: "#1abc9c"
    constant: "#1abc9c"
    keyword: "#1abc9c"
    operator: "#e74c3c"
    function: "#e74c3c"
    type: "#e74c3c"
    variable: "#f8f8f0"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: violet
  swatches:
    - id: yellow
      name: yellow
      light: { graphic: "#9c722e", text: "#8d631c", graph: "#a26f07" }
      dark: { graphic: "#ecbe7b", text: "#ecbe7b", graph: "#b58127" }
    - id: violet
      name: violet
      light: { graphic: "#8260b6", text: "#7c5ab0", graph: "#8260b6" }
      dark: { graphic: "#c5a3ff", text: "#c5a3ff", graph: "#9978d0" }
    - id: magenta
      name: magenta
      light: { graphic: "#a8677f", text: "#975870", graph: "#b55d7f" }
      dark: { graphic: "#ffb8d1", text: "#ffb8d1", graph: "#c56b8e" }
