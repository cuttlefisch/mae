# SPDX-License-Identifier: GPL-3.0-or-later
# Palette xcode, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-xcode: the same hues, darker, on a near-white paper.
# - dark: doom-xcode, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f5f6fe"
    panel: "#ebedf1"
    foreground: "#2e2e2e"
    muted: "#808280"
    link: "#007591"
    accent: "#7a3eba"
    mark: "#e8d98b88"
  gallery:
    title: "#ffffff"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fafaff"
    node-control: "#fcd4c1"
    line: "#808280"
    outline: "#a7a9aa"
    highlight: "#7a3eba"
    blocked: "#bf2f29"
    zone-blue: "#d3eefe"
    zone-green: "#d4efec"
    zone-amber: "#eceade"
    zone-orange: "#fae4dd"
    zone-violet: "#ece5ff"
    zone-grey: "#e8e9f1"
    zone-brown: "#efdedf"
  graph:
    ink: "{ui.foreground}"
    accent: "#7a3eba"
    neighbour: "#0088a8"
    visited: "#d7d8e0"
    edge: "#a2a3a4"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#83909d"
    string: "#bf2f29"
    number: "#887818"
    constant: "#7a3eba"
    keyword: "#be1e6f"
    operator: "#af5600"
    function: "#8962b3"
    type: "#0088a8"
    variable: "#007390"

dark:
  ui:
    background: "#292a30"
    panel: "#252629"
    foreground: "#ffffff"
    muted: "#969896"
    link: "#5dd8ff"
    accent: "#ae74f5"
    mark: "#96989666"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#4b4c50"
    node-soft: "#404145"
    node-control: "#5e3a26"
    line: "#969896"
    outline: "#6d6f70"
    highlight: "#a167e6"
    blocked: "#fc6a5d"
    zone-blue: "#233743"
    zone-green: "#253938"
    zone-amber: "#36352c"
    zone-orange: "#422f29"
    zone-violet: "#382f4a"
    zone-grey: "#33343a"
    zone-brown: "#443536"
  graph:
    ink: "{ui.foreground}"
    accent: "#a167e6"
    neighbour: "#009bbf"
    visited: "{ui.panel}"
    edge: "#737576"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#6c7986"
    string: "#fc6a5d"
    number: "#d0bf68"
    constant: "#a167e6"
    keyword: "#fc5fa3"
    operator: "#fd8f3f"
    function: "#d0a8ff"
    type: "#5dd8ff"
    variable: "#41a1c0"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: violet
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#af5600", text: "#aa5300", graph: "#af5600" }
      dark: { graphic: "#fd8f3f", text: "#fd8f3f", graph: "#d56b04" }
    - id: yellow
      name: yellow
      light: { graphic: "#887818", text: "#7b6b00", graph: "#897800" }
      dark: { graphic: "#d0bf68", text: "#d0bf68", graph: "#9f8c25" }
    - id: violet
      name: violet
      light: { graphic: "#7a3eba", text: "#7a3eba", graph: "#7a3eba" }
      dark: { graphic: "#a167e6", text: "#ae74f5", graph: "#a167e6" }
