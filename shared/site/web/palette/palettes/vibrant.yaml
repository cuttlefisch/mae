# SPDX-License-Identifier: GPL-3.0-or-later
# Palette vibrant, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-vibrant: the same hues, darker, on a near-white paper.
# - dark: doom-vibrant, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f4f7ff"
    panel: "#e8ebf4"
    foreground: "#292e38"
    muted: "#91979e"
    link: "#0070aa"
    accent: "#9048a4"
    mark: "#fad18a88"
  gallery:
    title: "#bbc2cf"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fafbff"
    node-control: "#f9d6c4"
    line: "#91979e"
    outline: "#b3b8bf"
    highlight: "#9048a4"
    blocked: "#c12928"
    zone-blue: "#d8ecff"
    zone-green: "#ddefe4"
    zone-amber: "#f0e9de"
    zone-orange: "#f9e5de"
    zone-violet: "#e7e5ff"
    zone-grey: "#e7eaf2"
    zone-brown: "#f0dede"
  graph:
    ink: "{ui.foreground}"
    accent: "#9048a4"
    neighbour: "#0075b1"
    visited: "#d6d9e1"
    edge: "#aeb3ba"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#898f96"
    string: "#3e843a"
    number: "#a75713"
    constant: "#745ab5"
    keyword: "#0075b1"
    operator: "#9048a4"
    function: "#00929e"
    type: "#a3781d"
    variable: "#90679c"

dark:
  ui:
    background: "#242730"
    panel: "#2a2e38"
    foreground: "#bbc2cf"
    muted: "#62686e"
    link: "#51afef"
    accent: "#c57bdb"
    mark: "#62686e66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#46484e"
    node-soft: "#3c3e44"
    node-control: "#54392d"
    line: "#62686e"
    outline: "#4b5057"
    highlight: "#c57bdb"
    blocked: "#ff665c"
    zone-blue: "#213346"
    zone-green: "#26352f"
    zone-amber: "#35302b"
    zone-orange: "#3a2e2c"
    zone-violet: "#302e46"
    zone-grey: "#2e313a"
    zone-brown: "#3e3337"
  graph:
    ink: "{ui.foreground}"
    accent: "#b36ac8"
    neighbour: "#3394d3"
    visited: "{ui.panel}"
    edge: "#4e535b"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#6b7177"
    string: "#7bc275"
    number: "#e69055"
    constant: "#a991f1"
    keyword: "#51afef"
    operator: "#c57bdb"
    function: "#5cefff"
    type: "#fcce7b"
    variable: "#dcb0e9"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: magenta
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#a75713", text: "#a5550f", graph: "#a75713" }
      dark: { graphic: "#e69055", text: "#e69055", graph: "#c77438" }
    - id: yellow
      name: yellow
      light: { graphic: "#a3781d", text: "#8b6300", graph: "#a57710" }
      dark: { graphic: "#fcce7b", text: "#fcce7b", graph: "#b18324" }
    - id: green
      name: green
      light: { graphic: "#3e843a", text: "#32792f", graph: "#3e843a" }
      dark: { graphic: "#7bc275", text: "#7bc275", graph: "#5aa054" }
    - id: magenta
      name: magenta
      light: { graphic: "#9048a4", text: "#9048a4", graph: "#9048a4" }
      dark: { graphic: "#c57bdb", text: "#c57bdb", graph: "#b36ac8" }
