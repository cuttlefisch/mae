# SPDX-License-Identifier: GPL-3.0-or-later
# Palette zenburn, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-zenburn: the same hues, darker, on a near-white paper.
# - dark: doom-zenburn, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f7f7f7"
    panel: "#ebebeb"
    foreground: "#2e2e2e"
    muted: "#7a7a73"
    link: "#307477"
    accent: "#6b639e"
    mark: "#e7d7a788"
  gallery:
    title: "#dcdcdc"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fbfbfb"
    node-control: "#f5d3e9"
    line: "#7a7a73"
    outline: "#a4a49f"
    highlight: "#6f67a2"
    blocked: "#925d5e"
    zone-blue: "#d7f0f1"
    zone-green: "#dfefdf"
    zone-amber: "#f0e9d5"
    zone-orange: "#f9e6da"
    zone-violet: "#e9e7fb"
    zone-grey: "#eaeaea"
    zone-brown: "#eee0dc"
  graph:
    ink: "{ui.foreground}"
    accent: "#6f63b1"
    neighbour: "#009ca2"
    visited: "#d9d9d9"
    edge: "#9e9e99"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#537153"
    string: "#925d5e"
    number: "#2e2e2e"
    constant: "#668f67"
    keyword: "#928356"
    operator: "#428588"
    function: "#3e8c8f"
    type: "#417c7f"
    variable: "#976b4d"

dark:
  ui:
    background: "#3f3f3f"
    panel: "#383838"
    foreground: "#dcdcdc"
    muted: "#989890"
    link: "#8cd0d3"
    accent: "#aaa2e2"
    mark: "#98989066"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#626262"
    node-soft: "#575757"
    node-control: "#67564b"
    line: "#989890"
    outline: "#777772"
    highlight: "#a9a1e1"
    blocked: "#cc9393"
    zone-blue: "#394e4f"
    zone-green: "#414e41"
    zone-amber: "#4f493a"
    zone-orange: "#55463c"
    zone-violet: "#494857"
    zone-grey: "#4a4a4a"
    zone-brown: "#584c49"
  graph:
    ink: "{ui.foreground}"
    accent: "#8b7fd0"
    neighbour: "#00a0a5"
    visited: "{ui.panel}"
    edge: "#7c7c77"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#7f9f7f"
    string: "#cc9393"
    number: "#dcdcdc"
    constant: "#bfebbf"
    keyword: "#f0dfaf"
    operator: "#8cd0d3"
    function: "#93e0e3"
    type: "#7cb8bb"
    variable: "#dfaf8f"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: violet
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#976b4d", text: "#8c6143", graph: "#ab6025" }
      dark: { graphic: "#dfaf8f", text: "#dfaf8f", graph: "#c3773e" }
    - id: yellow
      name: yellow
      light: { graphic: "#928356", text: "#78693d", graph: "#9e8114" }
      dark: { graphic: "#f0dfaf", text: "#f0dfaf", graph: "#a88822" }
    - id: violet
      name: violet
      light: { graphic: "#6f67a2", text: "#6b639e", graph: "#6f63b1" }
      dark: { graphic: "#a9a1e1", text: "#aaa2e2", graph: "#8b7fd0" }
