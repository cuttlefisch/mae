# SPDX-License-Identifier: GPL-3.0-or-later
# Palette nord, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: doom-nord-light, as is.
# - dark: doom-nord, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#e5e9f0"
    panel: "#d8dee9"
    foreground: "#3b4252"
    muted: "#a1acc0"
    link: "#32649e"
    accent: "#a84022"
    mark: "#f5d38988"
  gallery:
    title: "#eceff4"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#f0f3f7"
    node-soft: "#eaedf1"
    node-control: "#f1c4bb"
    line: "#a1acc0"
    outline: "#b8c1d1"
    highlight: "#ac4426"
    blocked: "#99324b"
    zone-blue: "#ccdef4"
    zone-green: "#d0e1d7"
    zone-amber: "#e1dbcf"
    zone-orange: "#edd5d3"
    zone-violet: "#e8d4eb"
    zone-grey: "#d8dce3"
    zone-brown: "#dfd1d5"
  graph:
    ink: "{ui.foreground}"
    accent: "#ac4426"
    neighbour: "#336eaf"
    visited: "#c8ccd2"
    edge: "#b5bece"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#7c8697"
    string: "#4f894c"
    number: "#97365b"
    constant: "#97365b"
    keyword: "#3b6ea8"
    operator: "#3b6ea8"
    function: "#29838d"
    type: "#9a7500"
    variable: "#842879"

dark:
  ui:
    background: "#2e3440"
    panel: "#272c36"
    foreground: "#eceff4"
    muted: "#9099ab"
    link: "#81a1c1"
    accent: "#d38972"
    mark: "#9099ab66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#53575e"
    node-soft: "#484c53"
    node-control: "#5e4847"
    line: "#9099ab"
    outline: "#6c7484"
    highlight: "#d08770"
    blocked: "#bf616a"
    zone-blue: "#1e4160"
    zone-green: "#35423a"
    zone-amber: "#44403a"
    zone-orange: "#473a3e"
    zone-violet: "#2b4568"
    zone-grey: "#383e4b"
    zone-brown: "#49414a"
  graph:
    ink: "{ui.foreground}"
    accent: "#c97054"
    neighbour: "#4c91d1"
    visited: "{ui.panel}"
    edge: "#717989"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#767e8e"
    string: "#a3be8c"
    number: "#b48ead"
    constant: "#81a1c1"
    keyword: "#81a1c1"
    operator: "#81a1c1"
    function: "#88c0d0"
    type: "#8fbcbb"
    variable: "#d8dee9"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: orange
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#ac4426", text: "#a84022", graph: "#ac4426" }
      dark: { graphic: "#d08770", text: "#d38972", graph: "#c97054" }
    - id: yellow
      name: yellow
      light: { graphic: "#9a7500", text: "#7b5d00", graph: "#9a7500" }
      dark: { graphic: "#ebcb8b", text: "#ebcb8b", graph: "#ae8523" }
    - id: green
      name: green
      light: { graphic: "#4f894c", text: "#356e32", graph: "#4a8a47" }
      dark: { graphic: "#a3be8c", text: "#a3be8c", graph: "#729b49" }
