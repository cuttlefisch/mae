# SPDX-License-Identifier: GPL-3.0-or-later
# Palette ayu, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: doom-ayu-light, as is.
# - dark: doom-ayu-dark, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#fafafa"
    panel: "#f1f2f2"
    foreground: "#575f66"
    muted: "#ba9199"
    link: "#0073b4"
    accent: "#597900"
    mark: "#ffce8d88"
  gallery:
    title: "#bfbdb6"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fefefe"
    node-control: "#ffd8c1"
    line: "#ba9199"
    outline: "#d1b5ba"
    highlight: "#719800"
    blocked: "#f07171"
    zone-blue: "#def0ff"
    zone-green: "#e6f2d6"
    zone-amber: "#faead7"
    zone-orange: "#ffe8da"
    zone-violet: "#f1e9fb"
    zone-grey: "#ededed"
    zone-brown: "#f4e2dc"
  graph:
    ink: "{ui.foreground}"
    accent: "#719800"
    neighbour: "#399ee6"
    visited: "#dcdcdc"
    edge: "#ceb0b5"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#8e9092"
    string: "#759d00"
    number: "#c58405"
    constant: "#a37acc"
    keyword: "#de741c"
    operator: "#d27a4e"
    function: "#c58405"
    type: "#b48a4f"
    variable: "#575f66"

dark:
  ui:
    background: "#0d1017"
    panel: "#0a0c11"
    foreground: "#bfbdb6"
    muted: "#565b66"
    link: "#59c2ff"
    accent: "#7fd962"
    mark: "#565b6666"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#2c2f33"
    node-soft: "#232529"
    node-control: "#3e1d0c"
    line: "#565b66"
    outline: "#3a3f48"
    highlight: "#7fd962"
    blocked: "#f07178"
    zone-blue: "#071b2a"
    zone-green: "#0b1e12"
    zone-amber: "#201710"
    zone-orange: "#241510"
    zone-violet: "#1b1529"
    zone-grey: "#161920"
    zone-brown: "#241b1e"
  graph:
    ink: "{ui.foreground}"
    accent: "#4ba429"
    neighbour: "#2396d1"
    visited: "{ui.panel}"
    edge: "#3e434d"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#5c6067"
    string: "#7fd962"
    number: "#ffb454"
    constant: "#d2a6ff"
    keyword: "#ff8f40"
    operator: "#f29668"
    function: "#ffb454"
    type: "#e6b673"
    variable: "#bfbdb6"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: green
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#d96f14", text: "#af5600", graph: "#d96f14" }
      dark: { graphic: "#ff8f40", text: "#ff8f40", graph: "#d66a04" }
    - id: green
      name: green
      light: { graphic: "#719800", text: "#597900", graph: "#719800" }
      dark: { graphic: "#7fd962", text: "#7fd962", graph: "#4ba429" }
    - id: teal
      name: teal
      light: { graphic: "#209e7a", text: "#007e5f", graph: "#1c9e7a" }
      dark: { graphic: "#95e6cb", text: "#95e6cb", graph: "#008468" }
