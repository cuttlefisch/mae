# SPDX-License-Identifier: GPL-3.0-or-later
# Palette sourcerer, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-sourcerer: the same hues, darker, on a near-white paper.
# - dark: doom-sourcerer, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f7f7f7"
    panel: "#e5e5e5"
    foreground: "#2f2f20"
    muted: "#868e95"
    link: "#446a8e"
    accent: "#965700"
    mark: "#ffce8d88"
  gallery:
    title: "#c2c2b0"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fbfbfb"
    node-control: "#f7d5b7"
    line: "#868e95"
    outline: "#acb2b6"
    highlight: "#a66100"
    blocked: "#94303e"
    zone-blue: "#daecff"
    zone-green: "#ecedce"
    zone-amber: "#f5e3cb"
    zone-orange: "#f8e5d3"
    zone-violet: "#e3e3ff"
    zone-grey: "#eaeaea"
    zone-brown: "#eee0db"
  graph:
    ink: "{ui.foreground}"
    accent: "#a66100"
    neighbour: "#2e74b3"
    visited: "#d9d9d9"
    edge: "#a7acb1"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#8b8b7a"
    string: "#65653e"
    number: "#8f5e00"
    constant: "#346c6c"
    keyword: "#4e7499"
    operator: "#526f00"
    function: "#0a0800"
    type: "#5e5e81"
    variable: "#0a0800"

dark:
  ui:
    background: "#171717"
    panel: "#222222"
    foreground: "#c2c2b0"
    muted: "#5d656b"
    link: "#87afd7"
    accent: "#ff9800"
    mark: "#5d656b66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#363636"
    node-soft: "#2c2c2c"
    node-control: "#462600"
    line: "#5d656b"
    outline: "#43484c"
    highlight: "#ff9800"
    blocked: "#aa4450"
    zone-blue: "#122231"
    zone-green: "#22220e"
    zone-amber: "#2e1f0a"
    zone-orange: "#2d1c0b"
    zone-violet: "#212033"
    zone-grey: "#202020"
    zone-brown: "#2e221d"
  graph:
    ink: "{ui.foreground}"
    accent: "#c77600"
    neighbour: "#4c91d2"
    visited: "{ui.panel}"
    edge: "#474c50"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#686858"
    string: "#87875f"
    number: "#cc8800"
    constant: "#578f8f"
    keyword: "#87afd7"
    operator: "#719611"
    function: "#faf4c6"
    type: "#8181a6"
    variable: "#faf4c6"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: orange
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#a66100", text: "#965700", graph: "#a66100" }
      dark: { graphic: "#ff9800", text: "#ff9800", graph: "#c77600" }
    - id: green
      name: green
      light: { graphic: "#65653e", text: "#65653e", graph: "#686600" }
      dark: { graphic: "#87875f", text: "#8b8b63", graph: "#8b8922" }
