# Palette gruvbox, adjusted for AA. gruvbox's swatches
# (https://github.com/morhetz/gruvbox, MIT; data/PROVENANCE), some retouched where
# they fell short: gruvbox's grey #928374 stays at 3.2:1 on the light page, so muted
# is darker; links are somewhat darker (light) or lighter (dark) than gruvbox's
# blues. The chord graph's "gruvbox" theme explains each retouch (graph
# src/themes.ts).
#
# A value is a lowercase "#rrggbb" or "#rrggbbaa", or a reference to another
# role: "{group.role}" in the same mode, "{light.group.role}" in the other. The
# roles and what each requires are in the README.

light:
  ui:
    background: "#fbf1c7"
    panel: "#f2e5bc"
    muted: "#665c54"
    foreground: "#3c3836"
    link: "#065e6e"
    accent: "#9e3403"
    mark: "#fabd2f88"
  gallery:
    title: "{ui.background}"
  # The maps: node is bg0_h; node-soft, in light mode a little darker than the
  # page, and in dark mode between node and the page; the lines, fg3 and fg4;
  # highlight and blocked, the faded orange and red. The zones and the control node,
  # the hue of each gruvbox swatch (OKLCH) with little chroma: mixed with the
  # page's cream, everything would come out yellow. node-soft, node-control and
  # zone-brown, retouched so that a node is not lost inside a zone (see the
  # distance tests).
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#f9f5d7"
    node-soft: "#f7eecf"
    node-control: "#fad0bb"
    line: "#665c54"
    outline: "#7c6f64"
    highlight: "#af3a03"
    blocked: "#9d0006"
    zone-blue: "#d0ebec"
    zone-green: "#e6e7cf"
    zone-amber: "#f4e2c8"
    zone-orange: "#faded1"
    zone-violet: "#f5dde6"
    zone-grey: "#e9e3de"
    zone-brown: "#f6e6df"
  graph:
    ink: "{ui.foreground}"
    accent: "#d65d0e"
    neighbour: "#2f7aa8"
    visited: "#ebdbb2"
    edge: "#928374"
  # The code blocks: gruvbox's syntax colours (the faded ones in light mode).
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "{ui.muted}"
    string: "#79740e"
    number: "#8f3f71"
    constant: "{code.number}"
    keyword: "#9d0006"
    operator: "#af3a03"
    function: "#427b58"
    type: "#b57614"
    variable: "#076678"

dark:
  ui:
    background: "#282828"
    panel: "#32302f"
    muted: "#b0a28e"
    foreground: "#ebdbb2"
    link: "#96b2a7"
    accent: "#fe8019"
    mark: "#b5761488"
  gallery:
    title: "{light.gallery.title}"
  # node is bg0_s, and node-soft, between it and the page; the lines, fg3 and fg4;
  # highlight, the bright orange; blocked, a red lighter than gruvbox's (#fb4934 does
  # not reach 4.5:1 on the zones). The zones, as in light mode.
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#32302f"
    node-soft: "#2e2c2b"
    node-control: "#533929"
    line: "#bdae93"
    outline: "#a89984"
    highlight: "#fe8019"
    blocked: "#ff8a7a"
    zone-blue: "#263c3d"
    zone-green: "#393926"
    zone-amber: "#433520"
    zone-orange: "#483228"
    zone-violet: "#443239"
    zone-grey: "#3f3c38"
    zone-brown: "#3e3630"
  graph:
    ink: "{ui.foreground}"
    accent: "#e07114"
    neighbour: "#389ec1"
    visited: "{ui.panel}"
    edge: "#928374"
  # The code blocks: gruvbox's syntax colours.
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "{ui.muted}"
    string: "#b8bb26"
    number: "#d3869b"
    constant: "{code.number}"
    keyword: "#fb4934"
    operator: "#fe8019"
    function: "#8ec07c"
    type: "#fabd2f"
    variable: "#83a598"


# Emphasis swatches generated by scripts/from-doom.mjs from data/doom.json:
# not edited by hand; regenerate with `npm run doom`. The colours, from Doom Emacs
# (https://github.com/doomemacs/themes, MIT, commit a59202912ad5), its themes:
# light, doom-gruvbox-light; dark, doom-gruvbox.
# The default, the first, is ui.accent, diagram.highlight and graph.accent from
# above, as they are; the others, like the Doom palettes' (README, "Emphasis").
emphasis:
  defaultId: orange
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#af3a03", text: "#9e3403", graph: "#d65d0e" }
      dark: { graphic: "#fe8019", text: "#fe8019", graph: "#e07114" }
    - id: yellow
      name: yellow
      light: { graphic: "#b57614", text: "#905b00", graph: "#b57614" }
      dark: { graphic: "#fabd2f", text: "#fabd2f", graph: "#b38300" }
    - id: green
      name: green
      light: { graphic: "#79740e", text: "#6e6900", graph: "#797400" }
      dark: { graphic: "#b8bb26", text: "#b8bb26", graph: "#919300" }
    - id: violet
      name: violet
      light: { graphic: "#8f3f71", text: "#8f3f71", graph: "#8f3f71" }
      dark: { graphic: "#d3869b", text: "#d3869b", graph: "#c76b86" }
