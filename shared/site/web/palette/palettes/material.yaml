# SPDX-License-Identifier: GPL-3.0-or-later
# Palette material, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-material: the same hues, darker, on a near-white paper.
# - dark: doom-material, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#eff9fd"
    panel: "#dfe9ee"
    foreground: "#233131"
    muted: "#95a0a6"
    link: "#4165b4"
    accent: "#ac492a"
    mark: "#fad18a88"
  gallery:
    title: "#eeffff"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#f6fcff"
    node-control: "#fcd4c8"
    line: "#95a0a6"
    outline: "#b4bec4"
    highlight: "#b34f30"
    blocked: "#c40642"
    zone-blue: "#daeaff"
    zone-green: "#deefde"
    zone-amber: "#eee9d9"
    zone-orange: "#f8e5e0"
    zone-violet: "#efe6f6"
    zone-grey: "#e2ecf0"
    zone-brown: "#eddfe1"
  graph:
    ink: "{ui.foreground}"
    accent: "#b34f30"
    neighbour: "#496dbd"
    visited: "#d1dbdf"
    edge: "#afbabf"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#839299"
    string: "#6d8e34"
    number: "#b34f30"
    constant: "#b34f30"
    keyword: "#3289a9"
    operator: "#3289a9"
    function: "#496dbd"
    type: "#8a57aa"
    variable: "#a57600"

dark:
  ui:
    background: "#263238"
    panel: "#1c262b"
    foreground: "#eeffff"
    muted: "#737e84"
    link: "#82aaff"
    accent: "#f78c6c"
    mark: "#737e8466"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#4c5357"
    node-soft: "#41494c"
    node-control: "#5f413a"
    line: "#737e84"
    outline: "#576268"
    highlight: "#f78c6c"
    blocked: "#ff5370"
    zone-blue: "#2a3c50"
    zone-green: "#2e3f34"
    zone-amber: "#3c3b30"
    zone-orange: "#433735"
    zone-violet: "#3c3746"
    zone-grey: "#303c42"
    zone-brown: "#463d41"
  graph:
    ink: "{ui.foreground}"
    accent: "#d16a4b"
    neighbour: "#6389dc"
    visited: "{ui.panel}"
    edge: "#5b666c"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#6d7c82"
    string: "#c3e88d"
    number: "#f78c6c"
    constant: "#f78c6c"
    keyword: "#89ddff"
    operator: "#89ddff"
    function: "#82aaff"
    type: "#c792ea"
    variable: "#ffcb6b"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: orange
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#b34f30", text: "#ac492a", graph: "#b34f30" }
      dark: { graphic: "#f78c6c", text: "#f78c6c", graph: "#d16a4b" }
    - id: yellow
      name: yellow
      light: { graphic: "#a57600", text: "#886100", graph: "#a57600" }
      dark: { graphic: "#ffcb6b", text: "#ffcb6b", graph: "#b38211" }
    - id: green
      name: green
      light: { graphic: "#6d8e34", text: "#537211", graph: "#6d8e34" }
      dark: { graphic: "#c3e88d", text: "#c3e88d", graph: "#789a40" }
