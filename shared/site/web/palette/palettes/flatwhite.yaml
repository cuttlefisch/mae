# SPDX-License-Identifier: GPL-3.0-or-later
# Palette flatwhite, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: doom-flatwhite, as is.
# - dark: composed from doom-flatwhite: the same hues, lighter, on a dark paper.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f7f3ee"
    panel: "#f1ece4"
    foreground: "#605a52"
    muted: "#b9a992"
    link: "#5d6b88"
    accent: "#487466"
    mark: "#ecd4b188"
  gallery:
    title: "#d7d0c7"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#fffdfb"
    node-soft: "#faf7f4"
    node-control: "#e1d3bf"
    line: "#b9a992"
    outline: "#cec2b1"
    highlight: "#5f8c7d"
    blocked: "#955f5f"
    zone-blue: "#e1e7f3"
    zone-green: "#e6eacc"
    zone-amber: "#f4e2ca"
    zone-orange: "#f4e2ca"
    zone-violet: "#f2e1ec"
    zone-grey: "#eae6e1"
    zone-brown: "#eedcd2"
  graph:
    ink: "{ui.foreground}"
    accent: "#009778"
    neighbour: "#5d80ca"
    visited: "#d9d5d0"
    edge: "#cbbfad"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#9a8a74"
    string: "#81895d"
    number: "#957f5f"
    constant: "#9c739c"
    keyword: "#955f5f"
    operator: "#7382a0"
    function: "#9c739c"
    type: "#957f5f"
    variable: "#644a64"

dark:
  ui:
    background: "#201e1a"
    panel: "#1a1711"
    foreground: "#d7d0c7"
    muted: "#746652"
    link: "#a8b8d8"
    accent: "#95c4b3"
    mark: "#74665266"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#403e3c"
    node-soft: "#353432"
    node-control: "#40313d"
    line: "#746652"
    outline: "#554b3d"
    highlight: "#95c4b3"
    blocked: "#da9f9e"
    zone-blue: "#232831"
    zone-green: "#272a12"
    zone-amber: "#332612"
    zone-orange: "#332612"
    zone-violet: "#30242c"
    zone-grey: "#2a2823"
    zone-brown: "#362a22"
  graph:
    ink: "{ui.foreground}"
    accent: "#1ca382"
    neighbour: "#678ad5"
    visited: "{ui.panel}"
    edge: "#594f40"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#756753"
    string: "#b6bf91"
    number: "#ccb593"
    constant: "#d3a8d3"
    keyword: "#da9f9e"
    operator: "#a8b8d8"
    function: "#d3a8d3"
    type: "#ccb593"
    variable: "#b699b6"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: teal
  swatches:
    - id: teal
      name: green azulado
      light: { graphic: "#5f8c7d", text: "#487466", graph: "#009778" }
      dark: { graphic: "#95c4b3", text: "#95c4b3", graph: "#1ca382" }
