# SPDX-License-Identifier: GPL-3.0-or-later
# Palette spacegrey, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-spacegrey: the same hues, darker, on a near-white paper.
# - dark: doom-spacegrey, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f3f7ff"
    panel: "#e3e8f0"
    foreground: "#2a2e35"
    muted: "#83898f"
    link: "#596a7b"
    accent: "#9145a7"
    mark: "#fdcf8c88"
  gallery:
    title: "#c0c5ce"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#f9fbff"
    node-control: "#efd1ff"
    line: "#83898f"
    outline: "#a9aeb5"
    highlight: "#9145a7"
    blocked: "#993f4a"
    zone-blue: "#d6ebff"
    zone-green: "#e1eee2"
    zone-amber: "#f0e7dd"
    zone-orange: "#f8e5e3"
    zone-violet: "#f1e3ff"
    zone-grey: "#e6eaf2"
    zone-brown: "#ebdee3"
  graph:
    ink: "{ui.foreground}"
    accent: "#9145a7"
    neighbour: "#2870ae"
    visited: "#d5d9e1"
    edge: "#a3a9af"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#82909b"
    string: "#647d4e"
    number: "#9a5640"
    constant: "#9a5640"
    keyword: "#815d7b"
    operator: "#2a2e35"
    function: "#5d6e7f"
    type: "#9c722e"
    variable: "#993f4a"

dark:
  ui:
    background: "#2b303b"
    panel: "#232830"
    foreground: "#c0c5ce"
    muted: "#73797e"
    link: "#8fa1b3"
    accent: "#c779de"
    mark: "#73797e66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#4f5259"
    node-soft: "#44474e"
    node-control: "#5a4443"
    line: "#73797e"
    outline: "#595e66"
    highlight: "#c678dd"
    blocked: "#bf616a"
    zone-blue: "#253d4f"
    zone-green: "#323e37"
    zone-amber: "#403b36"
    zone-orange: "#433639"
    zone-violet: "#3f344f"
    zone-grey: "#353a46"
    zone-brown: "#453c45"
  graph:
    ink: "{ui.foreground}"
    accent: "#b567cb"
    neighbour: "#4b91d1"
    visited: "{ui.panel}"
    edge: "#5c6269"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#6e7c87"
    string: "#a3be8c"
    number: "#d08770"
    constant: "#d08770"
    keyword: "#b48ead"
    operator: "#c0c5ce"
    function: "#8fa1b3"
    type: "#ecbe7b"
    variable: "#bf616a"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: magenta
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#9a5640", text: "#9a5640", graph: "#a44f33" }
      dark: { graphic: "#d08770", text: "#d08770", graph: "#c97054" }
    - id: yellow
      name: yellow
      light: { graphic: "#9c722e", text: "#896018", graph: "#a26f07" }
      dark: { graphic: "#ecbe7b", text: "#ecbe7b", graph: "#b58127" }
    - id: green
      name: green
      light: { graphic: "#647d4e", text: "#576f41", graph: "#5a8230" }
      dark: { graphic: "#a3be8c", text: "#a3be8c", graph: "#729b49" }
    - id: violet
      name: violet
      light: { graphic: "#815d7b", text: "#815d7b", graph: "#924e89" }
      dark: { graphic: "#b48ead", text: "#b48ead", graph: "#b76fac" }
    - id: magenta
      name: magenta
      light: { graphic: "#9145a7", text: "#9145a7", graph: "#9145a7" }
      dark: { graphic: "#c678dd", text: "#c779de", graph: "#b567cb" }
