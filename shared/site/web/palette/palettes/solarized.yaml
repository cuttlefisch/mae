# SPDX-License-Identifier: GPL-3.0-or-later
# Palette solarized, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: doom-solarized-light, as is.
# - dark: doom-solarized-dark, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#fdf6e3"
    panel: "#eee8d5"
    foreground: "#556b72"
    muted: "#96a7a9"
    link: "#006dad"
    accent: "#c22274"
    mark: "#f5d38988"
  gallery:
    title: "#839496"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fefaef"
    node-control: "#ffcfd7"
    line: "#96a7a9"
    outline: "#b9c2bd"
    highlight: "#d33682"
    blocked: "#dc322f"
    zone-blue: "#deecee"
    zone-green: "#ebedc1"
    zone-amber: "#f8e5bc"
    zone-orange: "#ffe3d1"
    zone-violet: "#ffdfdf"
    zone-grey: "#f0e9d6"
    zone-brown: "#fadbc5"
  graph:
    ink: "{ui.foreground}"
    accent: "#d33682"
    neighbour: "#2d91d8"
    visited: "#dfd8c6"
    edge: "#b4beba"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#819293"
    string: "#259e95"
    number: "#6c71c4"
    constant: "#6c71c4"
    keyword: "#849700"
    operator: "#268bd2"
    function: "#d33682"
    type: "#b38800"
    variable: "#268bd2"

dark:
  ui:
    background: "#002b36"
    panel: "#00212b"
    foreground: "#839496"
    muted: "#405a61"
    link: "#3093da"
    accent: "#ef5299"
    mark: "#405a6166"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#354b52"
    node-soft: "#2b4047"
    node-control: "#54314b"
    line: "#405a61"
    outline: "#2b4952"
    highlight: "#d33682"
    blocked: "#dc322f"
    zone-blue: "#00364d"
    zone-green: "#153728"
    zone-amber: "#28362a"
    zone-orange: "#302f30"
    zone-violet: "#322c3d"
    zone-grey: "#0b3540"
    zone-brown: "#2d363b"
  graph:
    ink: "{ui.foreground}"
    accent: "#d33682"
    neighbour: "#0075ba"
    visited: "{ui.panel}"
    edge: "#2e4b54"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#59747b"
    string: "#2aa198"
    number: "#d33682"
    constant: "#d33682"
    keyword: "#859900"
    operator: "#cb4b16"
    function: "#268bd2"
    type: "#b58900"
    variable: "#6c71c4"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: magenta
  swatches:
    - id: yellow
      name: yellow
      light: { graphic: "#a87f00", text: "#846300", graph: "#a87f00" }
      dark: { graphic: "#b58900", text: "#b58900", graph: "#8e6b00" }
    - id: green
      name: green
      light: { graphic: "#7b8e00", text: "#606f00", graph: "#7b8e00" }
      dark: { graphic: "#859900", text: "#859900", graph: "#6a7a00" }
    - id: magenta
      name: magenta
      light: { graphic: "#d33682", text: "#c22274", graph: "#d33682" }
      dark: { graphic: "#d33682", text: "#ef5299", graph: "#d33682" }
