# SPDX-License-Identifier: GPL-3.0-or-later
# Palette dark-plus, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-dark+: the same hues, darker, on a near-white paper.
# - dark: doom-dark+, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#f7f7f7"
    panel: "#ececed"
    foreground: "#2e2e2e"
    muted: "#868687"
    link: "#006ea4"
    accent: "#307525"
    mark: "#f1d49688"
  gallery:
    title: "#d4d4d4"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#fbfbfb"
    node-control: "#f0d5ed"
    line: "#868687"
    outline: "#acacad"
    highlight: "#307525"
    blocked: "#a34043"
    zone-blue: "#dbedfa"
    zone-green: "#e0efdd"
    zone-amber: "#f2e9d6"
    zone-orange: "#fbe5dd"
    zone-violet: "#f5e4f2"
    zone-grey: "#eaeaea"
    zone-brown: "#eedfdd"
  graph:
    ink: "{ui.foreground}"
    accent: "#307525"
    neighbour: "#006ea4"
    visited: "#d9d9d9"
    edge: "#a7a7a7"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#307525"
    string: "#9f583e"
    number: "#6b825f"
    constant: "#006ea4"
    keyword: "#006ea4"
    operator: "#2c8aa9"
    function: "#84844f"
    type: "#008771"
    variable: "#2c8aa9"

dark:
  ui:
    background: "#1e1e1e"
    panel: "#252526"
    foreground: "#d4d4d4"
    muted: "#777778"
    link: "#339cdb"
    accent: "#579c4c"
    mark: "#77777866"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#3e3e3e"
    node-soft: "#343434"
    node-control: "#492f27"
    line: "#777778"
    outline: "#565656"
    highlight: "#579c4c"
    blocked: "#d16969"
    zone-blue: "#1a2a35"
    zone-green: "#202b1e"
    zone-amber: "#2e2719"
    zone-orange: "#35221c"
    zone-violet: "#2f232e"
    zone-grey: "#282828"
    zone-brown: "#382927"
  graph:
    ink: "{ui.foreground}"
    accent: "#579c4c"
    neighbour: "#2a95d4"
    visited: "{ui.panel}"
    edge: "#5a5a5b"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#579c4c"
    string: "#db8e73"
    number: "#b5cea8"
    constant: "#339cdb"
    keyword: "#339cdb"
    operator: "#85ddff"
    function: "#d9daa2"
    type: "#35cdaf"
    variable: "#85ddff"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: green
  swatches:
    - id: yellow
      name: yellow
      light: { graphic: "#8e7337", text: "#82672b", graph: "#967000" }
      dark: { graphic: "#d7ba7d", text: "#d7ba7d", graph: "#ad8622" }
    - id: green
      name: green
      light: { graphic: "#307525", text: "#307525", graph: "#307525" }
      dark: { graphic: "#579c4c", text: "#579c4c", graph: "#579c4c" }
    - id: magenta
      name: magenta
      light: { graphic: "#8e538a", text: "#8e538a", graph: "#91508d" }
      dark: { graphic: "#c586c0", text: "#c586c0", graph: "#b470af" }
