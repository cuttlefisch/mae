# SPDX-License-Identifier: GPL-3.0-or-later
# Palette oceanic-next, for readers who choose it: the colours of the Doom Emacs
# themes (https://github.com/doomemacs/themes, MIT, commit a59202912ad5; the
# licence and provenance are in data/PROVENANCE).
# - light: composed from doom-oceanic-next: the same hues, darker, on a near-white paper.
# - dark: doom-oceanic-next, as is.
# Not the default: AA contrasts are not required of it (owner, 2026-11-13),
# except the links' (2026-11-17); what makes the site work is.
#
# Generated by scripts/from-doom.mjs from data/doom.json: not edited by hand;
# change the program or the data and regenerate with `npm run doom`.
isDefault: false

light:
  ui:
    background: "#eff8fe"
    panel: "#e4edf3"
    foreground: "#292e36"
    muted: "#8d9ba7"
    link: "#3a6c9c"
    accent: "#af4e01"
    mark: "#f8d28a88"
  gallery:
    title: "#d8dee9"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#f6fbff"
    node-control: "#fbd4c2"
    line: "#8d9ba7"
    outline: "#aebbc5"
    highlight: "#b3520a"
    blocked: "#b72c3c"
    zone-blue: "#d6ebff"
    zone-green: "#dbefe4"
    zone-amber: "#ede9dc"
    zone-orange: "#f7e5dd"
    zone-violet: "#eee5f8"
    zone-grey: "#e2ebf1"
    zone-brown: "#ebdfe0"
  graph:
    ink: "{ui.foreground}"
    accent: "#b3520a"
    neighbour: "#266caa"
    visited: "#d1dae0"
    edge: "#a9b6c0"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#83909c"
    string: "#578253"
    number: "#b3520a"
    constant: "#b3520a"
    keyword: "#8a5c8a"
    operator: "#217c7c"
    function: "#3a6c9c"
    type: "#a17600"
    variable: "#b3520a"

dark:
  ui:
    background: "#1b2b34"
    panel: "#14232d"
    foreground: "#d8dee9"
    muted: "#65737e"
    link: "#6699cc"
    accent: "#f99157"
    mark: "#65737e66"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#424c52"
    node-soft: "#374147"
    node-control: "#553b2f"
    line: "#65737e"
    outline: "#4a5963"
    highlight: "#f99157"
    blocked: "#ec5f67"
    zone-blue: "#19354b"
    zone-green: "#203833"
    zone-amber: "#30342c"
    zone-orange: "#38312e"
    zone-violet: "#313042"
    zone-grey: "#25353e"
    zone-brown: "#38363b"
  graph:
    ink: "{ui.foreground}"
    accent: "#d16d31"
    neighbour: "#4d91d2"
    visited: "{ui.panel}"
    edge: "#4e5c67"
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "#66747f"
    string: "#99c794"
    number: "#f99157"
    constant: "#f99157"
    keyword: "#c594c5"
    operator: "#5fb3b3"
    function: "#6699cc"
    type: "#fac863"
    variable: "#f99157"

# The emphasis swatches (scripts/doom.mjs): the default gives ui.accent (its text
# tone), diagram.highlight (the graphic one) and graph.accent (the graph's).
emphasis:
  defaultId: orange
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#b3520a", text: "#af4e01", graph: "#b3520a" }
      dark: { graphic: "#f99157", text: "#f99157", graph: "#d16d31" }
    - id: yellow
      name: yellow
      light: { graphic: "#a17600", text: "#896400", graph: "#a17600" }
      dark: { graphic: "#fac863", text: "#fac863", graph: "#b38302" }
    - id: green
      name: green
      light: { graphic: "#578253", text: "#4b7547", graph: "#478642" }
      dark: { graphic: "#99c794", text: "#99c794", graph: "#5f9e59" }
    - id: violet
      name: violet
      light: { graphic: "#8a5c8a", text: "#895b89", graph: "#9f5fa0" }
      dark: { graphic: "#c594c5", text: "#c594c5", graph: "#a060a1" }
