# Palette monokai, for readers who choose it: Monokai's colours (in dark mode, the
# base16-monokai swatches, https://github.com/tinted-theming/schemes, MIT;
# data/PROVENANCE: background #272822, text #f8f8f2, pink #f92672, orange #fd971f,
# yellow #e6db74, green #a6e22e, cyan #a1efe4, blue #66d9ef, violet #ae81ff), and in
# light mode the same hues, darker, on a near-white paper. Not the default: AA
# contrasts are not required of it (owner, 2026-11-13), except the links' (link,
# 4.5:1 on background and panel, 2026-11-17: in light mode, #0b7a91 moved only in
# OKLCH lightness); what makes the site work is (the maps' zones and nodes are
# distinguishable, the graph's bands).
#
# A value is a lowercase "#rrggbb" or "#rrggbbaa", or a reference to another
# role: "{group.role}" in the same mode, "{light.group.role}" in the other. The
# roles and what each requires are in the README.

light:
  ui:
    background: "#f9f8f5"
    panel: "#ecebe4"
    muted: "#75715e"
    foreground: "#272822"
    link: "#00748a"
    accent: "#b85400"
    mark: "#e6db7488"
  gallery:
    title: "#f8f8f2"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#ffffff"
    node-soft: "#f1f0ea"
    node-control: "#f7cfa6"
    line: "#75715e"
    outline: "#8f8a75"
    highlight: "{ui.accent}"
    blocked: "#c2004a"
    zone-blue: "#d9f1f7"
    zone-green: "#e5f2cc"
    zone-amber: "#f6efcf"
    zone-orange: "#fbe3c9"
    zone-violet: "#ebe2fa"
    zone-grey: "#e6e5dd"
    zone-brown: "#f0dacb"
  graph:
    ink: "{ui.foreground}"
    accent: "#d0700a"
    neighbour: "#1789a8"
    visited: "#e3e1d6"
    edge: "#a59f85"
  # The code blocks: Monokai's hues (in light mode, the darkened ones).
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "{ui.muted}"
    string: "#857500"
    number: "#6c3fc4"
    constant: "{code.number}"
    keyword: "#c2004a"
    operator: "{code.keyword}"
    function: "#567d00"
    type: "{ui.link}"
    variable: "{ui.accent}"

dark:
  ui:
    background: "#272822"
    panel: "#383830"
    muted: "#a59f85"
    foreground: "#f8f8f2"
    link: "#66d9ef"
    accent: "#fd971f"
    mark: "#75715e88"
  gallery:
    title: "{light.gallery.title}"
  diagram:
    ink: "{ui.foreground}"
    background: "{ui.background}"
    border: "{ui.foreground}"
    node: "#46463c"
    node-soft: "#3d3d36"
    node-control: "#5a4326"
    line: "#a59f85"
    outline: "#75715e"
    highlight: "{ui.accent}"
    blocked: "#f92672"
    zone-blue: "#223b40"
    zone-green: "#2f3a1c"
    zone-amber: "#403a1a"
    zone-orange: "#46321e"
    zone-violet: "#332b47"
    zone-grey: "#2f302b"
    zone-brown: "#3d2c27"
  graph:
    ink: "{ui.foreground}"
    accent: "#d87a0f"
    neighbour: "#2a9dbb"
    visited: "{ui.panel}"
    edge: "#75715e"
  # The code blocks: Monokai's syntax colours.
  code:
    text: "{ui.foreground}"
    background: "{ui.background}"
    comment: "{ui.muted}"
    string: "#e6db74"
    number: "#ae81ff"
    constant: "{code.number}"
    keyword: "#f92672"
    operator: "{code.keyword}"
    function: "#a6e22e"
    type: "#66d9ef"
    variable: "#fd971f"


# Emphasis swatches generated by scripts/from-doom.mjs from data/doom.json:
# not edited by hand; regenerate with `npm run doom`. The colours, from Doom Emacs
# (https://github.com/doomemacs/themes, MIT, commit a59202912ad5), its themes:
# dark, doom-monokai-classic.
# The default, the first, is ui.accent, diagram.highlight and graph.accent from
# above, as they are; the others, like the Doom palettes' (README, "Emphasis").
emphasis:
  defaultId: orange
  swatches:
    - id: orange
      name: orange
      light: { graphic: "#b85400", text: "#b85400", graph: "#d0700a" }
      dark: { graphic: "#fd971f", text: "#fd971f", graph: "#d87a0f" }
    - id: red
      name: red
      light: { graphic: "#b9180e", text: "#b9180e", graph: "#b9180e" }
      dark: { graphic: "#e74c3c", text: "#ff7664", graph: "#e74c3c" }
    - id: yellow
      name: yellow
      light: { graphic: "#8f8304", text: "#756b00", graph: "#8f8304" }
      dark: { graphic: "#e6db74", text: "#e6db74", graph: "#9a8f1e" }
    - id: green
      name: green
      light: { graphic: "#638c00", text: "#527500", graph: "#638c00" }
      dark: { graphic: "#a6e22e", text: "#a6e22e", graph: "#709d00" }
