[package]
name = "mae-site"
description = "MAE's web core (ADR-119): one derivation of a KB into pages, for the live app and the static export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# ADR-119 D2: the core is a library the daemon uses and the static export
# (mae-site, its own small workspace) links. No I/O here: callers hand it page
# sources and get pages back.
[dependencies]
mae-org = { path = "../org" }
# ADR-119 D18/D19: the one allow-list sanitiser for content and components.
ammonia = "4"
