# Intended differences between mae-org's semantics() and mae-kb's org parser
# (parse_org_multi_result, and parse_org_multi for bodies), the projection it
# replaces (ADR-112 D2, D5), plus mae-org's agreement with the Emacs oracle
# for titles and levels (semantics-titles.tsv).
#
# tests/semantics_differential.rs gives every difference a CLASS by a
# mechanical check (see its classify_* functions and compare_body), then
# requires an entry here for it. It fails on a difference no entry covers, on
# an entry that covers nothing, on an entry whose pinning test is not a
# #[test] function, and on a wildcard entry whose hit count changed.
#
# Fields: what   = node | title | level | tags | kind | aliases | properties |
#                  todo | priority | body | link | transclusion
#         class  = the classifier's class, or "unclassified"
#         file   = repo-relative path; a trailing * makes it a prefix, and
#                  "*" alone means every file
#         detail = substring of the difference's text: REQUIRED unless file is
#                  "*", so an entry names the difference it excuses
#         count  = REQUIRED for a wildcard (file ending in *): exactly how
#                  many differences the entry covers
#         reason, test = why it is intended, and the #[test] that pins
#                  mae-org's side

# ---------------------------------------------------------------- whole corpus

[[divergence]]
what = "properties"
class = "property_key_case"
file = "*"
count = "95"
reason = "Property keys are canonical (Emacs case folding, ASCII shown upper case: Property::key); mae-kb lower-cased them. The class requires mae-org's key to be exactly the upper case of mae-kb's, with the same value: a key left as written is unclassified."
test = "property_keys_are_canonical_and_repeats_resolve_like_org"

[[divergence]]
what = "title"
class = "title_matches_emacs"
file = "assets/manual/scheme-star-*"
detail = "\"Scheme: =*"
count = "18"
reason = "The manual names each Scheme variable as verbatim (#+title: Scheme: =*buffer-count*=; written as *x* it was bold in Org). Org's plain reading (semantics-titles.tsv, from Emacs) drops the delimiters; mae-kb kept the raw markup."
test = "titles_are_plain_text"

