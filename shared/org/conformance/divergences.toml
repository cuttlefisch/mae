# Intended differences between mae-org and Emacs org-element (ADR-112 D5).
#
# tests/conformance.rs fails on any difference NOT covered here, and on any
# entry that no longer matches a difference. Each entry names the pinning
# test that fixes mae-org's behaviour, so the divergence cannot drift silently.
#
# Fields: kind  = org-element type, or "*" for every kind
#         file  = repo-relative path (a trailing * makes it a prefix)
#         begin = optional byte offset of the differing element
#         reason, test = why, and the test that pins mae-org's side

# Inside a plain list, org-element--list-struct skips a block by searching
# for (format "^[ \t]*#\\+END%s[ \t]*$" NAME) without `regexp-quote'
# (org-element.el:1952), so a block name is a REGEXP there: `c++' never
# matches its own end line and `a.b' is closed by `aXb'. The block parser
# itself quotes the name. mae-org treats names literally in both places:
# matching Emacs would need an Emacs-regexp engine over author-controlled
# names (exponential backtracking is a DoS risk, and names such as `[' make
# Emacs signal an error), for a difference that only arises when a block
# name contains a regexp metacharacter (. * + ? [ ^ $ \).
[[divergence]]
kind = "*"
file = "shared/org/tests/fixtures/list-block-name-cpp.org"
reason = "list scanner: Emacs reads the block name c++ as a regexp; mae-org reads names literally, as Org's block parser does"
test = "inside_a_list_block_names_are_literal_not_regexps"

[[divergence]]
kind = "*"
file = "shared/org/tests/fixtures/list-block-name-regex.org"
reason = "list scanner: Emacs reads the block name a.b as a regexp (closed by end_aXb); mae-org reads names literally"
test = "inside_a_list_block_names_are_literal_not_regexps"
