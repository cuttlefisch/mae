# Emacs does not terminate on these (it allocates until the oracle's memory
# cap kills it; the goldens are #nonterminating). A radio link `x` followed
# by `[`: one char past the link, org-element--object-lex backs up to the
# line start, the regexp matches with `^`, and the link parser returns an
# EMPTY radio link at point, forever. org-element's intended rule is a radio
# link starting at point; mae-org makes the link and parses the `[` as it
# would anywhere. There is no oracle parse, so every element is listed.
[[divergence]]
kind = "*"
file = "shared/org/tests/fixtures/objects-emacs-nonterminating.org"
reason = "Emacs does not terminate (radio link x before [[x]]); mae-org: link x, then the bracket link"
test = "emacs_does_not_terminate_on_a_radio_link_before_a_bracket"

[[divergence]]
kind = "*"
file = "shared/org/tests/fixtures/objects-emacs-nonterminating-tag.org"
reason = "Emacs does not terminate (radio link x before [[ in an item); mae-org: the link x"
test = "emacs_does_not_terminate_on_a_radio_link_before_a_bracket"

[[divergence]]
kind = "*"
file = "shared/org/tests/fixtures/objects-emacs-nonterminating-verse.org"
reason = "Emacs does not terminate (radio link x before < in a verse block, from the reviewer's fuzzing); mae-org: the link x and the objects after it"
test = "emacs_does_not_terminate_on_a_radio_link_before_a_bracket"

# Targets `a b` and `b-c` over `a\nb-c`: after the link `a\nb` the next
# lex backs up to the line start and Emacs returns a second link that
# begins INSIDE the first (21..24 and 23..26). A tree cannot hold
# overlapping objects; mae-org keeps the first.
[[divergence]]
kind = "link"
file = "shared/org/tests/fixtures/objects-radio-overlap.org"
begin = 23
reason = "Emacs emits a radio link overlapping the previous one; a tree cannot hold it, mae-org keeps only the first"
test = "a_radio_link_never_overlaps_the_object_before_it"

# A radio target set whose regexp Emacs cannot compile: one target of 2,800
# words (each space a `\s-+`; 2,700 is enough, 2,400 is not), or, per the
# pre-tag review, 1,500 nine-word targets. Org's split keeps each regexp
# under 8192 CHARS, but the compiled pattern can still pass Emacs's own
# size limit, and `org-update-radio-target-regexp' signals "Regular
# expression too big": Org parses nothing (the golden is #error). mae-org
# has no compiled-size limit (its matcher is linear in the text), so it
# makes the radio links the regexp describes. Reproducing a C regex
# engine's internal size limit would make the parse depend on it.
[[divergence]]
kind = "*"
file = "shared/org/tests/fixtures/objects-radio-regexp-too-big.org"
reason = "Emacs signals Regular expression too big and parses nothing; mae-org makes the radio link the regexp describes"
test = "an_over_large_radio_regexp_still_makes_its_links"

# A `#+LINK:` replacement that calls a function, `%(fn)`: Org runs the
# function when it is marked safe or `pure` (`concat` is), so `[[c:y]]`
# with `#+LINK: c %(concat)` becomes `y`, and refuses it otherwise
# (`%(upcase)`: unchanged, as here). Running author-chosen code is never
# done (ADR-112 D4): mae-org leaves every such link as written.
[[divergence]]
kind = "link"
file = "shared/org/tests/fixtures/objects-link-view.org"
begin = 42
field = "path"
reason = "Emacs runs %(concat) (a pure function) to expand [[c:y]] to y; mae-org never runs code and leaves c:y"
test = "a_function_link_abbreviation_is_never_run"

[[divergence]]
kind = "link"
file = "shared/org/tests/fixtures/objects-link-view.org"
begin = 42
field = "raw_link"
reason = "Emacs runs %(concat) (a pure function) to expand [[c:y]] to y; mae-org never runs code and leaves c:y"
test = "a_function_link_abbreviation_is_never_run"

# `[[~user]]` is a file link to Org only if that user exists on the machine
# (`file-name-absolute-p`); otherwise fuzzy. A parse must not depend on the
# machine (every peer must agree, ADR-112 D4), so mae-org reads every `~`
# path as a file name. The golden's `~root` agrees; `~no-such-user` does not.
[[divergence]]
kind = "link"
file = "shared/org/tests/fixtures/objects-link-view.org"
begin = 83
field = "link_type"
reason = "Emacs: fuzzy, since this user does not exist on the oracle's machine; mae-org: a file link on every machine"
test = "a_tilde_path_is_a_file_link"

[[divergence]]
kind = "link"
file = "shared/org/tests/fixtures/objects-link-view.org"
begin = 109
field = "link_type"
reason = "Emacs: fuzzy, since this user does not exist on the oracle's machine; mae-org: a file link on every machine"
test = "a_tilde_path_is_a_file_link"

# `<2024-1-1 x+1d>` matches org-element--timestamp-regexp's repeater
# alternative (any digit counts), then org-parse-time-string signals "Not an
# Org time string" and Org's parse of the whole buffer fails (the golden is
# #error). The regexp is org-element's own definition of a timestamp's
# extent; the error comes from a later, stricter reading of its fields, so
# mae-org keeps the object with the extent the regexp gives.
[[divergence]]
kind = "*"
file = "shared/org/tests/fixtures/objects-timestamp-not-org.org"
reason = "Emacs signals Not an Org time string and parses nothing; mae-org keeps the timestamp the regexp delimits"
test = "a_timestamp_org_cannot_read_keeps_the_extent_its_regexp_gives"
