[package]
name = "mae-crypto-wasm"
description = "mae-crypto's WASM facade for the browser: JSON in, JSON out, over a hand-rolled ABI"
# Its own version, not the workspace's: this is the contract the
# `mae-crypto-vX.Y.Z` tags name (the `version` op reports it), and MAE's
# release bump edits only the root workspace version and the crates it
# lists, so a MAE release changes neither this number nor the artifact's
# bytes. Bump it by hand when the contract changes; it moves with
# mae-crypto (tests/api.rs).
version = "0.3.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# cdylib: the .wasm module (`make crypto-wasm`). rlib: the same code
# natively, for its tests and the native side of the Node differential.
[lib]
crate-type = ["cdylib", "rlib"]

# No wasm-bindgen: the ABI is five exported functions (src/lib.rs) and a
# checked-in loader (js/mae-crypto.mjs), so the build needs rustc alone.
# No getrandom and no rand in the WASM build: randomness is the module's one
# import (mae-crypto's src/rng.rs).
[dependencies]
mae-crypto = { path = "../crypto", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
zeroize = "1"

[dev-dependencies]
# tests/sign_op.rs checks sign_op against the verifier the daemon runs.
mae-sync = { path = "../sync" }
