name: Setup Rust toolchain + cache
description: >
  Installs a Rust toolchain and configures Swatinem/rust-cache. Extracted
  because 8+ jobs in ci.yml repeated this identical block (CLAUDE.md
  principle #8 -- "if two renderers compute the same thing, extract it" --
  applied to CI job definitions, not just application code).

  Deliberately does NOT include actions/checkout: a local composite action's
  own action.yml must already exist in the checkout for GitHub Actions to
  resolve `uses: ./.github/actions/setup-rust` at all, so checkout can never
  itself live inside a local composite action -- every calling job must run
  actions/checkout as its own first step before this one.
inputs:
  toolchain:
    description: Rust toolchain channel/version to install (e.g. stable, nightly, 1.95)
    required: false
    default: stable
  components:
    description: Extra rustup components, comma-separated (e.g. "clippy, rustfmt")
    required: false
    default: ""
  workspaces:
    description: >
      Passed through to Swatinem/rust-cache's `workspaces` input. Multi-line
      for multiple workspaces, e.g.:
        workspaces: |
          .
          daemon -> daemon/target
    required: false
    default: ""
  nextest:
    description: >
      Install cargo-nextest (issue #470) via taiki-e/install-action. Opt-in
      (default "false") -- most callers of this action don't run tests at
      all (clippy/fmt-only legs) or aren't yet converted to nextest, so this
      stays additive rather than a default every caller pays for.
    required: false
    default: "false"
  sccache:
    description: >
      Enable mozilla-actions/sccache-action with the GitHub-Actions-cache
      backend (issue #491). Opt-in (default "false"). Unlike
      Swatinem/rust-cache (scoped per-job), sccache caches at the compiled-
      object level against a backend shared ACROSS jobs and runs -- the real
      gap identified in #491, since 5+ ci.yml jobs independently recompile
      overlapping parts of the same crate graph with zero cross-job sharing
      today. Sets RUSTC_WRAPPER=sccache + SCCACHE_GHA_ENABLED=true for every
      subsequent step in the calling job. sccache is incompatible with
      incremental compilation (non-cacheable per-build-unique artifacts) --
      callers building in debug profile should also pass `incremental:
      "false"` alongside this; release builds don't use incremental
      compilation by default so this is a non-issue for `--release` steps.
    required: false
    default: "false"
  incremental:
    description: >
      When "false", sets CARGO_INCREMENTAL=0 for the job. Required alongside
      `sccache: "true"` for any DEBUG-profile build step (sccache cannot
      cache incremental artifacts) -- release steps don't need this since
      `cargo build --release` skips incremental compilation by default
      regardless. Default "true" (cargo's own default -- no override).
    required: false
    default: "true"
  mold:
    description: >
      Install the mold linker (rui314/mold) and set RUSTFLAGS to use it via
      -fuse-ld=mold (issue #491). Opt-in (default "false"). Linux-only: mold
      has no free macOS build (a separate commercial product) and no Windows
      support at all -- callers on non-Linux runners must not set this.
      Generally the fastest linker available for large Linux link jobs,
      which MAE's GUI-featured `mae` binary (Skia + tokio + cozo) is.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Issues #498/#502: MAE's KB tests spin up real `OrgDirWatcher`s (one
    # inotify instance per watcher on Linux) across many test files
    # (kb_ops_durability_tests, kb_ops_registry_tests, kb_ops_concurrency_tests,
    # kb_ops_watcher_misc_tests, kb_ops_search_federation_tests,
    # kb_ops_crud_tests, kb_ops_collab_sync_tests -- confirmed by grep, not
    # guessed). Ubuntu runners default `fs.inotify.max_user_instances` to 128
    # (confirmed on a real machine) -- nextest's default full-machine
    # concurrency can run well over 128 of these concurrently, so a watcher
    # attach genuinely fails under contention (not a test bug): reproduced
    # LOCALLY by running the affected test modules together under default
    # parallelism, root-caused to `kb_adopt_instance`'s own pre-existing
    # error-handling comment naming exactly this failure mode ("the
    # inotify-limit case"). Raising the actual OS limit is the real fix (the
    # nextest test-group serialization in .config/nextest.toml only covers
    # the specific modules already known to be affected -- this covers the
    # underlying resource for every caller, present and future, everywhere
    # this action runs on Linux). No inotify equivalent on macOS/Windows, so
    # scoped to `runner.os == 'Linux'` only.
    - name: Raise inotify limits (issues #498/#502)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo sysctl -w fs.inotify.max_user_instances=4096
        sudo sysctl -w fs.inotify.max_user_watches=1048576
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
    - uses: taiki-e/install-action@nextest
      if: inputs.nextest == 'true'
    - uses: mozilla-actions/sccache-action@v0.0.10
      if: inputs.sccache == 'true'
    - name: Configure sccache env
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
    - name: Disable incremental compilation
      if: inputs.incremental == 'false'
      shell: bash
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
    - name: Install mold linker
      if: inputs.mold == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y mold
    - name: Configure mold as linker
      if: inputs.mold == 'true'
      shell: bash
      run: |
        echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
