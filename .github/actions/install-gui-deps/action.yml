name: Install GUI dependencies
description: >
  apt-get install the native libs mae's GUI feature (Skia + fontconfig/freetype)
  needs to compile. Extracted because this exact apt-get line was copy-pasted
  across 5 places in 3 different workflow files (CLAUDE.md principle #8).
inputs:
  extra-packages:
    description: Additional space-separated apt packages to install alongside the base set
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y clang libfontconfig1-dev libfreetype6-dev ${{ inputs.extra-packages }}
