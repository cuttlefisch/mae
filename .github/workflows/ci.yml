  collab-e2e:
    name: collab / docker e2e
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.version-bump-only != 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Run collab E2E
        run: make docker-collab-test
