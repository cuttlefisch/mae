  install-test:
    name: install / script validation
    runs-on: ubuntu-latest
    needs: [check, daemon, changes]
    if: needs.changes.outputs.version-bump-only != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Download editor binaries + manual KB
        uses: actions/download-artifact@v8
        with:
          name: mae-binary
          path: /tmp/mae-dl

      - name: Download daemon binary
        uses: actions/download-artifact@v8
        with:
          name: mae-daemon-binary
          path: /tmp/daemon-dl

      - name: Assemble tarball directory
        run: |
          mkdir -p /tmp/mae-pkg
          cp /tmp/mae-dl/mae /tmp/mae-pkg/mae
          cp /tmp/mae-dl/mae-mcp-shim /tmp/mae-pkg/mae-mcp-shim
          cp /tmp/daemon-dl/mae-daemon /tmp/mae-pkg/mae-daemon
          chmod +x /tmp/mae-pkg/mae /tmp/mae-pkg/mae-mcp-shim /tmp/mae-pkg/mae-daemon
          cp -r /tmp/mae-dl/mae-manual.cozo /tmp/mae-pkg/mae-manual.cozo
          cp /tmp/mae-dl/mae-manual.cozo.sha256 /tmp/mae-pkg/mae-manual.cozo.sha256
          cp -r modules /tmp/mae-pkg/modules
          cp assets/sample-config.toml /tmp/mae-pkg/sample-config.toml
          cp assets/daemon-config.toml /tmp/mae-pkg/daemon-config.toml
          cp assets/mae-daemon.service /tmp/mae-pkg/mae-daemon.service
          cp assets/com.cuttlefisch.mae-daemon.plist /tmp/mae-pkg/com.cuttlefisch.mae-daemon.plist
          cp assets/install.sh /tmp/mae-pkg/install.sh
          chmod +x /tmp/mae-pkg/install.sh

      - name: Run install.sh (fresh)
        run: |
          cd /tmp/mae-pkg
          ./install.sh "$HOME/.local"

      - name: Verify fresh install
        run: |
          set -e
          echo "=== Checking binaries ==="
          test -x "$HOME/.local/bin/mae"              && echo "OK: mae"
          test -x "$HOME/.local/bin/mae-mcp-shim"     && echo "OK: mae-mcp-shim"
          test -x "$HOME/.local/bin/mae-daemon"        && echo "OK: mae-daemon"

          echo "=== Checking data ==="
          test -d "$HOME/.local/share/mae/mae-manual.cozo"  && echo "OK: manual KB"
          test -d "$HOME/.local/share/mae/modules"          && echo "OK: modules"
          MODULE_COUNT=$(find "$HOME/.local/share/mae/modules" -name "module.toml" | wc -l)
          test "$MODULE_COUNT" -ge 10 && echo "OK: $MODULE_COUNT modules found"

          echo "=== Checking config ==="
          test -f "$HOME/.config/mae/config.toml"   && echo "OK: config.toml"
          test -f "$HOME/.config/mae/daemon.toml"    && echo "OK: daemon.toml"

          echo "=== Checking systemd units ==="
          test -f "$HOME/.config/systemd/user/mae-daemon.service"  && echo "OK: mae-daemon.service"

          echo "=== Checking binary runs ==="
          "$HOME/.local/bin/mae" --version
          "$HOME/.local/bin/mae" --check-config

          echo "=== Checking install script output reported no errors ==="
          cd /tmp/mae-pkg
          OUTPUT=$(./install.sh "$HOME/.local" 2>&1)
          if echo "$OUTPUT" | grep -q '\[!!\]'; then
            echo "FAIL: install script reported errors"
            echo "$OUTPUT" | grep '\[!!\]'
            exit 1
          fi
          echo "OK: install script reports clean"

      - name: Verify upgrade (reinstall over existing)
        run: |
          set -e
          # Add a sentinel to config to verify it's preserved
          echo "# user customization" >> "$HOME/.config/mae/config.toml"
          BEFORE=$(wc -l < "$HOME/.config/mae/config.toml")

          # Run install again — should detect upgrade
          cd /tmp/mae-pkg && ./install.sh "$HOME/.local"

          # Config must NOT have been overwritten
          AFTER=$(wc -l < "$HOME/.config/mae/config.toml")
          test "$BEFORE" -eq "$AFTER" && echo "OK: config preserved on upgrade"
          grep -q "user customization" "$HOME/.config/mae/config.toml" && echo "OK: sentinel line preserved"

          # Binaries must still work
          "$HOME/.local/bin/mae" --version && echo "OK: mae works after upgrade"

      - name: Verify uninstall via install.sh
        run: |
          set -e
          cd /tmp/mae-pkg && ./install.sh --uninstall "$HOME/.local"

          echo "=== Checking binaries removed ==="
          ! test -f "$HOME/.local/bin/mae"              && echo "OK: mae removed"
          ! test -f "$HOME/.local/bin/mae-mcp-shim"     && echo "OK: mae-mcp-shim removed"
          ! test -f "$HOME/.local/bin/mae-daemon"        && echo "OK: mae-daemon removed"

          echo "=== Checking data removed ==="
          ! test -d "$HOME/.local/share/mae/mae-manual.cozo"  && echo "OK: manual KB removed"
          ! test -d "$HOME/.local/share/mae/modules"          && echo "OK: modules removed"

          echo "=== Checking systemd units removed ==="
          ! test -f "$HOME/.config/systemd/user/mae-daemon.service"  && echo "OK: daemon unit removed"

          echo "=== Checking config preserved ==="
          test -f "$HOME/.config/mae/config.toml"  && echo "OK: config.toml preserved"
          test -f "$HOME/.config/mae/daemon.toml"   && echo "OK: daemon.toml preserved"

      - name: Verify reinstall after uninstall
        run: |
          set -e
          cd /tmp/mae-pkg && ./install.sh "$HOME/.local"
          "$HOME/.local/bin/mae" --version && echo "OK: clean reinstall works"
          # Config should still have the sentinel from the upgrade test
          grep -q "user customization" "$HOME/.config/mae/config.toml" && echo "OK: user config survived uninstall+reinstall"

      - name: Verify Makefile uninstall
        run: |
          make uninstall
          ! test -f "$HOME/.local/bin/mae"         && echo "OK: mae removed"
          ! test -f "$HOME/.local/bin/mae-daemon"  && echo "OK: mae-daemon removed"
          echo "OK: Makefile uninstall clean"

  macos:
    name: macOS / build + test + install + collab e2e
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.version-bump-only != 'true'
    # First-appearance posture, matching windows-remote-e2e/msrv's own
    # established precedent exactly: promote to hard-blocking only once
    # proven stable across a few real runs, not a permanent leniency.
    # Issues #345/#389.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          workspaces: |
            .
            daemon -> daemon/target
          nextest: "true"
          # Issue #491: sccache-action itself is cross-platform and every
          # build step below is --release, so no `incremental` override is
          # needed here. `mold` is deliberately NOT set -- it's Linux-only
          # (no free macOS build exists).
          sccache: "true"

      # Unlike Linux (install-gui-deps' apt-get step for fontconfig/
      # freetype), macOS needs ZERO extra system packages for --features gui
      # -- confirmed against release.yml's existing build-macos-arm job,
      # which builds the same feature set with no `brew install` at all
      # (skia-safe uses native CoreText/CoreGraphics here instead).
      - name: Build editor workspace (release, GUI)
        run: cargo build --release --workspace --features gui

      - name: Build daemon workspace (release)
        run: cd daemon && cargo build --release

      - name: Build manual KB + mae-mcp-shim
        run: |
          ./target/release/build-manual-kb assets/mae-manual.cozo
          cargo build --release --package mae-mcp

      # Bounded, fast-signal subset -- mirrors the MSRV job's own established
      # "lib + bins only" pattern, not the full stable/test-equivalent suite.
      # Both issues #345/#389 explicitly say this doesn't need to be the
      # full matrix on day one; macOS runner-minutes cost more than Linux.
      - name: cargo nextest run (lib + bins, fast signal)
        run: cargo nextest run --workspace --lib --bins --release --features gui

      # Issue #389: assets/install.sh already has a full Darwin/launchd
      # branch, never exercised in CI. Reuses the exact package-assembly
      # shape install-test (Linux) already does -- install.sh's own
      # runtime OS detection (`uname -s` = Darwin) does the rest.
      - name: Assemble install package
        run: |
          mkdir -p /tmp/mae-pkg
          cp target/release/mae /tmp/mae-pkg/mae
          cp target/release/mae-mcp-shim /tmp/mae-pkg/mae-mcp-shim
          cp daemon/target/release/mae-daemon /tmp/mae-pkg/mae-daemon
          chmod +x /tmp/mae-pkg/mae /tmp/mae-pkg/mae-mcp-shim /tmp/mae-pkg/mae-daemon
          cp -r assets/mae-manual.cozo /tmp/mae-pkg/mae-manual.cozo
          cp assets/mae-manual.cozo.sha256 /tmp/mae-pkg/mae-manual.cozo.sha256
          cp -r modules /tmp/mae-pkg/modules
          cp assets/sample-config.toml /tmp/mae-pkg/sample-config.toml
          cp assets/daemon-config.toml /tmp/mae-pkg/daemon-config.toml
          cp assets/mae-daemon.service /tmp/mae-pkg/mae-daemon.service
          cp assets/com.cuttlefisch.mae-daemon.plist /tmp/mae-pkg/com.cuttlefisch.mae-daemon.plist
          cp assets/install.sh /tmp/mae-pkg/install.sh
          chmod +x /tmp/mae-pkg/install.sh

      - name: Install (fresh) + verify launchd unit
        run: |
          set -e
          cd /tmp/mae-pkg
          ./install.sh "$HOME/.local"
          test -x "$HOME/.local/bin/mae" && echo "OK: mae"
          test -x "$HOME/.local/bin/mae-daemon" && echo "OK: mae-daemon"
          test -f "$HOME/Library/LaunchAgents/com.cuttlefisch.mae-daemon.plist" && echo "OK: launchd plist installed"
          "$HOME/.local/bin/mae" --version
          "$HOME/.local/bin/mae" --check-config

      - name: Uninstall + verify launchd unit removed
        run: |
          set -e
          cd /tmp/mae-pkg
          ./install.sh --uninstall "$HOME/.local"
          ! test -f "$HOME/.local/bin/mae" && echo "OK: mae removed"
          ! test -f "$HOME/Library/LaunchAgents/com.cuttlefisch.mae-daemon.plist" && echo "OK: launchd plist removed"

      - name: Reinstall (round-trip complete)
        run: |
          set -e
          cd /tmp/mae-pkg
          ./install.sh "$HOME/.local"
          "$HOME/.local/bin/mae" --version && echo "OK: clean reinstall works"

      # Issue #345's explicit minimum ask. The script already carries its
      # own portable fallback chains (ss->lsof->netstat, timeout->gtimeout)
      # built specifically for this -- only the CI leg was missing. Reuses
      # the release binaries built above; no second, redundant compile.
      - name: Collab mTLS e2e (macOS-native binaries)
        env:
          MAE_BIN: ${{ github.workspace }}/target/release/mae
          MAE_DAEMON_BIN: ${{ github.workspace }}/daemon/target/release/mae-daemon
        run: scripts/collab-mtls-e2e.sh

  code-map:
    name: code-map freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Check code-map freshness
        run: |
          make code-map
          if git diff --quiet docs/CODE_MAP.md docs/CODE_MAP.json; then
            echo "✅ Code map is up to date."
          else
            echo "❌ Code map is stale. Run 'make code-map' and commit before merging."
            git diff --stat docs/CODE_MAP.md docs/CODE_MAP.json
            exit 1
          fi

  audit-metrics:
    name: structural ceilings (ratchet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      # Ratchets against docs/AUDIT_BASELINE.json: pre-existing debt passes at
      # its accepted size, a NEW over-ceiling file fails, an accepted file that
      # grows past tolerance fails, and a file that shrinks never fails.
      # Deliberately does not diff a committed metrics file — per-file line
      # counts change on nearly every commit, so that would churn every PR.
      - name: Check structural ceilings
        run: make audit-metrics-check
      # A test binary that spawns a real `mae --headless` must appear in all
      # three heavy-subprocess filters (.config/nextest.toml, ci.yml,
      # badges.yml). Omitting one does not fail loudly here -- it surfaces
      # later as an intermittent 30s socket-bind timeout in a DIFFERENT test,
      # which is how headless_guard_leak_regression_e2e slipped through in
      # #613 and broke the badges job twice. Pure shell + grep, so it needs
      # no build and adds a couple of seconds to an already-cheap job.
      - name: Check heavy-e2e filter lists agree
        run: make heavy-e2e-check

  adr-kb-sync:
    name: ADR KB staleness gate (ADR-059 Phase E)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.adr == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - name: Verify ADR-header-only changes ship a regenerated ADR KB
        run: make verify-adr-kb-sync BASE=origin/${{ github.base_ref || 'main' }}
