name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Harden dependency fetching against transient network flakes. The daemon's
  # iroh/hickory (QUIC P2P) deps occasionally trip cargo's HTTP/2 multiplexing
  # mid-fetch with "[16] Error in the HTTP2 framing layer" (curl CURLE_HTTP2),
  # failing an otherwise-clean `cargo build`. Force HTTP/1.1, retry transient
  # fetch errors, and use the git CLI (robust retry/resume) for any git deps.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Feeds `if: needs.changes.outputs.<x> == 'true'` gates on a few genuinely
  # narrow-scoped, expensive jobs below (daemon-only e2e legs, the ADR KB
  # staleness gate) so they skip on PRs that can't possibly affect them --
  # NOT via a workflow-level `on: paths:` filter, which would leave a
  # required check permanently "Pending" on an unaffected PR and block merge
  # forever. A job-level `if:` that evaluates false is reported as "Success"
  # for required-status-check purposes instead (confirmed against GitHub's
  # documented behavior, not assumed) -- so skipped-as-irrelevant is
  # indistinguishable from passing to branch protection, which is exactly
  # the property this needs.
  #
  # Deliberately NOT applied to `check`/`windows`/`daemon`/`server-client`/
  # `collab-e2e` (core correctness legs, always run) or to `containers`
  # (broad system smoke test with no narrow path scope worth encoding) --
  # only to jobs whose relevance genuinely hinges on a specific, enumerable
  # subtree, and which have no other job depending on their output (the
  # `daemon` job's build artifact IS consumed downstream by `e2e`/
  # `install-test`, which is exactly why `daemon` itself stays unfiltered
  # despite being a plausible-looking candidate).
  #
  # `version-bump-only` (added separately from the path filters above) is a
  # narrower, different kind of gate: an IDENTITY check, not a path filter.
  # `version-bump.yml` pushes an automated "chore: bump version to X.Y.Z"
  # commit straight to `main` after every merge, touching only VERSION /
  # Cargo.toml version lines / CHANGELOG.md / install.sh's version string --
  # never real code -- and then polls this very "CI" workflow's conclusion
  # on that commit before it'll tag a release. Before this gate, that commit
  # re-ran the ENTIRE ~18-job matrix a second time (having already passed as
  # part of the PR that was just merged), costing 38-42 real measured
  # minutes for a diff that cannot possibly affect test/build/e2e outcomes.
  # Scoped to `push` + an exact match on version-bump.yml's own commit
  # message prefix (nothing else in this repo produces that exact string) --
  # this is `push`-only and never evaluates for `pull_request`, so unlike
  # the path filters above it cannot affect any real PR's required-check
  # set; it only shortens the redundant post-merge re-verification of a
  # commit whose content this workflow already knows in advance is
  # metadata-only. See ADR-076's sibling discussion (CI efficiency) / the
  # commit introducing this gate for the full rationale, including why
  # `stable / clippy` + `stable / fmt` + a real (but non-test-running) build
  # stay on as a safety net rather than skipping everything.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      headless: ${{ steps.filter.outputs.headless }}
      containers: ${{ steps.filter.outputs.containers }}
      adr: ${{ steps.filter.outputs.adr }}
      export-js: ${{ steps.filter.outputs.export-js }}
      version-bump-only: ${{ steps.version-bump-only.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            headless:
              - 'crates/mae/**'
              - 'shared/**'
              - 'docker-compose.headless-e2e.yml'
              - 'Dockerfile'
              - 'assets/mae-headless*'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            containers:
              - 'crates/**'
              - 'shared/**'
              - 'daemon/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'assets/install.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            adr:
              - 'docs/adr/**'
              - 'assets/mae-adr.cozo/**'
              - 'assets/mae-adr.cozo.sha256'
              - 'crates/mae/src/bin/build_adr_kb.rs'
              - 'crates/mae/src/bin/verify_adr_kb_sync.rs'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            export-js:
              - 'crates/export/assets/graph.js'
              - '.github/workflows/ci.yml'
      # Untrusted commit-message content is passed via `env:`, never
      # interpolated directly into the script body -- avoids the classic
      # GitHub Actions script-injection footgun (a `${{ }}` expression
      # substituted straight into `run:` is spliced in BEFORE the shell
      # parses it), even though this specific commit's message is always
      # workflow-generated, not user-authored.
      - name: Detect version-bump-only push
        id: version-bump-only
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$HEAD_COMMIT_MESSAGE" == "chore: bump version to "* ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: stable / ${{ matrix.step }}
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        step: [test, clippy, fmt]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          # Both workspaces: the "Build mae-daemon" step below (test leg only)
          # needs the daemon workspace built too, but was previously landing
          # in the DEFAULT (root-workspace-only) rust-cache scope and getting
          # recompiled from scratch on every run as a result.
          workspaces: |
            .
            daemon -> daemon/target
          # Issue #470: only the test leg actually runs `cargo nextest run` —
          # clippy/fmt legs never touch it, so skip the install there.
          nextest: ${{ matrix.step == 'test' && 'true' || 'false' }}
          # Issue #491: test + clippy legs both do a full workspace compile
          # (`--release --features gui` / `--all-targets`) -- fmt doesn't
          # compile anything, so it's excluded. Both legs use --release (or
          # clippy's own non-incremental default), so `incremental` stays at
          # its default "true" (no-op) rather than needing an override.
          sccache: ${{ matrix.step != 'fmt' && 'true' || 'false' }}
          mold: ${{ matrix.step != 'fmt' && 'true' || 'false' }}

      - uses: ./.github/actions/install-gui-deps
        if: matrix.step != 'fmt'

      # crates/mae/tests/headless_kb_convergence_e2e.rs (L3d, #380) spawns a
      # real `mae-daemon` via find_daemon_binary()'s daemon/target/release/
      # candidate path. It's intentionally in the default (non-#[ignore]d)
      # suite, unlike the daemon workspace itself is only built by the
      # separate `daemon` job -- making this job `needs: [daemon]` would
      # serialize every matrix leg (test/clippy/fmt) behind daemon's own
      # ~10min job just for one test in one leg, so build only the daemon
      # binary here instead, scoped to exactly the leg that needs it. Cheap
      # relative to the full `daemon` job (no test/clippy/fmt), and now
      # actually cached (see `workspaces:` above).
      - name: Build mae-daemon (for headless_kb_convergence_e2e)
        if: matrix.step == 'test' && needs.changes.outputs.version-bump-only != 'true'
        run: cd daemon && cargo build --release --bin mae-daemon

      # Safety net for a version-bump-only push (see the `changes` job's own
      # comment for the full rationale): the bump commit can't have broken
      # anything the actual test suite exercises (it never touches code),
      # but a compile check still catches the one thing genuinely worth
      # re-checking post-merge -- does the merged tree still compile.
      # `--all-targets` also covers test/bench targets without RUNNING them.
      #
      # `cargo check`, NOT `cargo build --release`. This step used to be a
      # full release build and its comment claimed it cost "a fraction of the
      # real nextest run's cost". Measured on v0.14.90, that was false:
      #
      #   PR   stable/test  (build + 8048 tests + clippy + fmt)  23m42s
      #   main stable/test  (this step alone, zero tests)        20m47s
      #
      # i.e. 88% of the cost for none of the coverage. The bump rewrites
      # `version =` in 6 Cargo.toml files, which changes every workspace
      # crate's fingerprint and forces a full first-party recompile (third-
      # party deps are fine -- skia did not rebuild, the cache works).
      # `--release --all-targets` then maximised that. Dropping codegen keeps
      # the property worth keeping and removes the LLVM pass over every crate
      # and every test binary.
      - name: cargo check (version-bump-only safety net, no test run)
        if: matrix.step == 'test' && needs.changes.outputs.version-bump-only == 'true'
        run: cargo check --workspace --all-targets --features gui

      - name: cargo test
        if: matrix.step == 'test' && needs.changes.outputs.version-bump-only != 'true'
        timeout-minutes: 30
        # Issue #470: cargo-nextest as the runner (real parallel-process test
        # execution, global scheduling across every test binary in the
        # workspace instead of cargo test's own one-binary-at-a-time
        # sequencing -- the single biggest lever on this job's wall-clock
        # time). nextest does NOT run doctests at all, so `cargo test --doc`
        # still runs separately, unchanged. See .config/nextest.toml for the
        # one named, cross-linked retry override (#487) -- no blanket retry
        # policy.
        #
        # Issue #510: split into two SEQUENTIAL nextest invocations for the
        # same structural reason as badges.yml's own "Count tests" step (see
        # that file's comment for the full evidence -- a real, repeated
        # subprocess-startup failure under the initial full-suite scheduling
        # burst, not a hypothetical). This job hadn't shown the failure yet,
        # but shares the identical vulnerability (same test files, same
        # `--workspace --features gui` invocation shape) -- fixed here too
        # rather than waiting for it to surface here as its own incident.
        # mcp_tool_tiering_e2e and tool_schema_nested_e2e added alongside the
        # original 5 after two successive #511 verification runs each caught
        # one more file failing with the identical "never bound its stable
        # socket" signature -- same real subprocess + bounded-bind profile,
        # just missed until it was the one observed failing. The final
        # addition came from an exhaustive sweep, not another one-off
        # reaction -- see .config/nextest.toml for the full methodology.
        run: |
          # Duplicated in .config/nextest.toml (heavy-subprocess-e2e group) and
          # badges.yml. A new heavy binary must be added to all three; verified
          # by `make heavy-e2e-check`.
          HEAVY_FILTER='binary(headless_e2e) + binary(guidance_delivery_e2e) + binary(headless_kb_convergence_e2e) + binary(headless_soak_shaped_e2e) + binary(headless_idle_cpu_e2e) + binary(mcp_tool_tiering_e2e) + binary(tool_schema_nested_e2e) + binary(headless_guard_leak_regression_e2e)'
          cargo nextest run --workspace --release --features gui -E "$HEAVY_FILTER"
          cargo nextest run --workspace --release --features gui -E "not ($HEAVY_FILTER)"
          cargo test --doc --workspace --release --features gui

      # Also gated on version-bump-only. Every OTHER gate in this matrix job is
      # scoped to `matrix.step == 'test'`, so the clippy leg used to run a full
      # workspace lint on a commit that changed only version strings: 13m53s on
      # v0.14.90, against 1m15s for the same lint on the PR minutes earlier (the
      # bump invalidates every workspace crate's fingerprint, so nothing is
      # cached). It was not the critical path only because the test leg's own
      # safety net was slower still -- fix that alone and this becomes the floor.
      # A lint cannot newly fail on a version-string change, and the test leg's
      # `cargo check` already proves the tree compiles.
      - name: cargo clippy
        if: matrix.step == 'clippy' && needs.changes.outputs.version-bump-only != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt
        if: matrix.step == 'fmt'
        run: cargo fmt --all --check

      # `cargo test --workspace --release --features gui` above already compiled
      # `mae` and `build-manual-kb` into target/release/ — so we run build-manual-kb
      # directly instead of the old `cargo build --bin build-manual-kb` (no
      # --features gui), which re-resolved features and recompiled the entire `mae`
      # crate from scratch to produce a binary that already existed (the waste this
      # removes, on the critical path that gates downstream artifact jobs).
      # The mae-mcp build stays: it's the only way the shim lands at
      # target/release/mae-mcp-shim, and it's cheap (mae-mcp is feature-independent
      # and already compiled by the test step — this just links the shim).
      #
      # mae-agent-cli needs the same explicit `cargo build` treatment: it's a
      # bin-only crate with only unit tests (no lib target, no integration
      # test spawning it via CARGO_BIN_EXE_*), so `cargo test --release`
      # above only produces its test-harness binary under target/release/deps/
      # — never the plain target/release/mae-agent artifact this job stages.
      # Confirmed by reproducing locally: `cargo test --release -p
      # mae-agent-cli` leaves no target/release/mae-agent at all.
      # All three steps below exist solely to feed the `mae-binary` artifact
      # `e2e`/`install-test` download downstream -- both of those jobs are
      # themselves skipped for a version-bump-only push (see the `changes`
      # job's comment), so producing/uploading an artifact nobody will
      # consume would be pure waste in that case.
      - name: Build install artifacts (reuse test-compiled binaries)
        if: matrix.step == 'test' && needs.changes.outputs.version-bump-only != 'true'
        run: |
          cargo build --release --package mae-mcp
          cargo build --release --package mae-agent-cli
          ./target/release/build-manual-kb assets/mae-manual.cozo

      - name: Stage editor artifacts
        if: matrix.step == 'test' && needs.changes.outputs.version-bump-only != 'true'
        run: |
          mkdir -p /tmp/mae-artifacts
          cp target/release/mae /tmp/mae-artifacts/
          cp target/release/mae-mcp-shim /tmp/mae-artifacts/
          cp target/release/mae-agent /tmp/mae-artifacts/
          cp -r assets/mae-manual.cozo /tmp/mae-artifacts/
          cp assets/mae-manual.cozo.sha256 /tmp/mae-artifacts/

      - name: Upload editor artifacts
        if: matrix.step == 'test' && needs.changes.outputs.version-bump-only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mae-binary
          path: /tmp/mae-artifacts/
          retention-days: 1

  windows:
    name: stable / test (windows)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.version-bump-only != 'true'
    # ADR-066 Phase C: the editor workspace's Windows CI leg. Hard-blocking from day
    # one, deliberately NOT `continue-on-error` (unlike mae-vscode's own interim
    # posture for its separate, smaller-scope CI) -- an unenforced leg proves nothing
    # about whether the gap this ADR closes was real. Explicitly does NOT cover the
    # daemon workspace (stays Linux-only by design, Gate W) or the GUI feature
    # (ADR-066 Phase D's own dedicated leg, not yet landed).
    #
    # Scope, honestly: `cargo build --workspace` (TUI-only, no GUI feature) proves the
    # WHOLE editor workspace at least compiles on Windows -- catching real portability
    # gaps (path-separator/line-ending/filesystem-permission assumptions) anywhere in
    # the tree, not just where Phase A touched. `cargo test` is scoped to the crates
    # Phase A's local-IPC work actually changed (mae-mcp, mae-core, the `mae` binary,
    # mae-agent-cli) rather than `--workspace` -- this was authored with no Windows
    # toolchain available to verify locally (see `shared/mcp/src/local_ipc.rs`'s own
    # doc comment), so betting the ENTIRE workspace's test suite (including crates
    # with their own, unrelated Unix-specific assumptions this ADR's Phase A never
    # touched -- e.g. shell/PTY handling) on one untested leg would risk blocking
    # every future PR on failures with no efficient way to iterate against them.
    # Broadening to `--workspace` is real, tracked follow-up work once this leg is
    # proven stable, not a silently-accepted permanent gap -- see ADR-066's Status
    # note for the explicit tracking issue.
    #
    # The 20 `--skip`s below are real, pre-existing mae-core test failures the first
    # real `windows-latest` run surfaced (path-separator/canonicalization/permission
    # differences across file_picker/dap_ops/kb_ops/lsp/navigation/project/babel/swap --
    # unrelated to what ADR-066 Phase A itself changed). Tracked as debt, not silently
    # dropped: issue #455 has the full per-cluster breakdown and root-cause hypotheses.
    # (kb_scope_project_path_identity_not_string_equality, originally a 24th skip here,
    # is now `#[cfg(unix)]`-gated at its source instead -- it relies on a real symlink,
    # so a runtime skip was never the right fix; this list keeps the ones that are
    # genuine behavioral differences worth diagnosing properly, not path-support gaps.)
    # 4 `kb_reimport_file`/`kb_promote_node_resave_org_file_...`-cluster skips REMOVED
    # here (ADR-061 Phase F PR): root-caused to `kb_reimport_file` comparing a plain,
    # uncanonicalized caller path against `KbRegistry::register`'s ALREADY-canonicalized
    # `org_dir` (`std::fs::canonicalize` prepends `\\?\` on Windows; the identical
    # mismatch was independently confirmed on macOS too, via `/var` -> `/private/var`,
    # tracked as #498) -- fixed at the source by canonicalizing inside `kb_reimport_file`
    # itself, verified with a real symlink-based regression test
    # (`kb_reimport_file_resolves_a_symlinked_org_dir_the_same_way_registration_did`,
    # confirmed to fail against the pre-fix code). `kb_register_does_not_clobber_user_dirs`
    # stays skipped -- a different, unrelated root cause ($HOME-relative user-dir paths).
    # The other 2852 mae-core lib tests stay enforced. mae-mcp's `--all-targets` also
    # runs with reduced Windows coverage right now -- 19 socket-integration tests in
    # `shared/mcp/src/lib.rs` are `#[cfg(unix)]`-gated rather than ported to the
    # `local_ipc` abstraction, also tracked in #455 (closes the #442 DoD gap).
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          nextest: "true"
      - name: cargo build --workspace (compile-only, catches portability gaps everywhere)
        run: cargo build --workspace
      # Issue #484: migrated from plain `cargo test` to nextest (2026-07-28), after
      # `sqlite_multi_instance_concurrent_writes_converge` recurred a THIRD time despite
      # two rounds of retry-budget increases (count-based -> 20s wall-clock -> 45s
      # wall-clock, see shared/kb/src/cozo_store/db.rs's own history comment). Root
      # cause was never the budget: plain `cargo test -p mae-core --lib` runs all
      # ~2877 tests as IN-PROCESS THREADS with no isolation, so this test's own two
      # writer threads compete for scheduling not just with each other but with every
      # other concurrently-running test in the SAME process -- on a real CI run, the
      # observed failure was "database is locked" surviving a full 45 CONTINUOUS
      # seconds of retry, which is process-wide starvation, not lock contention a
      # bigger number could ever fix. nextest gives every test its own OS process
      # (already true for Linux/macOS's `stable / test` and `macOS / build...` legs --
      # this brings Windows to the same isolation model instead of leaving it as the
      # one leg without it) -- and, for free, this test's module
      # (kb_ops_concurrency_tests) is already a member of .config/nextest.toml's
      # `kb-ops-filesystem-watchers` group, so it now also gets that group's existing
      # max-threads=1 serialization against its 7 sibling modules, the same protection
      # Linux/macOS already have. Scope is UNCHANGED (still the 4 crates ADR-066 Phase
      # A actually touched, not `--workspace` -- see the comment above), only the
      # runner changed. The 20 `--skip`s become an equivalent `-E "not (...)"` nextest
      # filter (exact-match `test(=...)`, not substring, to keep the exclusion as
      # narrow as the original `--skip` list was).
      - name: cargo nextest run (crates ADR-066 Phase A actually changed)
        timeout-minutes: 20
        shell: bash
        run: |
          cargo nextest run -p mae-mcp --all-targets
          SKIP_FILTER='test(=file_picker::tests::basename_exact_ranks_highest) + test(=file_picker::tests::dir_prefix_filters_to_subtree) + test(=file_picker::tests::dir_prefix_with_remainder_finds_file) + test(=file_picker::tests::filter_typing_path_promotes_exact_file) + test(=file_picker::tests::reorder_by_recency_promotes_recent_files_to_front) + test(=file_picker::tests::scan_finds_files) + test(=file_picker::tests::switch_root_to_absolute_dir) + test(=file_picker::tests::tab_completes_to_longest_common_prefix) + test(=file_picker::tests::tilde_expansion) + test(=editor::dap_ops::tests::canonicalize_absolute_path_unchanged) + test(=editor::dap_ops::tests::dap_set_breakpoint_adds_and_is_idempotent) + test(=editor::dap_ops::tests::dap_set_breakpoint_conditional_stores_condition) + test(=editor::dap_ops::tests::dap_set_breakpoint_conditional_updates_existing) + test(=editor::dap_ops::tests::dap_set_breakpoint_conditional_with_hit_condition) + test(=editor::kb_ops::tests::kb_ops_watcher_misc_tests::kb_register_does_not_clobber_user_dirs) + test(=editor::tests::lsp_tests::open_file_in_project_sets_pending_lsp_root_change_when_no_project) + test(=editor::tests::navigation_tests::gf_opens_file_under_cursor) + test(=editor::tests::project_tests::set_project_root_command) + test(=editor::babel_ops::tests::babel_run_block_results_land_after_end_src_with_multibyte_content_earlier) + test(=swap::tests::orphan_detection)'
          cargo nextest run -p mae-core --lib -E "not ($SKIP_FILTER)"
          cargo nextest run -p mae --bin mae
          cargo nextest run -p mae-agent-cli
      - name: cargo clippy (crates ADR-066 Phase A actually changed)
        run: |
          cargo clippy -p mae-mcp -p mae-core -p mae --bin mae -p mae-agent-cli --all-targets -- -D warnings

  windows-remote-e2e:
    name: ADR-066 Phase E / windows remote daemon verification
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.version-bump-only != 'true'
    # First iteration of genuinely new CI infrastructure (a Windows-BUILT
    # client reaching a real Linux-BUILT mae-daemon, hosted in WSL2 on the
    # SAME runner since GH Actions has no native way to network two
    # different-OS runners directly) with ZERO local pre-verification
    # possible -- same posture mae-vscode's own untriaged Windows CI gap
    # uses, and the same one ADR-066 Phase A/C started with before being
    # proven stable enough to hard-block. Promote to blocking once proven
    # stable across a few real runs, matching that same precedent -- not a
    # permanent leniency.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          workspaces: "daemon -> daemon/target"

      # The verification client + its --gen-material mode (self-signed TLS
      # cert/key, JWKS, a signed JWT) -- built natively on Windows, since
      # this is exactly the "Windows-built client" ADR-066 Phase E's own
      # text names. examples/ (not a [[bin]]) because --gen-material needs
      # rsa/rcgen/rand/base64, dev-dependencies a production mae-daemon
      # binary has no business linking.
      - name: Build windows_remote_verify (Windows-native)
        run: cd daemon && cargo build --example windows_remote_verify

      - name: Generate cert/JWKS/JWT material (Windows side)
        shell: bash
        run: |
          mkdir -p daemon/phase-e-material
          jwt=$(./daemon/target/debug/examples/windows_remote_verify.exe \
            --gen-material daemon/phase-e-material \
            --resource "https://127.0.0.1:39443/mcp")
          echo "PHASE_E_JWT=$jwt" >> "$GITHUB_ENV"

      # `windows-latest` has the WSL2 KERNEL FEATURE enabled but ships with
      # NO distro installed -- confirmed the hard way by a real CI run
      # ("wsl --status" printing "Windows Subsystem for Linux has no
      # installed distributions", and a follow-on "wslpath: command not
      # found" because `wslpath` only exists INSIDE a WSL distro, not on
      # the host git-bash side that a bare `wsl bash "$(wslpath ...)"`
      # invocation runs from). Vampire/setup-wsl installs a real Ubuntu
      # distro (a lightweight rootfs import, no interactive `wsl --install`
      # / reboot cycle) and additionally provides a `wsl-bash` shell that
      # runs a step's `run:` block genuinely INSIDE that distro -- so
      # `wslpath` (used below to translate the Windows checkout path into
      # its WSL-visible /mnt/... form) is called from the correct side.
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-22.04
          additional-packages: build-essential python3

      - name: Confirm WSL2 distro is available
        shell: wsl-bash {0}
        run: lsb_release -a

      # Real Rust toolchain + a real build of mae-daemon FROM THE SAME
      # CHECKED-OUT SOURCE, entirely inside WSL2 -- genuinely Linux-built,
      # not cross-compiled or downloaded. WSL2 exposes the Windows checkout
      # via /mnt/<drive>/..., so no second checkout is needed. `${{
      # github.workspace }}` is substituted by GH Actions as a literal
      # Windows path (e.g. `D:\a\mae\mae`) before this script ever runs;
      # `wslpath` (now genuinely available under `wsl-bash`) converts it.
      - name: Build mae-daemon inside WSL2 (genuinely Linux-built)
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          cd "$(wslpath '${{ github.workspace }}')/daemon"
          cargo build --bin mae-daemon

      # Start the real Linux-built daemon inside WSL2, bound to
      # 127.0.0.1:39443 -- WSL2's automatic localhost port-forwarding makes
      # this reachable from the Windows-native client below as
      # 127.0.0.1:39443, no explicit port-forwarding setup needed (a
      # documented WSL2 behavior, unverified against THIS specific runner
      # image until this job actually runs).
      #
      # jwks_url must be http(s):// -- reqwest::Client::new() (daemon/src/oauth.rs's
      # JWKS fetcher) does not support file:// URLs, confirmed by direct
      # source read rather than assumed and left to fail in CI. A tiny
      # Python http.server (installed via additional-packages above) serves
      # the generated jwks.json entirely WITHIN WSL's own network namespace
      # -- both it and the daemon that fetches from it run inside WSL, so
      # this never needs to cross the Windows/WSL boundary at all.
      - name: Start mae-daemon inside WSL2 (collab TCP + OAuth/HTTPS)
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          root="$(wslpath '${{ github.workspace }}')/daemon"
          material="$root/phase-e-material"
          data_dir="$(mktemp -d)/data"
          mkdir -p "$data_dir"

          cd "$material"
          nohup python3 -m http.server 39441 --bind 127.0.0.1 \
            > /tmp/mae-jwks-server-phase-e.log 2>&1 &
          disown
          for i in $(seq 1 25); do
            (echo > /dev/tcp/127.0.0.1/39441) >/dev/null 2>&1 && break
            sleep 0.2
          done

          config=$(mktemp)
          {
            echo '[collab]'
            echo 'enabled = true'
            echo 'bind = "127.0.0.1:39442"'
            echo ''
            echo '[collab.auth]'
            echo 'mode = "none"'
            echo ''
            echo '[oauth]'
            echo 'enabled = true'
            echo 'bind = "127.0.0.1:39443"'
            echo 'canonical_resource_uri = "https://127.0.0.1:39443/mcp"'
            echo 'jwks_url = "http://127.0.0.1:39441/jwks.json"'
            echo 'issuer = "https://idp.example.com"'
            echo "cert_path = \"$material/cert.pem\""
            echo "key_path = \"$material/key.pem\""
            echo 'kb_query_enabled = true'
          } > "$config"

          cd "$root"
          XDG_RUNTIME_DIR="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" \
            nohup ./target/debug/mae-daemon --data-dir "$data_dir" --config "$config" \
            > /tmp/mae-daemon-phase-e.log 2>&1 &
          disown
          for i in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/39442) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          echo 'daemon did not come up within 10s'; cat /tmp/mae-daemon-phase-e.log; exit 1

      - name: Run Windows-native verification client against the WSL2-hosted daemon
        shell: bash
        run: |
          ./daemon/target/debug/examples/windows_remote_verify.exe \
            --collab-addr 127.0.0.1:39442 \
            --oauth-url https://127.0.0.1:39443 \
            --jwt "$PHASE_E_JWT"

      - name: Daemon log (always, for diagnosis)
        if: always()
        shell: wsl-bash {0}
        run: cat /tmp/mae-daemon-phase-e.log || true

  windows-gui-spike:
    name: ADR-066 Phase D / windows GUI build + input spike
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.version-bump-only != 'true'
    # First iteration of genuinely new CI infrastructure -- skia-safe/
    # skia-bindings 0.99 (the --features gui dependency) built for
    # x86_64-pc-windows-msvc for the very first time. GUI already builds
    # fine on Linux (install-gui-deps' apt-get fontconfig/freetype) and
    # macOS (zero extra system packages, native CoreText/CoreGraphics) --
    # Windows is simply UNATTEMPTED, not previously-failed, and there is
    # zero local pre-verification possible (no Windows toolchain available
    # to the author). Same posture windows-remote-e2e/macos/msrv all
    # started with. Promote to hard-blocking once proven stable across a
    # few real runs, matching that same precedent -- not a permanent
    # leniency.
    #
    # Spike 1/2 (build-only, answering "does this dependency even compile
    # here") landed and passed. This adds spike 2/2: launch the real GUI
    # binary, confirm a real window appears (proves the runner has a real
    # interactive desktop session, not just claimed per public GH-hosted-
    # runner docs), and inject a synthetic SendInput click, verified via
    # GetCursorPos reading back the real OS cursor position -- proving the
    # injection MECHANISM itself works. Deliberately still NOT the full
    # smoke test (no MCP-observed editor-state assertion yet, no clippy) --
    # see crates/mae/tests/gui_windows_input_spike.rs's own doc comment and
    # docs/adr/066-windows-client-support.md's Phase D section.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          sccache: "true"
          incremental: "false"
      - name: cargo build --workspace --features gui (debug, fast signal)
        run: cargo build --workspace --features gui
      - name: cargo test -p mae --features gui --test gui_windows_input_spike
        # 8m, not 5m: the test's own window-wait budget is 120s (see the
        # test's own doc comment -- a cold Windows CI runner's KB
        # federation/cozo work genuinely needs that long), plus real margin
        # for the click/assertion steps after it.
        timeout-minutes: 8
        run: cargo test -p mae --features gui --test gui_windows_input_spike

  daemon:
    name: daemon / check + test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.version-bump-only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          workspaces: "daemon -> daemon/target"
          nextest: "true"
          # Issue #491: clippy + test build in debug profile here (only the
          # final "Build release binary" step below is --release), so
          # incremental compilation is disabled to make sccache effective
          # for those debug-profile steps too.
          sccache: "true"
          incremental: "false"
          mold: "true"
      - name: clippy
        run: cd daemon && cargo clippy --all-targets -- -D warnings
      - name: test
        # Issue #470: the daemon workspace's real socket tests already bind
        # ephemeral ports (127.0.0.1:0), confirmed by direct grep of
        # daemon/tests/{network_e2e,oauth_e2e}.rs -- exactly the pattern
        # nextest's process-per-test model needs to avoid port collisions,
        # so this conversion carries materially lower risk than it would for
        # a fixed-port test suite.
        run: cd daemon && cargo nextest run
        timeout-minutes: 5
      - name: fmt
        run: cd daemon && cargo fmt --check
      - name: Build release binary
        run: cd daemon && cargo build --release
      - name: Upload daemon binary
        uses: actions/upload-artifact@v7
        with:
          name: mae-daemon-binary
          path: daemon/target/release/mae-daemon
          retention-days: 1

  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  export-js-check:
    name: kb-export-subgraph-html graph.js syntax check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.export-js == 'true'
    # crates/export/assets/graph.js is a real, checked-in JS file (extracted
    # from an inline Rust string literal specifically to make this possible --
    # see html_graph.rs's own doc comment): a real regex-literal-corruption
    # bug in it once shipped unnoticed, caught only by manually running
    # `node --check`, before there was any automated gate at all. This is
    # that gate, made permanent -- a cheap syntax-only fast-fail, distinct
    # from (and much faster than) the full real-browser behavioral suite in
    # crates/export/tests/browser/ (not wired into CI yet -- see that
    # directory's README).
    steps:
      - uses: actions/checkout@v7
      - run: node --check crates/export/assets/graph.js

  msrv:
    name: MSRV / 1.95 build + test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.version-bump-only != 'true'
    # Keep "1.95" in sync with Cargo.toml's `rust-version = "1.95"` by hand --
    # this is the only leg that actually proves the declared MSRV compiles;
    # every other job uses `stable`, which drifts forward over time and would
    # otherwise let the MSRV promise silently rot. `continue-on-error: true`
    # for its first appearance (never verified against 1.95 before, and a
    # dependency MSRV mismatch surfacing as a hard failure on day one would
    # block every PR on a pre-existing gap this leg only just discovered) --
    # matching this repo's own established pattern of proving a new leg
    # stable across real runs before promoting it to a required, blocking
    # check (see windows-remote-e2e's identical posture).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.95"
          nextest: "true"
          # Issue #491: this leg builds in debug profile (no --release), so
          # incremental compilation is disabled to make sccache effective.
          sccache: "true"
          incremental: "false"
          mold: "true"
      - uses: ./.github/actions/install-gui-deps
      - name: cargo build (MSRV)
        run: cargo build --workspace --features gui
      - name: cargo test (MSRV -- lib + bins only, fast signal; full suite already covered on stable)
        # nextest is a prebuilt binary (taiki-e/install-action), not compiled
        # against the 1.95 toolchain under test -- no MSRV interaction.
        run: cargo nextest run --workspace --lib --bins --features gui

  server-client:
    name: Server-Client Integration
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.version-bump-only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          # Both workspaces: this job's own "Build daemon binary" + "Daemon
          # collab tests" steps below compile the daemon workspace too, but
          # were landing in the DEFAULT (root-workspace-only) rust-cache
          # scope and getting recompiled from scratch on every run.
          workspaces: |
            .
            daemon -> daemon/target
          # Issue #491: every build step in this job is debug profile (no
          # --release anywhere), so incremental compilation is disabled to
          # make sccache effective.
          sccache: "true"
          incremental: "false"
          mold: "true"
      - name: Multi-client integration tests
        run: cargo test --package mae-mcp --lib -- --test-threads=1
        timeout-minutes: 5
      - name: KB WAL integration tests
        run: cargo test --package mae-kb --lib -- wal changelog sync --test-threads=1
        timeout-minutes: 3
      - name: File safety tests
        run: cargo test --package mae-core --lib -- content_hash file_lock --test-threads=1
        timeout-minutes: 3
      - name: Build daemon binary
        run: cd daemon && cargo build
      - name: Daemon collab tests
        run: cd daemon && cargo test -- --test-threads=1 --nocapture
        timeout-minutes: 10
        env:
          # MAE_TCP_E2E=1 un-skips network_e2e.rs (real-TCP daemon-spawn suite —
          # the only e2e for sync/resync). Each test spawns an XDG-isolated daemon,
          # so it composes with the in-process collab_e2e tests in this same run.
          MAE_TCP_E2E: "1"
          RUST_LOG: "mae_daemon=debug,mae_sync=debug,warn"
      - name: TCP E2E tests (PSK auth + KB protocol)
        # collab_tcp_e2e.rs was split into 4 files by section (2026-07); each
        # `--test` target below is the file that now contains the matching tests.
        run: |
          cargo test --package mae --test collab_tcp_e2e_psk_auth -- tcp_psk --ignored --test-threads=1 --nocapture
          cargo test --package mae --test collab_tcp_e2e_psk_auth -- tcp_kb --ignored --test-threads=1 --nocapture
          cargo test --package mae --test collab_tcp_e2e_kb_protocol -- tcp_kb --ignored --test-threads=1 --nocapture
          cargo test --package mae --test collab_tcp_e2e_kb_stress -- tcp_kb --ignored --test-threads=1 --nocapture
          cargo test --package mae --test collab_tcp_e2e_tests -- tcp_full_roundtrip --ignored --test-threads=1 --nocapture
          cargo test --package mae --test collab_tcp_e2e_tests -- tcp_two_editors --ignored --test-threads=1 --nocapture
        timeout-minutes: 5
        env:
          MAE_TCP_E2E: "1"
          RUST_LOG: "mae_daemon=debug,warn"
      - name: Daemon-boundary e2e (real spawn / supervise / circuit-breaker)
        # Drives the editor's on-demand spawn → readiness → daemon/status →
        # watchdog-restart → circuit-breaker path against the REAL daemon built
        # above (ADR-035 #136). Skips elsewhere (no MAE_DAEMON_BIN); here the daemon
        # exists so it runs. The DaemonTestEnv harness reaps every spawn (no leaks).
        run: MAE_DAEMON_BIN="$(pwd)/daemon/target/debug/mae-daemon" cargo test -p mae --bin mae daemon_lifecycle_e2e -- --test-threads=1 --nocapture
        timeout-minutes: 5
      - name: KB lifecycle E2E (CozoDB)
        run: cargo test --package mae --test kb_lifecycle_e2e -- --ignored --test-threads=1 --nocapture
        timeout-minutes: 5
        env:
          MAE_KB_LIFECYCLE: "1"
      - name: Build manual KB
        run: cargo run --bin build-manual-kb -- /tmp/mae-manual.cozo
        timeout-minutes: 3
      - name: Daemon check-config
        run: cd daemon && cargo run -- --check-config
        timeout-minutes: 1
      # mDNS LAN-discovery round-trip (register → browse → resolve). Best-effort:
      # depends on multicast on the runner, which shared CI can't guarantee, so it's
      # `continue-on-error` — it gives live signal when it works but never gates the
      # build on multicast availability/timing. The deterministic parse-path tests
      # (build_discovered_peer_*) run unconditionally in the `check` job.
      - name: mDNS discovery round-trip (best-effort)
        run: cargo test --package mae --bin mae mdns_round_trip -- --nocapture
        continue-on-error: true
        timeout-minutes: 2
        env:
          MAE_MDNS_E2E: "1"
          RUST_LOG: "mae=debug,warn"

  containers:
    name: container / smoke + new-user
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.containers == 'true' && needs.changes.outputs.version-bump-only != 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test container
        run: docker compose run --rm --build smoke
      - name: Validate new-user flow in clean container
        run: docker compose run --rm --build new-user

  # E2E validation: downloads pre-built binary from stable/test.
  # Falls back to local build if artifact not yet available.
  e2e:
    name: e2e / scheme + packages
    runs-on: ubuntu-latest
    needs: [check, daemon, changes]
    if: needs.changes.outputs.version-bump-only != 'true'
    steps:
      - uses: actions/checkout@v7
      # No dtolnay/rust-toolchain here -- this job only runs pre-built
      # binaries downloaded from the `check`/`daemon` jobs, never invokes
      # cargo itself (confirmed by grep; the toolchain step was dead weight).
      # install-gui-deps IS still needed: the downloaded `mae` binary was
      # built --features gui, so it needs libfontconfig/libfreetype present
      # at RUNTIME (dynamic linking), not just at compile time.
      - uses: ./.github/actions/install-gui-deps
        with:
          extra-packages: iproute2
      - name: Download mae binary
        uses: actions/download-artifact@v8
        with:
          name: mae-binary
          path: /tmp/mae-dl
      - name: Install mae binary
        run: |
          mkdir -p target/release
          cp /tmp/mae-dl/mae target/release/mae
          cp /tmp/mae-dl/mae-agent target/release/mae-agent
          chmod +x target/release/mae target/release/mae-agent
      - name: mae-agent smoke check (binary runs, fails cleanly with no live socket)
        # A full live-process e2e (real `mae` + PSK handshake + `mae-agent --check`)
        # needs a real controlling tty (crossterm's raw-mode enable errors ENXIO
        # without one) and interacts with the first-run wizard even under a pty —
        # real, but nontrivial, infra to get right; scoped out of this pass (see
        # PR discussion). This step is deliberately narrower: it only proves the
        # compiled `mae-agent` binary starts, parses `--check`, and fails cleanly
        # (not a panic) when no socket is present — catching a build/link
        # regression or a crash-instead-of-clean-error regression in the
        # discovery path, which unit tests alone (mocked transport) can't catch.
        run: |
          set +e
          ./target/release/mae-agent --check --socket /tmp/mae-nonexistent-$$.sock
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "expected a nonzero exit for a nonexistent socket, got 0"
            exit 1
          fi
          echo "OK: mae-agent exited $code (clean failure, no panic)"
      - name: Download daemon binary
        uses: actions/download-artifact@v8
        with:
          name: mae-daemon-binary
          path: /tmp/daemon-dl
      - name: Install daemon binary
        run: |
          mkdir -p daemon/target/release
          cp /tmp/daemon-dl/mae-daemon daemon/target/release/mae-daemon
          chmod +x daemon/target/release/mae-daemon
      - name: Validate init.scm
        run: ./target/release/mae --check-config
      - name: Editor tests
        run: ./target/release/mae --test tests/editor/
      - name: CRDT tests
        run: ./target/release/mae --test tests/crdt/
      - name: Collab local tests
        run: ./target/release/mae --test tests/collab-local/
      - name: Trusted-peer mTLS e2e
        env:
          MAE_BIN: ${{ github.workspace }}/target/release/mae
          MAE_DAEMON_BIN: ${{ github.workspace }}/daemon/target/release/mae-daemon
        run: scripts/collab-mtls-e2e.sh
      - name: Per-KB membership e2e
        env:
          MAE_BIN: ${{ github.workspace }}/target/release/mae
          MAE_DAEMON_BIN: ${{ github.workspace }}/daemon/target/release/mae-daemon
        run: scripts/collab-membership-e2e.sh
      - name: E2E encrypted KB-sharing lifecycle (ADR-037 Phase 3d gate)
        env:
          MAE_BIN: ${{ github.workspace }}/target/release/mae
          MAE_DAEMON_BIN: ${{ github.workspace }}/daemon/target/release/mae-daemon
        run: scripts/collab-encrypted-e2e.sh
      - name: E2E §D3 removal+rotation (removed member can't read post-rotation content)
        env:
          MAE_BIN: ${{ github.workspace }}/target/release/mae
          MAE_DAEMON_BIN: ${{ github.workspace }}/daemon/target/release/mae-daemon
          MAE_E2E_REMOVAL: "1"
        run: scripts/collab-encrypted-e2e.sh
      - name: E2E ADR-040 owner identity rotation (rotated owner authors content, member converges)
        env:
          MAE_BIN: ${{ github.workspace }}/target/release/mae
          MAE_DAEMON_BIN: ${{ github.workspace }}/daemon/target/release/mae-daemon
          MAE_E2E_ROTATE: "1"
        run: scripts/collab-encrypted-e2e.sh
      - name: E2E ADR-040 recovery-key (lost member recovers via offline key, decrypts content)
        env:
          MAE_BIN: ${{ github.workspace }}/target/release/mae
          MAE_DAEMON_BIN: ${{ github.workspace }}/daemon/target/release/mae-daemon
          MAE_E2E_RECOVER: "1"
        run: scripts/collab-encrypted-e2e.sh
      - name: E2E ADR-025 P2P mesh (two daemons converge a KB over iroh, no hub)
        env:
          MAE_BIN: ${{ github.workspace }}/target/release/mae
          MAE_DAEMON_BIN: ${{ github.workspace }}/daemon/target/release/mae-daemon
        run: scripts/collab-p2p-mesh-e2e.sh
      - name: E2E ADR-043 P2P mesh + encryption (content sealed, daemons key-blind over the mesh)
        env:
          MAE_BIN: ${{ github.workspace }}/target/release/mae
          MAE_DAEMON_BIN: ${{ github.workspace }}/daemon/target/release/mae-daemon
          MAE_E2E_MESH: "1"
        run: scripts/collab-p2p-mesh-e2e.sh
      - name: Package install
        run: |
          mkdir -p ~/.config/mae
          cat > ~/.config/mae/init.scm <<'SCHEME'
          (package! "splash-themes" :source "github:cuttlefisch/mae-splash-themes")
          SCHEME
          ./target/release/mae sync
          test -f ~/.config/mae/packages/splash-themes/module.toml
          ./target/release/mae --check-config
          test -f ~/.config/mae/packages.lock

  scheme-runtime:
    name: scheme / R7RS compliance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.version-bump-only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          nextest: "true"
          # Issue #491: every `cargo nextest run` step below is debug
          # profile (no --release), so incremental compilation is disabled
          # to make sccache effective.
          sccache: "true"
          incremental: "false"
          mold: "true"
      - name: R7RS compliance tests
        run: cargo nextest run -p mae-scheme --test r7rs_compliance --nocapture
        timeout-minutes: 10
      - name: Scheme torture tests
        run: cargo nextest run -p mae-scheme --test scheme_torture --nocapture
        timeout-minutes: 5
      - name: Scheme benchmark tests
        run: cargo nextest run -p mae-scheme --test scheme_benchmarks --nocapture
        timeout-minutes: 10
      - name: Scheme real programs
        run: cargo nextest run -p mae-scheme --test scheme_programs --nocapture
        timeout-minutes: 5
      - name: Scheme IO port tests
        run: cargo nextest run -p mae-scheme --test scheme_io_ports --nocapture
        timeout-minutes: 5
