name: Version Bump

on:
  pull_request:
    types: [closed]
    branches: [main]

# PRs merging within seconds of each other used to trigger overlapping runs
# that raced to bump/push/tag `main` concurrently: two would fail fast on a
# git-push conflict, and the "winner" could still lose its own 35-minute
# CI-wait poll (its commit's check-suite state gets muddied by the other
# runs' redundant pushes), skipping the tag entirely — VERSION/Cargo.toml
# and the changelog commit land on main, but no git tag and no release ever
# gets published for that version (confirmed: this happened to 0.14.45).
# `cancel-in-progress: false` queues instead of racing OR killing a run
# mid-bump/tag, which would leave things in a half-done state.
concurrency:
  group: version-bump-main
  cancel-in-progress: false

env:
  # Harden dependency fetching against transient network flakes (curl HTTP/2
  # framing errors mid-fetch). See ci.yml for the full rationale.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Determine version bump type
        id: bump-type
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          # Skip version bump entirely with release:none label.
          # Only bump minor/major with explicit PR labels.
          # Default is always patch — no commit message inference.
          if echo "$PR_LABELS" | grep -q 'release:none'; then
            echo "bump=none" >> "$GITHUB_OUTPUT"
            echo "Bump type: none (skipped via PR label)"
          elif echo "$PR_LABELS" | grep -q 'release:major'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
            echo "Bump type: major (from PR label)"
          elif echo "$PR_LABELS" | grep -q 'release:minor'; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            echo "Bump type: minor (from PR label)"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "Bump type: patch (default)"
          fi

      - name: Bump version
        if: steps.bump-type.outputs.bump != 'none'
        id: version
        run: |
          if [ -f VERSION ]; then
            CURRENT=$(cat VERSION)
          else
            CURRENT="0.1.0"
          fi

          IFS='.' read -r major minor patch <<< "$CURRENT"

          case "${{ steps.bump-type.outputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          NEW="${major}.${minor}.${patch}"
          echo "$NEW" > VERSION
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped: $CURRENT -> $NEW"

      - name: Update Cargo.toml versions
        if: steps.bump-type.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update the workspace version in the root Cargo.toml.
          # Editor crates use version.workspace = true, so the root handles them.
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          echo "Updated root Cargo.toml to $VERSION"

          # Shared crates and daemon have their own version fields (not workspace-inherited).
          for f in shared/kb/Cargo.toml shared/sync/Cargo.toml shared/mcp/Cargo.toml daemon/Cargo.toml; do
            sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" "$f"
            echo "Updated $f to $VERSION"
          done

          # Update install script version string.
          sed -i "s/^VERSION=\".*\"/VERSION=\"$VERSION\"/" assets/install.sh
          echo "Updated assets/install.sh to $VERSION"

          # Regenerate BOTH lockfiles so they agree with the manifests just
          # edited. Without this every release tagged a tree whose committed
          # Cargo.lock still named the PREVIOUS version, so the lock did not
          # match the version it was tagged as and the next `cargo build`
          # anywhere dirtied the tree (#61).
          #
          # `-w` (--workspace) re-resolves ONLY the local workspace members --
          # exactly the crates whose versions changed -- so no external
          # dependency is silently bumped as a side effect of a version bump.
          # `--offline` because nothing new needs fetching: the only edits are
          # to path dependencies already in the lock. It also means a registry
          # outage cannot fail a release, and makes an accidental external
          # bump impossible rather than merely unlikely.
          cargo update -w --offline
          (cd daemon && cargo update -w --offline)
          echo "Regenerated Cargo.lock + daemon/Cargo.lock at $VERSION"

          # The locks must now be clean against the manifests. If anything
          # other than the local version strings moved, stop rather than tag a
          # release whose dependency graph changed unnoticed.
          if ! git diff --quiet --exit-code -- Cargo.lock daemon/Cargo.lock; then
            CHANGED=$(git diff -U0 -- Cargo.lock daemon/Cargo.lock \
              | grep -E "^[+-]" | grep -vE "^[+-][+-]" | grep -vE "^[+-]version = " || true)
            if [ -n "$CHANGED" ]; then
              echo "::error::cargo update -w changed more than version strings:"
              echo "$CHANGED"
              exit 1
            fi
          fi

      # Prebuilt binary from GitHub Releases, not `cargo install git-cliff`,
      # which compiled it from source on every single release: 4m13s of the
      # v0.14.90 bump job. Same action the repo already uses for nextest.
      - uses: taiki-e/install-action@v2
        if: steps.bump-type.outputs.bump != 'none'
        with:
          tool: git-cliff

      - name: Generate changelog
        if: steps.bump-type.outputs.bump != 'none'
        run: |
          # --tag tells git-cliff to label commits since the last real tag
          # as belonging to this version NOW, even though the actual git
          # tag isn't created until the later "Tag release" step (after the
          # CI wait) — without it, git-cliff has nothing to attribute these
          # commits to and labels them "[Unreleased]" instead, permanently
          # (nothing ever re-runs git-cliff after tagging to fix it up).
          git cliff --tag "v${{ steps.version.outputs.version }}" --output CHANGELOG.md
          echo "Generated CHANGELOG.md"

      - name: Commit version bump
        if: steps.bump-type.outputs.bump != 'none'
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md Cargo.toml Cargo.lock \
            shared/kb/Cargo.toml shared/sync/Cargo.toml shared/mcp/Cargo.toml \
            daemon/Cargo.toml daemon/Cargo.lock assets/install.sh
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin main

      - name: Wait for CI to pass on main
        if: steps.bump-type.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          # Get the SHA of the version bump commit we just pushed
          SHA=$(git rev-parse HEAD)
          echo "Waiting for CI on commit $SHA..."

          # Poll for up to 60 minutes. Was 35 (CI "typically" 20-25 min) --
          # raised after a real, confirmed miss: the CI run for the v0.14.55
          # bump commit genuinely passed but took 37.5 minutes wall-clock
          # (21:10:51-21:48:27), 2.5 min past the old budget, skipping the
          # tag for a release that was actually green (same shape as the
          # earlier documented v0.14.45 miss above, though that one's root
          # cause was concurrent-run racing, not budget sizing -- this is a
          # second, independent way this same symptom (bump commit lands,
          # tag never does) can happen). 60 min gives real headroom above
          # the worst genuinely-observed duration, not just past it.
          for i in $(seq 1 120); do
            # Gate ONLY on the "CI" workflow run for this commit -- not on
            # check-suites broadly, which used to fold in every OTHER
            # github-actions workflow that also happens to run on push to
            # main (Badges, most notably). A real, observed miss: the v0.14.58
            # bump commit's actual CI was still legitimately green (in
            # progress, later passed) while Badges independently failed for
            # its own unrelated reason -- check-suites' "any workflow failed"
            # semantics treated that as a reason to skip tagging a release
            # whose real code was fine. Badges updates a gist-hosted shields.io
            # badge; it has no bearing on whether the tagged commit is safe to
            # release, and must never gate the release the way a genuine code
            # CI failure does. Uses the Actions runs API (which reports a
            # `name` per workflow directly) instead of check-suites (which
            # only exposes an opaque per-app conclusion with no per-workflow
            # breakout) specifically so this can filter to the one workflow
            # that actually represents "is the code correct."
            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | if length == 0 then "pending" elif all(.conclusion == "success" or .conclusion == "skipped") then "success" elif any(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") then "failure" else "pending" end' 2>/dev/null || echo "pending")

            echo "  Attempt $i: CI workflow=$CONCLUSION"

            if [ "$CONCLUSION" = "success" ]; then
              echo "CI passed!"
              break
            elif [ "$CONCLUSION" = "failure" ]; then
              echo "::error::CI failed on main — skipping tag to prevent broken release"
              exit 1
            fi

            sleep 30
          done

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI did not complete within 35 minutes — skipping tag"
            exit 1
          fi

      - name: Tag release
        if: steps.bump-type.outputs.bump != 'none'
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          # Delete existing tag if present (handles re-runs after partial failure)
          git tag -d "$VERSION" 2>/dev/null || true
          git push origin ":refs/tags/$VERSION" 2>/dev/null || true
          git tag "$VERSION"
          git push origin --tags
