name: Badges

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Harden dependency fetching against transient network flakes (curl HTTP/2
  # framing errors mid-fetch). See ci.yml for the full rationale.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  update:
    name: update badges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - uses: ./.github/actions/install-gui-deps

      - name: Count tests
        id: tests
        # Issue reported directly by the user (2026-07-28): this badge showed
        # "452 passing" against a real ~7,223+ test suite. Root cause, confirmed
        # by local reproduction (not assumed): plain `cargo test --workspace`
        # stops the ENTIRE workspace run at the FIRST test binary containing any
        # failure -- it does not continue to later crates the way this step's own
        # `|| true` implied. A real, separately-tracked flake (#502, `mae-core`'s
        # kb_ops watcher tests under parallel execution) was tripping this exact
        # trap: whichever crate's tests happened to fail first that run silently
        # truncated the whole count to a tiny fraction of the real total, with
        # zero visible error (`|| true` here and `continue-on-error` on the
        # badge-update steps both swallowed it into a false "success"). nextest's
        # own default is to run every test regardless of other failures, so its
        # final summary line is a single authoritative total for the WHOLE run
        # ("Summary [ Xs] N tests run: N passed (n slow), M skipped"), not a
        # fragile per-binary sum vulnerable to early truncation. Doesn't run
        # doctests (a known nextest limitation, already load-bearing knowledge
        # from this repo's own CI migration) -- a non-issue here since
        # `cargo test --doc` reports 0 doctests across every crate in this
        # workspace today (confirmed by direct observation across many local/CI
        # runs this session).
        run: |
          set +e
          cargo nextest run --workspace --features gui 2>&1 | tee /tmp/nextest-badge-output.log
          set -e
          TOTAL=$( (grep -oP '\d+(?= tests run)' /tmp/nextest-badge-output.log || true) | tail -1)
          if [ -z "$TOTAL" ]; then
            echo "::error::Could not parse a test count from nextest output -- see the raw log above. Refusing to publish a wrong/zero badge."
            exit 1
          fi
          FORMATTED=$(printf "%'d" "$TOTAL")
          echo "Parsed test count: $FORMATTED"
          echo "count=$FORMATTED" >> $GITHUB_OUTPUT

      - name: Count lines of code
        id: loc
        run: |
          cargo install tokei --locked 2>/dev/null || true
          JSON=$(tokei crates/ shared/ daemon/src/ modules/ -t Rust,Scheme,TOML -o json)
          CODE=$(echo "$JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['Total']['code'])")
          echo "count=~$((CODE / 1000))k" >> $GITHUB_OUTPUT

      - name: Validate badge config
        run: |
          if [ -z "${{ secrets.MAE_BADGE_TOKEN }}" ]; then
            echo "::warning::MAE_BADGE_TOKEN secret is not set — skipping badge updates"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
          if [ -z "${{ vars.MAE_BADGE_GIST }}" ]; then
            echo "::warning::MAE_BADGE_GIST variable is not set — skipping badge updates"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
        id: badge_check

      - name: Update test badge
        if: steps.badge_check.outputs.skip != 'true'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.MAE_BADGE_TOKEN }}
          gistID: ${{ vars.MAE_BADGE_GIST }}
          filename: mae-tests.json
          label: tests
          message: "${{ steps.tests.outputs.count }} passing"
          color: brightgreen

      - name: Update LOC badge
        if: steps.badge_check.outputs.skip != 'true'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.MAE_BADGE_TOKEN }}
          gistID: ${{ vars.MAE_BADGE_GIST }}
          filename: mae-loc.json
          label: lines of code
          message: "${{ steps.loc.outputs.count }}"
          color: informational
