name: Badges

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Harden dependency fetching against transient network flakes (curl HTTP/2
  # framing errors mid-fetch). See ci.yml for the full rationale.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  update:
    name: update badges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Both workspaces -- mirrors ci.yml's `stable / test` leg (same
          # rationale: the "Build mae-daemon" step below needs the daemon
          # workspace built too, and without this it lands in the default
          # (root-workspace-only) cache scope and recompiles from scratch
          # every run).
          workspaces: |
            .
            daemon -> daemon/target
      - uses: taiki-e/install-action@nextest

      - uses: ./.github/actions/install-gui-deps

      # Found while verifying #511's split-invocation fix: this step never
      # built the daemon workspace, unlike ci.yml's `stable / test` leg
      # (`Build mae-daemon (for headless_kb_convergence_e2e)`, `ci.yml:126`).
      # Previously invisible -- the ORIGINAL #510 contention bug always
      # exhausted a heavy-group test's retries first and cancelled the whole
      # nextest run before reaching `headless_kb_convergence_e2e`, so this
      # gap never got the chance to fail on its own. #511's split fixed that
      # masking failure (confirmed: no heavy-group test failed on a
      # socket-bind timeout in that verification run) and, in doing so,
      # surfaced this pre-existing, fully deterministic gap for the first
      # time. Mirrors ci.yml's step exactly.
      - name: Build mae-daemon (for headless_kb_convergence_e2e)
        run: cd daemon && cargo build --release --bin mae-daemon

      - name: Count tests
        id: tests
        # Issue reported directly by the user (2026-07-28): this badge showed
        # "452 passing" against a real ~7,223+ test suite. Root cause, confirmed
        # by local reproduction (not assumed): plain `cargo test --workspace`
        # stops the ENTIRE workspace run at the FIRST test binary containing any
        # failure -- it does not continue to later crates the way this step's own
        # `|| true` implied. A real, separately-tracked flake (#502, `mae-core`'s
        # kb_ops watcher tests under parallel execution) was tripping this exact
        # trap: whichever crate's tests happened to fail first that run silently
        # truncated the whole count to a tiny fraction of the real total, with
        # zero visible error (`|| true` here and `continue-on-error` on the
        # badge-update steps both swallowed it into a false "success"). nextest's
        # own default is to run every test regardless of other failures, so its
        # final summary line is a single authoritative total for the WHOLE run
        # ("Summary [ Xs] N tests run: N passed (n slow), M skipped"), not a
        # fragile per-binary sum vulnerable to early truncation. Doesn't run
        # doctests (a known nextest limitation, already load-bearing knowledge
        # from this repo's own CI migration) -- a non-issue here since
        # `cargo test --doc` reports 0 doctests across every crate in this
        # workspace today (confirmed by direct observation across many local/CI
        # runs this session).
        #
        # Issue #510: a real, structural fix, not a bigger retry count. The 5
        # `heavy-subprocess-e2e` files (real `mae --headless` subprocesses making
        # real resource-bound assertions -- near-zero idle CPU, bounded FD/RSS
        # growth, an MCP round trip within a real timeout) are already
        # serialized against EACH OTHER (`.config/nextest.toml`'s test-group),
        # but that never protected them from the OTHER residual contention
        # window that group's own comment already named: "the hundreds of OTHER
        # test binaries nextest starts concurrently at the very beginning of a
        # full run." Confirmed causing a genuine, repeated failure (not
        # speculative): `guidance_content_over_budget_falls_back_to_pointer_over_
        # the_real_wire` failed all 3 attempts (1 + the group's own retries=2) on
        # a real CI run, each attempt independently timing out around the same
        # ~30s mark -- the spawned `mae --headless` process was too CPU-starved
        # by everything else scheduling at once to even bind its own socket.
        # Splitting into two SEQUENTIAL invocations removes the actual
        # contention instead of retrying through it: the heavy-subprocess-e2e
        # binaries run FIRST, alone, on an otherwise-idle runner (the most
        # favorable timing these latency-sensitive tests can get), then
        # everything else runs after -- no shared window where both compete for
        # the same CPU at once. Sums both runs' "tests run" totals for the badge.
        run: |
          set +e
          # mcp_tool_tiering_e2e added after #511's verification run: it
          # spawns a real `mae --headless` subprocess and asserts a socket
          # bind within a bounded wall-clock window -- the identical failure
          # profile as the other 5 (`headless instance never bound its
          # stable socket`) -- but had never been added to this filter or to
          # `.config/nextest.toml`'s `heavy-subprocess-e2e` group, so it was
          # still exposed to the full-suite startup burst. See
          # .config/nextest.toml for the matching group membership.
          HEAVY_FILTER='binary(headless_e2e) + binary(guidance_delivery_e2e) + binary(headless_kb_convergence_e2e) + binary(headless_soak_shaped_e2e) + binary(headless_idle_cpu_e2e) + binary(mcp_tool_tiering_e2e)'
          # PIPESTATUS[0], not $? -- `$?` after `cmd | tee file` reflects
          # `tee`'s own exit code unless the shell has `pipefail` set, and this
          # step deliberately doesn't assume that (explicit is safer than
          # relying on GitHub Actions' default bash flags, which could change).
          cargo nextest run --workspace --features gui -E "$HEAVY_FILTER" 2>&1 | tee /tmp/nextest-badge-output-heavy.log
          RC_HEAVY=${PIPESTATUS[0]}
          cargo nextest run --workspace --features gui -E "not ($HEAVY_FILTER)" 2>&1 | tee /tmp/nextest-badge-output-rest.log
          RC_REST=${PIPESTATUS[0]}
          set -e
          if [ "$RC_HEAVY" -ne 0 ] || [ "$RC_REST" -ne 0 ]; then
            echo "::error::A nextest run failed -- see the raw logs above. Refusing to publish a wrong/zero badge."
            exit 1
          fi
          HEAVY_TOTAL=$( (grep -oP '\d+(?= tests run)' /tmp/nextest-badge-output-heavy.log || true) | tail -1)
          REST_TOTAL=$( (grep -oP '\d+(?= tests run)' /tmp/nextest-badge-output-rest.log || true) | tail -1)
          if [ -z "$HEAVY_TOTAL" ] || [ -z "$REST_TOTAL" ]; then
            echo "::error::Could not parse a test count from nextest output -- see the raw logs above. Refusing to publish a wrong/zero badge."
            exit 1
          fi
          TOTAL=$((HEAVY_TOTAL + REST_TOTAL))
          FORMATTED=$(printf "%'d" "$TOTAL")
          echo "Parsed test count: $FORMATTED (heavy=$HEAVY_TOTAL + rest=$REST_TOTAL)"
          echo "count=$FORMATTED" >> $GITHUB_OUTPUT

      - name: Count lines of code
        id: loc
        run: |
          cargo install tokei --locked 2>/dev/null || true
          JSON=$(tokei crates/ shared/ daemon/src/ modules/ -t Rust,Scheme,TOML -o json)
          CODE=$(echo "$JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['Total']['code'])")
          echo "count=~$((CODE / 1000))k" >> $GITHUB_OUTPUT

      - name: Validate badge config
        run: |
          if [ -z "${{ secrets.MAE_BADGE_TOKEN }}" ]; then
            echo "::warning::MAE_BADGE_TOKEN secret is not set — skipping badge updates"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
          if [ -z "${{ vars.MAE_BADGE_GIST }}" ]; then
            echo "::warning::MAE_BADGE_GIST variable is not set — skipping badge updates"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
        id: badge_check

      - name: Update test badge
        if: steps.badge_check.outputs.skip != 'true'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.MAE_BADGE_TOKEN }}
          gistID: ${{ vars.MAE_BADGE_GIST }}
          filename: mae-tests.json
          label: tests
          message: "${{ steps.tests.outputs.count }} passing"
          color: brightgreen

      - name: Update LOC badge
        if: steps.badge_check.outputs.skip != 'true'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.MAE_BADGE_TOKEN }}
          gistID: ${{ vars.MAE_BADGE_GIST }}
          filename: mae-loc.json
          label: lines of code
          message: "${{ steps.loc.outputs.count }}"
          color: informational
