[defaults]
inventory = inventory/
roles_path = roles/
# Every run is logged. Deployment without an audit trail is not deployment.
log_path = ./ansible-deploy.log
stdout_callback = yaml
# Show which task changed what, so a `--check --diff` run is genuinely readable.
display_skipped_hosts = false
forks = 10
# Facts are needed by preflight (OS, service manager, free space).
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 3600
interpreter_python = auto_silent

[privilege_escalation]
become = false
become_method = sudo

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
