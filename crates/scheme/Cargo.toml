[package]
name = "mae-scheme"
description = "Embedded Scheme (R7RS-small) runtime for extensions"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mae-core = { path = "../core" }
mae-kb = { path = "../../shared/kb", features = ["storage-sqlite", "storage-sled", "crdt"] }
mae-sync = { path = "../../shared/sync" }
# For (kb-export-subgraph-html ...) (ADR-077 --
# following the kb-graph-view-* precedent: the real logic stays in
# mae-ai/mae-export, this crate only wires a Scheme-callable primitive onto
# it). mae-ai does not depend on mae-scheme anywhere in its own tree, so
# this is a new, non-circular edge.
mae-ai = { path = "../ai" }
base64 = "0.23"
tracing = { workspace = true }
libc = "0.2"
parking_lot = "0.12"
serde_json = "1"
