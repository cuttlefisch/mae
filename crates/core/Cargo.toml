[package]
name = "mae-core"
description = "Buffer management, event loop, and core primitives"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# ADR-062 Phase D: forwards to mae-kb's own `remote-hub` feature (a `RemoteHubQueryLayer`
# blended into `rebuild_query_layer` for `KbInstanceKind::RemoteHub` registry entries).
# Off by default, matching `crates/mae`'s own `gui` feature precedent — pulls a TLS+HTTP
# client into the binary only when a user actually opts in (`mae --features remote-hub`),
# not for every build.
remote-hub = ["mae-kb/remote-hub"]

[dependencies]
mae-effect-sandbox = { path = "../../shared/effect-sandbox" }
mae-babel = { path = "../babel" }
mae-canvas = { path = "../canvas" }
mae-export = { path = "../export" }
mae-format = { path = "../format" }
mae-kb = { path = "../../shared/kb", features = ["storage-sqlite", "storage-sled", "crdt"] }
mae-lookup = { path = "../lookup" }
mae-make = { path = "../make" }
mae-snippets = { path = "../snippets" }
mae-spell = { path = "../spell" }
mae-sync = { path = "../../shared/sync" }
ropey = "1"
# ADR-087 Rule 7: exact-pinned, not a semver range. unicode-width's own docs:
# "Relying on any character producing a stable width in this crate is likely
# the sign of a bug" -- an unpinned minor bump can silently change every
# width computation in the editor (ratatui deliberately does NOT pin this,
# which is why mae-core must). mae-core is the only crate in the workspace
# that may depend on unicode-width/unicode-segmentation directly (Rule 7);
# mae-renderer/mae-gui go through mae_core::display_width /
# mae_core::grapheme.
unicode-width = "=0.2.2"
unicode-segmentation = "1.12"
regex = "1"
tracing = { workspace = true }
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-scheme = "0.24"
tree-sitter-yaml = "0.7"
hostname = "0.4"
sha2 = "0.11"
sysinfo = "0.39"
libc = "0.2"
imagesize = "0.15"
kamadak-exif = "0.6"
hex = "0.4"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-containerfile = "0.9"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
# ADR-087 enforcement item 5: proptest invariants (never panics, output
# width <= N, grapheme-boundary prefix, idempotence) for the width/
# truncation helpers. Caveat (measured, see the ADR): proptest's default
# `String` generator cannot produce ZWJ sequences (category Cf is
# excluded), so the named nasty-string corpus in `grapheme.rs`'s test
# module covers ZWJ/combining-mark/flag/skin-tone cases proptest can't
# reach on its own.
proptest = "1"
# ADR-067 Phase E test fixtures: constructing a real signed membership op-log
# needs a real Ed25519 identity, same as the daemon crate's own test suite.
mae-mcp = { path = "../../shared/mcp" }

[[bench]]
name = "buffer_ops"
harness = false
