[package]
name = "mae"
description = "Modern AI Editor - terminal binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mae"
path = "src/main.rs"

[[bin]]
name = "build-manual-kb"
path = "src/bin/build_manual_kb.rs"

[[bin]]
name = "build-practices-kb"
path = "src/bin/build_practices_kb.rs"

[[bin]]
name = "build-adr-kb"
path = "src/bin/build_adr_kb.rs"

[[bin]]
name = "build-devpractices-kb"
path = "src/bin/build_devpractices_kb.rs"

[[bin]]
name = "verify-adr-kb-sync"
path = "src/bin/verify_adr_kb_sync.rs"

[dependencies]
mae-effect-sandbox = { path = "../../shared/effect-sandbox" }
mae-core = { path = "../core" }
mae-canvas = { path = "../canvas" }
mae-renderer = { path = "../renderer" }
mae-scheme = { path = "../scheme" }
mae-ai = { path = "../ai" }
mae-lsp = { path = "../lsp" }
mae-dap = { path = "../dap" }
mae-shell = { path = "../shell" }
mae-kb = { path = "../../shared/kb", features = ["storage-sled", "crdt"] }
mae-mcp = { path = "../../shared/mcp" }
mae-sync = { path = "../../shared/sync" }
mae-gui = { path = "../gui", optional = true }
winit = { version = "0.30", optional = true }
mae-scheme-extra = { path = "../scheme-extra", optional = true }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
futures = "0.3"
base64 = "0.23"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "6.0.0"
include_dir = "0.7"
semver = { version = "1", features = ["serde"] }
libc = "0.2"
# ADR-066 Phase C (Windows CI): UTC log-filename timestamps used to use libc::gmtime_r
# directly to avoid a new dependency -- but libc::gmtime_r doesn't exist on Windows (its
# gmtime_s has a different, incompatible argument order), and chrono is already fully
# resolved in the workspace lockfile as a transitive dependency, so using it directly
# here is portable and adds no new external dependency to actually fetch/build.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mdns-sd = "0.20"
hostname = "0.4"
sha2 = "0.11"
hex = "0.4"

[features]
gui = ["dep:mae-gui", "dep:winit"]
# ADR-062 Phase D: enable RemoteHub-kind KB instances (live query against a remote hub's
# ADR-053 surface, no local replication). Off by default — pulls a TLS+HTTP client into
# the binary only when opted in.
remote-hub = ["mae-core/remote-hub"]
# Issue #521: compile in additional out-of-tree Scheme kernel primitives
# via crates/scheme-extra (a downstream fork's own extension point) — see
# that crate's doc comment. Off by default; a no-op until a downstream
# fork adds its own crate as a dependency there.
extra-kernel-crates = ["dep:mae-scheme-extra"]

[dev-dependencies]
tempfile = "3.27.0"
async-trait = "0.1"

# ADR-066 Phase D: `windows-sys` direct FFI for `SendInput`/window-discovery in
# the Windows GUI input smoke test (`tests/gui_windows_input_spike.rs`). Never
# a dependency of the shipping binary -- dev-dependencies only, and further
# gated `cfg(windows)` so non-Windows builds never even resolve it. Version
# picked to match the family already resolved transitively via winit (see
# Cargo.lock) rather than introducing a second, independently-versioned copy.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
