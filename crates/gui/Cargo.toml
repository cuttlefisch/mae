[package]
name = "mae-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI rendering backend for MAE (winit + skia-safe)"

[dependencies]
mae-core = { path = "../core" }
mae-renderer = { path = "../renderer" }
mae-shell = { path = "../shell" }
winit = "0.30"
# Default features only — no `svg`. rust-skia publishes prebuilt Skia binaries
# for particular feature sets, and on Linux none of them includes `svg` without
# `gl` + `x11`; a set with no published binary falls back to a source build that
# is not viable (see `src/svg.rs`). Inline SVG goes through `resvg` instead.
skia-safe = "0.153"
resvg = "0.48"
softbuffer = "0.4"
tracing = { workspace = true }
# ADR-087 Rule 7: no direct unicode-width dependency -- width goes through
# mae_core::display_width / mae_core::grapheme, mae-core's sole call.
