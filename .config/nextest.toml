# cargo-nextest configuration (issue #470). Minimal by design: no artificial
# thread-count constraint (nextest auto-detects, matching `cargo test`'s own
# default) and no blanket retry policy — this project's testing philosophy
# (CLAUDE.md's adversarial-testing principle) treats retries as a targeted,
# named mitigation for an already-root-caused, already-tracked flake, never a
# way to paper over an unexplained failure.

nextest-version = "0.9.70"

# Found empirically while validating this migration (not pre-guessed): these
# 5 integration-test files each spawn a REAL `mae --headless` subprocess and
# assert on its resource usage over real wall-clock time (near-zero idle
# CPU, bounded RSS/FD growth across a soak, an MCP round trip within a real
# timeout). Under a debug build with nextest's default full-machine
# concurrency (dozens of test PROCESSES scheduled at once, unlike `cargo
# test`'s one-binary-at-a-time default), running all 5 heavy subprocess
# tests simultaneously produces genuine system-wide CPU contention that
# breaks their resource-bound assertions -- confirmed by re-running each
# test in isolation, where every one passes cleanly. This is a real
# consequence of nextest's own process-per-test model for exactly this test
# class, not a bug in the tests themselves or in this migration. The
# `--release --features gui` configuration `stable / test` actually uses in
# CI already ran clean as part of a full, unmodified 7223-test run (release
# builds are far more CPU-efficient, so contention was never severe enough
# to trip these assertions there) -- this group is a genuine, proactive
# robustness improvement (also fixes `make test`'s local debug-build path),
# not a response to an observed CI failure.
[test-groups]
heavy-subprocess-e2e = { max-threads = 1 }
# Issues #498/#502: real-filesystem KB tests (org-file watchers via inotify/FSEvents,
# actual `TempDir` read/write/reimport races) that legitimately compete for a
# limited OS resource -- the number of concurrently-open inotify instances/watches
# per user (Linux) or FSEvents streams (macOS). Confirmed by direct root-cause
# analysis, not guessed: `kb_adopt_instance` (crates/core/src/editor/kb_ops/
# registry.rs) already anticipates `OrgDirWatcher::new` failing under "the
# inotify-limit case" in its own pre-existing error-handling comment, and
# `kb_reimport_file`'s id-retraction logic used to depend ENTIRELY on a watcher
# having successfully attached -- silently a no-op otherwise. Reproduced LOCALLY
# (not just in CI) by running just these two modules together under nextest's/
# `cargo test`'s default full-machine concurrency: `kb_ops_durability_tests`'s
# `kb_reimport_file_retracts_id_dropped_by_in_place_rename` and
# `kb_ops_durability_tests`::`kb_promote_node_resave_org_file_...` (both fixed by
# adding a watcher-independent in-memory fallback,
# `KnowledgeBase::ids_by_source_file`) plus `kb_ops_concurrency_tests`/
# `kb_ops_watcher_misc_tests` (still real watcher/store-attach races, not yet
# given an equivalent fallback) all failed under contention and passed cleanly
# in isolation or under `--test-threads=1`. Serializing this group against
# itself (not against the rest of the suite) removes the contention without
# papering over a single test.
kb-ops-filesystem-watchers = { max-threads = 1 }

[profile.default]

[[profile.default.overrides]]
filter = '''
  binary(headless_e2e)
  + binary(guidance_delivery_e2e)
  + binary(headless_kb_convergence_e2e)
  + binary(headless_soak_shaped_e2e)
  + binary(headless_idle_cpu_e2e)
  + binary(mcp_tool_tiering_e2e)
  + binary(tool_schema_nested_e2e)
'''
test-group = "heavy-subprocess-e2e"
# The group above serializes these files AGAINST EACH OTHER, but not
# against the hundreds of OTHER test binaries nextest starts concurrently at
# the very beginning of a full run -- a real residual contention window,
# confirmed empirically MORE THAN ONCE now, not just theoretical: one test in
# this set failed once during a full local `make test` run, at position
# 7/7218 (i.e. during the initial startup burst), then passed cleanly both in
# isolation and under --release immediately after -- and issue #510 is a
# SECOND, independent occurrence in real CI (`guidance_delivery_e2e`,
# position 10/7345, same startup-burst window), where the original
# `retries = 1` genuinely wasn't enough (failed both attempts). Raised to 2 to
# match the #487 precedent fully (that override was always the model this one
# was sized against -- `retries = 1` was a lighter version of the same idea,
# now brought in line since the narrower budget proved insufficient). Still a
# small, explained retry for a specific, already-understood
# environmental-timing effect (not a masked logic bug -- the logic itself was
# reverified clean both times), not a blanket policy.
#
# `mcp_tool_tiering_e2e` added after #511's own CI/badges.yml split-invocation
# fix landed and, for the first time, ran far enough into the "rest" bucket to
# reach it: it failed with the identical "headless instance never bound its
# stable socket" signature as the other 5 -- a real `mae --headless`
# subprocess + bounded-bind assertion, structurally the same class of test,
# just missed from the original list because it hadn't been the one observed
# failing yet. Same treatment (own group member + heavy-first invocation
# order in badges.yml/ci.yml) rather than a one-off retry bump.
#
# `tool_schema_nested_e2e` added the SAME way, one CI cycle later --
# reacting one-at-a-time to whichever file happens to fail next doesn't
# converge, so this addition instead came from an exhaustive sweep of every
# `crates/mae/tests/*.rs` file for the shared signature (`grep -rl "never
# bound its stable socket\|wait_for_socket_live"` + a second independent
# pass on `arg("--headless")` -- both returned the identical 7-file set,
# cross-checked against a third pass over every `Command::new`-spawning test
# file to make sure nothing with a differently-worded wait/timeout message
# was missed). Two look-alikes were checked and ruled OUT, not just
# skipped: `kb_seed_provenance_e2e` spawns a subprocess but blocks on
# `.output()` to completion (a one-shot batch builder, no socket-bind race);
# `mcp_event_loop_integration` has the same profile but is `#[ignore]`d by
# default, so it never runs in this invocation at all. This membership list
# should now be exhaustive for the default (non-ignored) suite -- if a new
# heavy test is added later, add it here proactively rather than waiting for
# it to be the next one to fail in CI.
retries = 2

[[profile.default.overrides]]
filter = '''
  package(mae-core) and (
    test(kb_ops_durability_tests)
    + test(kb_ops_concurrency_tests)
    + test(kb_ops_watcher_misc_tests)
    + test(kb_ops_registry_tests)
    + test(kb_ops_search_federation_tests)
    + test(kb_ops_crud_tests)
    + test(kb_ops_collab_sync_tests)
    + test(option_tests)
  )
'''
test-group = "kb-ops-filesystem-watchers"
# All 8 modules confirmed (by grep across the WHOLE crate, not just kb_ops/
# tests/ -- `editor::tests::option_tests::handle_link_click_source_file_mode_
# opens_raw_file` also calls `kb_register` and was initially missed) to call
# `kb_register`/create a real `OrgDirWatcher` -- every one competes for the
# identical limited OS resource (Linux: `fs.inotify.max_user_instances`,
# default 128 on a real machine checked directly). Confirmed the initial
# 4-module grouping was insufficient on its own: `kb_ops_concurrency_tests::
# external_registry_change_adopts_new_instance` (already inside that group)
# still failed under a full `cargo nextest run -p mae-core --lib`, because the
# group only serializes its OWN members against each other -- modules left out
# were still running fully concurrently and still contending for the same
# inotify-instance budget. Even after broadening to 7, `kb_ops_watcher_misc_
# tests::drain_debounce_skips_recent` still failed once in 3 full-suite runs
# -- root-caused to this 8th, crate-wide straggler outside kb_ops/tests/
# entirely. Paired with the actual root-cause fix -- raising the OS's own
# `fs.inotify.max_user_instances` limit in CI, see
# `.github/actions/setup-rust/action.yml` -- this grouping is defense in depth
# for any environment (including local `cargo test`, which doesn't get the CI
# sysctl bump) that still has a low OS default.

# Issue #487: `rotate_identity_write_failure_reports_error_not_success` is a
# deliberately-tuned, self-documented hard TCP SO_LINGER/RST timing race (see
# the test's own doc comment in
# crates/mae/src/collab_bridge/tests/collab_bridge_write_failure_tests.rs) --
# not something to paper over by rewriting the test, but a genuine candidate
# for a narrow, explicitly cross-linked retry so it stops intermittently
# blocking merges via manual `gh run rerun --failed` while the real fix stays
# tracked and open. Scoped to exactly this one test -- not a blanket policy.
[[profile.default.overrides]]
filter = "test(=collab_bridge::tests::collab_bridge_write_failure_tests::rotate_identity_write_failure_reports_error_not_success)"
retries = 2
