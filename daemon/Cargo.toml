[package]
name = "mae-daemon"
version = "0.14.114"
edition = "2021"
license = "GPL-3.0-or-later"
description = "MAE daemon — background KB persistence, maintenance, collaboration, and services"

# ADR-014: the daemon is its own workspace, deliberately separate from the
# editor workspace (own Cargo.lock -- cozo+sqlite, no rusqlite). An explicit,
# empty `[workspace]` table here (rather than relying on the editor
# workspace's root `Cargo.toml` `exclude = [..., "daemon"]` alone) makes
# Cargo's ancestor-directory workspace search terminate at this manifest
# unconditionally, instead of continuing to walk upward past it. Without
# this, a checkout nested inside another mae checkout at a path Cargo's
# search reaches before hitting the filesystem root (e.g. this repo's own
# `.claude/worktrees/<id>/` agent-worktree convention) can have `cargo check`
# from inside `daemon/` wrongly resolve to a workspace root several
# directories further up whose own `exclude` list doesn't recognize the
# nested path -- "current package believes it's in a workspace when it's
# not". This has no effect on the common case (a normal top-level clone),
# where the search already terminated here.
[workspace]

[lib]
name = "mae_daemon"
path = "src/lib.rs"

[[bin]]
name = "mae-daemon"
path = "src/main.rs"

[dependencies]
mae-effect-sandbox = { path = "../shared/effect-sandbox" }
# storage-sqlite is required explicitly here (not left to Cargo's feature
# unification with a separate direct `cozo` dep) -- the daemon never calls
# `cozo::` directly, it only uses mae-kb's CozoKbStore, so mae-kb's own
# feature list must be the thing that actually requests the sqlite backend.
mae-kb = { path = "../shared/kb", default-features = false, features = ["crdt", "storage-sqlite"] }
mae-mcp = { path = "../shared/mcp" }
mae-sync = { path = "../shared/sync" }

# Collab WAL persistence — uses `sqlite` crate (same native lib as cozo, no links conflict)
sqlite = "0.32"
async-trait = "0.1"

# ADR-060 Phase C: per-tenant quota registry. Already fully resolved
# transitively (via yrs) in this workspace's Cargo.lock, so promoting it to a
# direct dependency adds zero new crates to the build graph.
dashmap = "6"

tokio = { version = "1", features = ["full", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
toml = "1.1"
sha2 = "0.11"
hex = "0.4"
iroh = "1.0.0"
data-encoding = "2"

# ADR-052: OAuth 2.1 resource-server bearer-token validation. Hand-rolled
# scaffolding (PRM endpoint, audience checks, principal mapping) around this
# crate's JWT decode/signature-verification primitive -- a deliberate,
# evaluated choice over the third-party `rmcp-server-kit` wrapper (see the
# ADR's "Alternatives rejected"). `jsonwebtoken` itself is the widely-used,
# well-established Keats crate, not a new/unproven dependency.
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
http-body-util = "0.1"
rustls-pemfile = "2"
bytes = "1"

[dev-dependencies]
hex = "0.4"
tempfile = "3"
# ADR-062 Phase D e2e: drives a real `RemoteHubQueryLayer` (client side) against a real
# spawned mae-daemon OAuth+kb_query listener (server side) — the daemon already links
# mae-kb, so this reuses that same dependency rather than adding a new one; `remote-hub`
# is dev-only (the daemon binary itself never constructs a RemoteHubQueryLayer — it's a
# federated-query-client concern, not something the hub side needs).
mae-kb = { path = "../shared/kb", default-features = false, features = ["crdt", "storage-sqlite", "remote-hub"] }
# oauth.rs adversarial tests sign real JWTs with freshly-generated RSA
# keypairs per test (CLAUDE.md principle #14 -- real inputs, not a shared
# hardcoded test key) rather than relying on a live external IdP.
# rsa 0.9 depends on rand_core 0.6 -- rand must stay on the matching 0.8
# line or RsaPrivateKey::new's CryptoRngCore bound fails to resolve.
rsa = "0.9"
rand = "0.10"
base64 = "0.23"
# oauth_kb_query_e2e.rs generates a real self-signed TLS cert for the real
# OAuth listener it spawns -- same crate `shared/mcp/src/tls.rs` already
# uses for mTLS test cert generation.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# ADR-054: the capacity benchmark spawns the real compiled mae-daemon binary
# (bench targets, like `daemon/tests/*.rs`, only see the library crate's
# public re-exports -- handler/accept_loop/DaemonState are bin-crate-private
# by design, see `daemon/src/tests/mod.rs`) and drives it over its real KB
# Unix socket -- same convention as `daemon/tests/network_e2e.rs`.
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "kb_dispatch_concurrency"
harness = false

# TEMPORARY: carries y-crdt PR #644 ("validate UTF-8 when decoding string content
# from the wire"), which is OPEN and unmerged upstream as of 2026-08-24 with no
# maintainer reply since 2026-08-06. Pinned to a commit SHA in our own fork rather
# than to the contributor's branch, so it cannot be force-pushed or deleted out
# from under a build, and so the bytes are reproducible.
#
# Why we carry it: `yrs::Read::read_string` builds a `&str` from raw wire bytes via
# `from_utf8_unchecked`, so ONE corrupted byte in an otherwise-valid v1 update
# decodes as `Ok` and materializing it is undefined behaviour -- a non-unwinding
# abort under the debug-only `char` precondition check, silently unsound in
# release. `catch_unwind` contains neither, and MAE-side validation cannot help:
# validating IS decoding, and decoding is where the UB lives.
#
# It is durable here, not just a crash: `validate_update` is `Update::decode_v1`
# and the daemon writes validate -> WAL append -> apply, so a poisoned update is
# persisted and replayed on every restart.
#
# Reproducer: `cargo test -p mae-sync --test yrs_decoder_utf8_ub_reproducer -- --ignored`
# Upstream: https://github.com/y-crdt/y-crdt/pull/644 (issue #415)
#
# REMOVE THIS BLOCK (both workspaces) when #644 lands upstream and yrs releases it.
[patch.crates-io]
yrs = { git = "https://github.com/cuttlefisch/y-crdt", rev = "40a08982b4e95fe8d06c84e4df5a5713eca11c25" }
