# cargo-deny configuration for MAE
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true
no-default-features = false
# mae-gui requires system Skia deps not available in CI containers
exclude = ["mae-gui", "mae-test-fixtures"]

[advisories]
# Transitive deps of cozo 0.7.x — we can't fix upstream, tracked for
# resolution when cozo releases a new version or we swap backends.
ignore = [
    # bincode unmaintained (cozo → bincode)
    { id = "RUSTSEC-2025-0141", reason = "cozo direct dep, no upstream fix" },
    # fxhash unmaintained (cozo → fxhash)
    { id = "RUSTSEC-2025-0057", reason = "cozo direct dep, no upstream fix" },
    # lz4_flex: info leak on invalid data (cozo → swapvec → lz4_flex)
    { id = "RUSTSEC-2026-0041", reason = "cozo transitive dep, no upstream fix; data is trusted local" },
    # adler unmaintained (cozo → sled → …)
    { id = "RUSTSEC-2024-0384", reason = "sled transitive dep, no upstream fix" },
    # instant unmaintained (cozo → sled → parking_lot 0.11 → …)
    { id = "RUSTSEC-2025-0056", reason = "sled transitive dep, no upstream fix" },
    # ttf-parser unmaintained (winit → sctk-adwaita → ab_glyph → owned_ttf_parser → ttf-parser);
    # GUI-only font path, no safe upgrade available upstream (advisory says so explicitly)
    { id = "RUSTSEC-2026-0192", reason = "winit transitive dep (GUI font parsing), no upstream fix" },
    # quick-xml DoS advisories (winit → wayland-client/wayland-scanner → quick-xml, pinned
    # ^0.39 so the >=0.41 fix is unreachable without a winit ecosystem bump). wayland-scanner
    # uses quick-xml at BUILD TIME to parse the TRUSTED, crate-shipped Wayland protocol XML —
    # never attacker-controlled input — so both DoS threat models (untrusted XML) do not
    # apply. GUI/Wayland-only. 0194 = quadratic duplicate-attribute check; 0195 = unbounded
    # namespace-declaration allocation.
    { id = "RUSTSEC-2026-0194", reason = "wayland-scanner build-time parse of trusted protocol XML; not attacker input; quick-xml pinned ^0.39 upstream" },
    { id = "RUSTSEC-2026-0195", reason = "wayland-scanner build-time parse of trusted protocol XML; not attacker input; quick-xml pinned ^0.39 upstream" },
    # --- Daemon-workspace advisories. These were invisible until the cargo-deny
    # job became a matrix over BOTH workspaces; daemon/Cargo.lock had never been
    # scanned by anything. The h2 vulnerability found at the same time
    # (RUSTSEC-2026-0258) was fixed by updating rather than ignored.
    #
    # rsa: Marvin Attack is a timing sidechannel on RSA PRIVATE-KEY operations
    # (decryption/signing). The daemon is an OAuth *resource server*: `oauth.rs`
    # only ever calls `decode` with `Algorithm::RS256`, a public-key verification,
    # and it holds no RSA private key. Self-issued tokens sign with
    # `Algorithm::EdDSA` (`oauth_self_issue.rs`), not RSA. So the vulnerable code
    # path is linked but unreachable. Pulled in by jsonwebtoken 10.x, which has no
    # RSA-free build. Re-evaluate immediately if the daemon ever gains an RSA
    # signing or decryption path.
    { id = "RUSTSEC-2023-0071", reason = "rsa via jsonwebtoken; daemon only VERIFIES RS256 (public key) and signs EdDSA — no private-key RSA op exists, so the Marvin sidechannel is unreachable" },
    # paste: build-time proc-macro, unmaintained with no upstream fix.
    # iroh → netwatch → netdev → netlink-packet-core → paste (Linux netlink only).
    { id = "RUSTSEC-2024-0436", reason = "iroh transitive build-time proc-macro, no upstream fix" },
    # rustls-pemfile: unmaintained, and unlike the others this is a DIRECT
    # mae-daemon dependency, so it is ours to migrate (rustls-pki-types now
    # provides PEM parsing). Ignored here only to keep the newly-added daemon
    # cargo-deny leg green; tracked for migration rather than accepted forever.
    { id = "RUSTSEC-2025-0134", reason = "direct mae-daemon dep; migrate to rustls-pki-types PEM parsing — tracked, not permanently accepted" },
    # smallstr unmaintained (yrs → smallstr) — yrs is the CRDT substrate ADR-002
    # accepted as the sync engine (mae-sync); advisory itself states no safe
    # upgrade is available. Tracked in #374 — revisit if yrs drops the
    # dependency upstream (check `cargo tree -i smallstr`).
    { id = "RUSTSEC-2026-0215", reason = "yrs transitive dep, no upstream fix available; tracked in #374" },
    # smartstring unmaintained (cozo -> smartstring) — repo archived upstream
    # 2026-05-03, all versions affected. NO UPGRADE EXISTS: cozo 0.7.6 is the
    # latest published release and we are already on it, so this is not a
    # version bump away. Risk is maintenance, not exploitability — a string
    # type, not attacker-facing parsing.
    #
    # This is the SECOND unmaintained advisory arriving through cozo, which is
    # a data point ADR-102's evidence-gated engine evaluation should weigh
    # rather than a reason to act on its own. Tracked in #700 — revisit on any
    # cozo bump (`cargo tree -i smartstring`).
    { id = "RUSTSEC-2026-0249", reason = "cozo transitive dep, no upstream release available; tracked in #700" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "Unlicense",
    "GPL-3.0-or-later",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The MAE fork of y-crdt, carrying upstream PR #644 (UTF-8 validation in the v1
# decoder) on top of the v0.27.4 tag. Pinned by commit SHA in both workspace
# roots' `[patch.crates-io]`. Declared here rather than left to `unknown-git =
# "warn"` so the exception is explicit and reviewable, and so dropping the patch
# also means deleting this line.
# Remove when https://github.com/y-crdt/y-crdt/pull/644 lands upstream.
allow-git = ["https://github.com/cuttlefisch/y-crdt"]
