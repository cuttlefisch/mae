# Mutants for the editor crates (mae-core and friends), run by tools/mutate's
# `editor` runner. Each names the test that must fail when it is applied.

[[mutant]]
id = "editor/agenda-quadratic"
runner = "editor"
targets = ["-p", "mae-core", "--lib"]
filter = "test(agenda_scales_linearly_with_todos)"
ref = "The agenda must grow linearly with its TODO items; a scan of every node per line makes it quadratic."
[[mutant.edit]]
file = "crates/core/src/editor/agenda_ops.rs"
find = '''                let state = node.todo_state.as_deref().unwrap_or("TODO");
                let pri_str = node'''
replace = '''                let state = node.todo_state.as_deref().unwrap_or("TODO");
                let _scan = nodes.iter().filter(|n| n.id == node.id).count();
                let pri_str = node'''
