# The delivery gate (daemon/src/collab_handler/delivery_gate.rs): a principal
# who loses read access to a KB stops receiving its documents on the sessions
# already open.

[[mutant]]
id = "delivery-gate/not-applied"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_member_removed_while_connected_is_closed_out_at_the_next_delivery)"
ref = "a removed member is closed out at the next delivery"
[[mutant.edit]]
file = "daemon/src/collab_handler/mod.rs"
find = '''        if !gate.admits(doc_store, &kb_id).await {'''
replace = '''        if false && !gate.admits(doc_store, &kb_id).await {'''

[[mutant]]
id = "delivery-gate/refusal-read-as-allow"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_member_removed_while_connected_is_closed_out_at_the_next_delivery)"
ref = "a refused decision is not an allow"
[[mutant.edit]]
file = "daemon/src/collab_handler/delivery_gate.rs"
find = '''        Ok(AccessDecision::Allow)'''
replace = '''        Ok(_)'''

