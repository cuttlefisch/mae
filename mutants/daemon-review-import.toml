# ADR-113 E4 (kb import): one mutant per guard, each named for the test that
# must catch it. Format: tools/mutate/README.md.

[[mutant]]
id = "daemon-review-import/manifest-hash-unchecked"
runner = "daemon"
targets = ["--lib"]
filter = "test(the_manifest_is_exact_and_a_refusal_writes_nothing)"
ref = "E4: every file's sha256 equals its manifest line"
[[mutant.edit]]
file = "daemon/src/review/import_check.rs"
find = '''    if &actual != expected {'''
replace = '''    if actual.is_empty() {'''

[[mutant]]
id = "daemon-review-import/unused-line-allowed"
runner = "daemon"
targets = ["--lib"]
filter = "test(the_manifest_is_exact_and_a_refusal_writes_nothing)"
ref = "E4: every manifest line is used"
[[mutant.edit]]
file = "daemon/src/review/import_check.rs"
find = '''    if let Some(unused) = manifest.keys().find(|k| !used.contains(*k)) {'''
replace = '''    if let Some(unused) = manifest.keys().find(|k| k.is_empty()) {'''

[[mutant]]
id = "daemon-review-import/duplicate-line-allowed"
runner = "daemon"
