[[mutant.edit]]
file = "shared/kb/src/org_ingest.rs"
find = '''    if let Some(f) = &l.fragment {
        out.push('#');
        out.push_str(f);
    }'''
replace = '''    let _ = &l.fragment;'''

[[mutant]]
id = "kb-org-ingest/store-form-query-dropped"
runner = "editor"
targets = ["-p", "mae-kb", "--test", "org_ingest"]
filter = "test(raw_and_stored_bodies_make_the_same_edges)"
ref = "the old rewrite dropped ?rel=&w=&c=, so ingested typed edges became `references`"
[[mutant.edit]]
file = "shared/kb/src/org_ingest.rs"
find = '''    if let Some(q) = query {
        out.push('?');
        out.push_str(q);
    }'''
replace = '''    let _ = query;'''

[[mutant]]
id = "kb-org-ingest/kb-filter-inverted"
runner = "editor"
targets = ["-p", "mae-kb", "--test", "org_ingest"]
filter = "test(edges_are_the_semantics_kb_links)"
ref = "a web, mail, file or local link is never a graph edge"
[[mutant.edit]]
file = "shared/kb/src/org_ingest.rs"
find = '''    l.kind == LinkKind::Kb && !(l.target.is_empty() && l.fragment.is_none())'''
replace = '''    l.kind != LinkKind::Kb && !(l.target.is_empty() && l.fragment.is_none())'''

[[mutant]]
id = "kb-org-ingest/store-body-not-idempotent"
runner = "editor"
targets = ["-p", "mae-kb", "--test", "org_ingest"]
filter = "test(store_body_is_idempotent)"
ref = "a body stored twice must not grow: the CRDT body would churn on every save"
[[mutant.edit]]
file = "shared/kb/src/org_ingest.rs"
find = '''        out.push('?');
        out.push_str(q);'''
replace = '''        out.push('?');
        out.push_str(q);
        out.push('&');'''

[[mutant]]
id = "kb-org-ingest/kb-rewrite-unverified"
