# org_ingest's guards (shared/kb/src/org_ingest.rs, ADR-112 O4, #941 PR1).
# Format: tools/mutate/README.md.

[[mutant]]
id = "kb-org-ingest/weight-confidence-swapped"
runner = "editor"
targets = ["-p", "mae-kb", "--test", "org_ingest"]
filter = "test(edges_are_the_semantics_kb_links)"
ref = "ADR-030: w= and c= are different facts about an edge"
[[mutant.edit]]
file = "shared/kb/src/org_ingest.rs"
find = '''        weight: l.weight,
        confidence: l.confidence,'''
replace = '''        weight: l.confidence,
        confidence: l.weight,'''

[[mutant]]
id = "kb-org-ingest/default-rel-renamed"
runner = "editor"
targets = ["-p", "mae-kb", "--test", "org_ingest"]
filter = "test(edges_are_the_semantics_kb_links)"
ref = "an untyped link is `references`, as crate::org and the stored graph have it"
[[mutant.edit]]
file = "shared/kb/src/org_ingest.rs"
find = '''        rel_type: l.rel.clone(),'''
replace = '''        rel_type: if l.rel == "references" { "related_to".to_string() } else { l.rel.clone() },'''

[[mutant]]
id = "kb-org-ingest/edge-fragment-dropped"
runner = "editor"
targets = ["-p", "mae-kb", "--test", "org_ingest"]
filter = "test(edges_are_the_semantics_kb_links)"
ref = "ADR-030: #fragment is part of the edge"
[[mutant.edit]]
file = "shared/kb/src/org_ingest.rs"
