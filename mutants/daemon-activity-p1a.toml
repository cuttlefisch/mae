# ADR-120 P1a: the activity record, its writer and the HTTPS listener.
# One mutant per guard; each names the test that must catch it. Tests:
# daemon/src/activity/tests.rs (--lib), daemon/src/tests/activity_listener_tests.rs
# (--bin), daemon/tests/activity_e2e.rs. Format: tools/mutate/README.md.

[[mutant]]
id = "daemon-activity-p1a/ack-await-removed"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_held_writer_refuses_at_the_timeout_and_recovers)"
ref = "ADR-120 D5: no answer before its event commits"
[[mutant.edit]]
file = "daemon/src/activity/writer.rs"
find = '''            match done.await {
                Ok(true) => Ok(()),
                _ => Err(Unavailable),
            }'''
replace = '''            // The answer goes without waiting for the commit.
            drop(done);
            Ok::<(), Unavailable>(())'''

