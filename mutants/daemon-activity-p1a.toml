[[mutant]]
id = "daemon-activity-p1a/tip-read-from-a-cache"
runner = "daemon"
targets = ["--lib"]
filter = "test(concurrent_appenders_leave_both_chains_linear)"
ref = "ADR-120 D5: each chain's tip is read inside the transaction"
[[mutant.edit]]
file = "daemon/src/activity/store.rs"
find = '''        let mut pos = Position::read(&self.conn)?;'''
replace = '''        thread_local! {
            static TIPS: std::cell::RefCell<Vec<(usize, Tip, Tip, u64)>> = const { std::cell::RefCell::new(Vec::new()) };
        }
        let me = self as *const Self as usize;
        let mut pos = Position::read(&self.conn)?;
        TIPS.with(|t| {
            if let Some((_, l, s, g)) = t.borrow().iter().find(|e| e.0 == me) {
                pos.long = l.clone();
                pos.short = s.clone();
                pos.gseq = *g;
            }
        });'''
[[mutant.edit]]
file = "daemon/src/activity/store.rs"
find = '''        done.last_gseq = pos.gseq;'''
replace = '''        done.last_gseq = pos.gseq;
        TIPS.with(|t| {
            let mut t = t.borrow_mut();
            t.retain(|e| e.0 != me);
            t.push((me, pos.long.clone(), pos.short.clone(), pos.gseq));
        });'''

