# Renewing a sync WebSocket with a connect ticket (ADR-099 Amendment 3): one
# mutant per guard on the ticket path. The redemption is shared with the
# upgrade (daemon/src/ws/upgrade.rs `spend_ticket`, daemon/src/ws/
# connect_ticket.rs `redeem`), so each guard removed here also opens the
# upgrade; the named test drives it through `session/renew`. Tests:
# daemon/tests/ws_renew_ticket_e2e.rs.

[[mutant]]
id = "ws-renew-ticket/origin-not-checked"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(refused_tickets_all_read_the_same_and_leave_the_socket_open)"
[[mutant.edit]]
file = "daemon/src/ws/upgrade.rs"
find = '''        Some(g) if &g.origin == origin && g.token_expires_at > now_unix() => g,'''
replace = '''        Some(g) if (true || &g.origin == origin) && g.token_expires_at > now_unix() => g,'''

[[mutant]]
id = "ws-renew-ticket/identity-not-checked"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(a_ticket_for_another_subject_closes_4403)"
[[mutant.edit]]
file = "daemon/src/ws/session.rs"
find = '''            .same_identity(&auth.issuer, &auth.subject, &auth.principal)'''
replace = '''            .same_identity(&self.auth.issuer, &self.auth.subject, &self.auth.principal)'''

[[mutant]]
id = "ws-renew-ticket/ticket-reusable"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(a_ticket_is_spent_once_across_the_upgrade_and_renewal)"
[[mutant.edit]]
file = "daemon/src/ws/connect_ticket.rs"
find = '''        let entry = entries.remove(&key(ticket))?;
        (entry.valid_until > now).then_some(entry.grant)'''
replace = '''        let entry = entries.get(&key(ticket))?;
        (entry.valid_until > now).then_some(entry.grant.clone())'''

[[mutant]]
id = "ws-renew-ticket/ticket-lifetime-ignored"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(an_expired_ticket_does_not_renew)"
[[mutant.edit]]
file = "daemon/src/ws/connect_ticket.rs"
find = '''        (entry.valid_until > now).then_some(entry.grant)'''
replace = '''        (true || entry.valid_until > now).then_some(entry.grant)'''

[[mutant]]
id = "ws-renew-ticket/token-expiry-ignored"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(a_ticket_outliving_its_token_does_not_renew)"
[[mutant.edit]]
file = "daemon/src/ws/upgrade.rs"
find = '''        Some(g) if &g.origin == origin && g.token_expires_at > now_unix() => g,'''
replace = '''        Some(g) if &g.origin == origin && (true || g.token_expires_at > now_unix()) => g,'''

[[mutant]]
id = "ws-renew-ticket/idp-cap-skipped"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(a_bound_idp_ticket_renewal_is_capped)"
[[mutant.edit]]
file = "daemon/src/ws/upgrade.rs"
find = '''        deadline: credential::capped_deadline(g.token_expires_at, g.bound_idp, listener),'''
replace = '''        deadline: g.token_expires_at,'''

[[mutant]]
id = "ws-renew-ticket/binding-not-reread"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(a_bound_idp_ticket_rereads_its_binding_at_renewal)"
[[mutant.edit]]
file = "daemon/src/ws/upgrade.rs"
find = '''    if g.bound_idp {
        match credential::still_bound('''
replace = '''    if false && g.bound_idp {
        match credential::still_bound('''

# B3's identity is three clauses, and each has a test in which ONLY that one
# differs: a test changing several at once (a fresh member changes subject and
# principal together) cannot see one clause removed. Both renewal paths, token
# and ticket, go through `same_identity`, and each named test drives both.

[[mutant]]
id = "ws-renew-ticket/identity-issuer-clause-dropped"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(the_same_subject_from_another_issuer_closes_4403)"
[[mutant.edit]]
file = "daemon/src/ws/upgrade.rs"
find = '''        self.issuer == issuer && self.subject == subject && self.principal == principal'''
replace = '''        self.subject == subject && self.principal == principal'''

[[mutant]]
id = "ws-renew-ticket/identity-subject-clause-dropped"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(another_subject_bound_to_the_same_key_closes_4403)"
[[mutant.edit]]
file = "daemon/src/ws/upgrade.rs"
find = '''        self.issuer == issuer && self.subject == subject && self.principal == principal'''
replace = '''        self.issuer == issuer && self.principal == principal'''

[[mutant]]
id = "ws-renew-ticket/identity-principal-clause-dropped"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(the_same_subject_rebound_to_another_key_closes_4403)"
[[mutant.edit]]
file = "daemon/src/ws/upgrade.rs"
find = '''        self.issuer == issuer && self.subject == subject && self.principal == principal'''
replace = '''        self.issuer == issuer && self.subject == subject'''

# The reverse origin case: a socket upgraded with no `Origin` (a non-browser
# client) must not accept a ticket minted for an origin.
[[mutant]]
id = "ws-renew-ticket/missing-origin-matches-any"
runner = "daemon"
targets = ["--test", "ws_renew_ticket_e2e"]
filter = "test(refused_tickets_all_read_the_same_and_leave_the_socket_open)"
[[mutant.edit]]
file = "daemon/src/ws/upgrade.rs"
find = '''        Some(g) if &g.origin == origin && g.token_expires_at > now_unix() => g,'''
replace = '''        Some(g) if (origin.is_none() || &g.origin == origin) && g.token_expires_at > now_unix() => g,'''
