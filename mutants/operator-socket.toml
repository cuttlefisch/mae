# The operator's socket: membership changes on a running daemon. One mutant
# per guard, each named for the test that must catch it.

[[mutant]]
id = "operator-socket/not-broadcast"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_running_daemon_takes_membership_changes_on_its_operator_socket)"
ref = "a live change reaches connected sessions"
[[mutant.edit]]
file = "daemon/src/collab_handler/kb_membership.rs"
find = '''    let result = apply_membership_change(doc_store, broadcaster, who, kb_id, change)'''
replace = '''    let result = apply_membership_change(doc_store, &SharedBroadcaster::default(), who, kb_id, change)'''

[[mutant]]
id = "operator-socket/world-readable"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_running_daemon_takes_membership_changes_on_its_operator_socket)"
ref = "only the daemon's account reaches the socket"
[[mutant.edit]]
file = "daemon/src/operator_socket.rs"
find = '''    std::fs::set_permissions(path, std::fs::Permissions::from_mode(0o600))?;'''
replace = '''    std::fs::set_permissions(path, std::fs::Permissions::from_mode(0o666))?;'''

[[mutant]]
id = "operator-socket/live-socket-taken-over"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_running_daemon_takes_membership_changes_on_its_operator_socket)"
ref = "a running daemon's socket is never taken over"
[[mutant.edit]]
file = "daemon/src/operator_socket.rs"
find = '''        if UnixStream::connect(path).await.is_ok() {'''
replace = '''        if false && UnixStream::connect(path).await.is_ok() {'''

[[mutant]]
id = "operator-socket/dir-not-private"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_running_daemon_takes_membership_changes_on_its_operator_socket)"
ref = "the socket lives in a 0700 directory"
[[mutant.edit]]
file = "daemon/src/operator_socket.rs"
find = '''    std::fs::set_permissions(dir, std::fs::Permissions::from_mode(0o700))'''
replace = '''    std::fs::set_permissions(dir, std::fs::Permissions::from_mode(0o755))'''

[[mutant]]
id = "operator-socket/symlink-followed"
runner = "daemon"
targets = ["--lib"]
filter = "test(the_socket_directory_is_never_a_symlink)"
ref = "a symlinked socket directory is refused"
[[mutant.edit]]
file = "daemon/src/operator_socket.rs"
find = '''        Ok(m) if !m.file_type().is_dir() => {'''
replace = '''        Ok(m) if false && !m.file_type().is_dir() => {'''

[[mutant]]
id = "operator-socket/removal-not-cut-off"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_removed_members_open_sessions_stop_receiving_the_kb)"
ref = "a removed member's open sessions stop receiving the KB"
[[mutant.edit]]
file = "daemon/src/collab_handler/kb_membership.rs"
find = '''    if !ch.add {
        cut_off(broadcaster, kb_id, ch.member);
    }
    // ADR-026'''
replace = '''    // ADR-026'''
[[mutant.edit]]
file = "daemon/src/collab_handler/kb_membership.rs"
find = '''        // check before the removal persisted may have landed since the first.
        cut_off(broadcaster, kb_id, ch.member);'''
replace = '''        // check before the removal persisted may have landed since the first.'''

[[mutant]]
id = "operator-socket/block-not-cut-off"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_blocked_principals_open_sessions_stop_receiving_the_kb)"
ref = "a blocked principal's open sessions stop receiving the KB"
[[mutant.edit]]
file = "daemon/src/collab_handler/kb_governance.rs"
find = '''                super::kb_membership::cut_off(broadcaster, &kb_id, &principal);'''
replace = '''                let _ = (broadcaster, &principal);'''

[[mutant]]
id = "operator-socket/unblock-cuts-off"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_blocked_principals_open_sessions_stop_receiving_the_kb)"
ref = "an unblock cuts nobody off"
[[mutant.edit]]
file = "daemon/src/collab_handler/kb_governance.rs"
find = '''            if block {
                super::kb_membership::cut_off'''
replace = '''            if true {
                super::kb_membership::cut_off'''

[[mutant]]
id = "operator-socket/revoke-not-cut-off"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_revoke_cuts_off_only_once_it_reaches_its_quorum)"
ref = "a revoke that reaches its quorum cuts the subject off"
[[mutant.edit]]
file = "daemon/src/collab_handler/mod.rs"
find = '''        kb_membership::cut_off(broadcaster, kb_id, subject);'''
replace = '''        let _ = (broadcaster, subject);'''

[[mutant]]
id = "operator-socket/revoke-cuts-off-below-quorum"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_revoke_cuts_off_only_once_it_reaches_its_quorum)"
ref = "one co-signature below the quorum cuts nobody off"
[[mutant.edit]]
file = "daemon/src/collab_handler/mod.rs"
find = '''    if !after.members.contains_key(subject) {'''
replace = '''    if true || !after.members.contains_key(subject) {'''
