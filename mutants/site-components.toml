# The web core's slot components (shared/site/src/components, ADR-119 D18
# and Amendment 4): the component sanitiser and the render bounds, the two
# parts a defect would turn into an exposure or an outage. Tests:
# shared/site/tests/components.rs.

[[mutant]]
id = "site-components/undeclared-data-key-kept"
runner = "editor"
targets = ["-p", "mae-site", "--test", "components"]
filter = "test(a_component_loses_everything_it_did_not_declare_or_may_not_write)"
[[mutant.edit]]
file = "shared/site/src/components/clean.rs"
find = '''            declared.contains(a).then_some(value.into())'''
replace = '''            let _ = declared;
            Some(value.into())'''

[[mutant]]
id = "site-components/class-prefix-unchecked"
runner = "editor"
targets = ["-p", "mae-site", "--test", "components"]
filter = "test(a_component_loses_everything_it_did_not_declare_or_may_not_write)"
[[mutant.edit]]
file = "shared/site/src/components/clean.rs"
find = '''                .filter(|c| is_component_class(c))'''
replace = '''                .filter(|_| true)'''

[[mutant]]
id = "site-components/no-fuel-limit"
runner = "editor"
targets = ["-p", "mae-site", "--test", "components"]
filter = "test(a_render_out_of_fuel_fails)"
[[mutant.edit]]
file = "shared/site/src/components/mod.rs"
find = '''    env.set_fuel(Some(FUEL_LIMIT));'''
replace = '''    env.set_fuel(None);'''

[[mutant]]
id = "site-components/failed-render-output-kept"
runner = "editor"
targets = ["-p", "mae-site", "--test", "components"]
filter = "test(a_failing_component_contributes_nothing_and_its_neighbours_still_render)"
[[mutant.edit]]
file = "shared/site/src/components/mod.rs"
find = '''                errors.push(e);
                continue;'''
replace = '''                errors.push(e);'''
