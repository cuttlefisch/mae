# ADR-113 PR-6 (revision attachments): one mutant per guard, each named for
# the test that must catch it. Format: tools/mutate/README.md.

[[mutant]]
id = "daemon-review-pr6/write-once-removed"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_rendered_pdf_is_written_once_by_the_requester_from_the_frozen_source)"
ref = "B1: a kind holds one current attachment"
[[mutant.edit]]
file = "daemon/src/review/attach.rs"
find = '''        return Ok(Err(McpError::attachment_exists(
            format!("this revision already holds a {}", i.kind),
            &cur.sha256,
        )));'''
replace = '''        let _ = &cur;'''

[[mutant]]
id = "daemon-review-pr6/retry-not-recognised"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_rendered_pdf_is_written_once_by_the_requester_from_the_frozen_source)"
ref = "B1: the same bytes again answer the first attach"
[[mutant.edit]]
file = "daemon/src/review/attach.rs"
find = '''        if cur.sha256 == i.meta.sha256 {'''
replace = '''        if cur.sha256 == i.meta.sha256 && false {'''

[[mutant]]
id = "daemon-review-pr6/pdf-head-unchecked"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_rendered_pdf_is_written_once_by_the_requester_from_the_frozen_source)"
ref = "B2: the bytes begin with the PDF header"
[[mutant.edit]]
file = "daemon/src/review/attach.rs"
find = '''        Ok(()) => Ok(&head == b"%PDF-"),'''
replace = '''        Ok(()) => Ok(true),'''

[[mutant]]
id = "daemon-review-pr6/pdf-type-unchecked"
runner = "daemon"
targets = ["--lib"]
filter = "test(a_rendered_pdf_is_written_once_by_the_requester_from_the_frozen_source)"
ref = "B2: the stored type is application/pdf"
[[mutant.edit]]
file = "daemon/src/review/attach.rs"
find = '''    if meta.media_type != MediaType::Pdf || !head {'''
replace = '''    if !head {'''

[[mutant]]
