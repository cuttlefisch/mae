# Stored-edge derivation on mae-org (ADR-112 O4, #941 PR2): derived_links,
# the Node::edges cache and the open-time re-derivation. Format:
# tools/mutate/README.md.

[[mutant]]
id = "kb-edges/dedupe-first-wins"
runner = "editor"
targets = ["-p", "mae-kb", "--lib"]
filter = "test(one_edge_per_target_and_relation_the_last_in_body_order)"
ref = "one stored edge per (dst, rel_type), the LAST in body order, as the per-link :puts left it"
[[mutant.edit]]
file = "shared/kb/src/org_ingest.rs"
find = '''            Some(existing) => *existing = row,'''
replace = '''            Some(_) => {}'''

[[mutant]]
id = "kb-edges/external-links-kept"
runner = "editor"
targets = ["-p", "mae-kb", "--lib"]
filter = "test(links_that_name_no_node_are_not_stored_edges)"
ref = "a web, file, help: or local link is text, not an edge (#941)"
[[mutant.edit]]
file = "shared/kb/src/org_ingest.rs"
find = '''    l.kind == LinkKind::Kb && !(l.target.is_empty() && l.fragment.is_none())'''
replace = '''    !(l.target.is_empty() && l.fragment.is_none())'''

[[mutant]]
id = "kb-edges/weight-unclamped"
runner = "editor"
targets = ["-p", "mae-kb", "--lib"]
filter = "test(a_stored_weight_is_clamped_to_the_unit_interval)"
ref = "ADR-030: weight and confidence are 0-1"
[[mutant.edit]]
file = "shared/org/src/link_grammar.rs"
find = '''        .map(|f| f.clamp(0.0, 1.0) + 0.0)'''
replace = '''        .map(|f| f + 0.0)'''

[[mutant]]
id = "kb-edges/projection-on-old-parser"
runner = "daemon"
targets = ["--lib"]
filter = "test(raw_org_and_store_form_bodies_project_identical_link_rows)"
ref = "#941 PR2: the projector's edges are mae-org's, through insert_node"
[[mutant.edit]]
file = "shared/kb/src/cozo_store/links.rs"
find = '''        crate::org_ingest::edge_rows(node.edges().iter())'''
replace = '''        crate::org_ingest::edge_rows(crate::org::parse_typed_links(&node.body, &node.id).iter())'''

[[mutant]]
id = "kb-edges/cache-never-invalidated"
runner = "editor"
targets = ["-p", "mae-kb", "--lib"]
filter = "test(an_edited_body_is_never_answered_from_the_cache)"
ref = "#941 G3: an edited body is never answered from the cache"
[[mutant.edit]]
file = "shared/kb/src/edge_cache.rs"
find = '''            if *k == key {'''
replace = '''            if *k == key || k.len > 0 {'''

[[mutant]]
id = "kb-edges/cache-keyed-by-length"
runner = "editor"
targets = ["-p", "mae-kb", "--lib"]
filter = "test(an_edited_body_is_never_answered_from_the_cache)"
ref = "#941 G3: a same-length edit changes the key"
[[mutant.edit]]
file = "shared/kb/src/edge_cache.rs"
find = '''        hash: SEED.get_or_init(RandomState::new).hash_one(body),'''
replace = '''        hash: SEED.get_or_init(RandomState::new).hash_one(body.len()),'''

[[mutant]]
id = "kb-edges/cache-not-kept"
runner = "editor"
targets = ["-p", "mae-kb", "--lib"]
filter = "test(a_repeated_call_returns_the_cached_derivation)"
