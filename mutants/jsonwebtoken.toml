# What the daemon's bearer-token validation gets from jsonwebtoken 12, and the
# tests that pin it (daemon/src/oauth_tests.rs). A major version of the JWT
# library can change validation behaviour without a compile error, so the
# library version itself is a mutant: going back to 11.1.0 must fail the tests.
#
# The downgrade mutants edit Cargo.lock only so the run restores it: cargo
# re-resolves the lock for the `=11.1.0` requirement, and the journal puts the
# committed lock back afterwards.

[[mutant]]
id = "jsonwebtoken/v11-accepts-a-non-string-aud"
runner = "daemon"
targets = ["--bin", "mae-daemon"]
filter = "test(a_non_string_audience_is_refused)"
ref = "jsonwebtoken 12.0.0: fix remaining type confusion with sub, iss, aud"
[[mutant.edit]]
file = "daemon/Cargo.toml"
find = '''jsonwebtoken = { version = "12", '''
replace = '''jsonwebtoken = { version = "=11.1.0", '''
[[mutant.edit]]
file = "daemon/Cargo.lock"
find = '''# It is not intended for manual editing.'''
replace = '''# It is not intended for manual editing (mutant).'''
# With `aud` required, jsonwebtoken 11 refuses these tokens too (as a missing
# claim), so the downgrade alone changed nothing and the mutant survived every
# night from 2026-11-20. The pin is the second line of defence: drop the
# requirement as well, and only version 12's typed parsing still refuses them.
[[mutant.edit]]
file = "daemon/src/oauth.rs"
find = '''    validation.set_required_spec_claims(&["exp", "aud"]);'''
replace = '''    validation.set_required_spec_claims(&["exp"]);'''

[[mutant]]
id = "jsonwebtoken/v11-accepts-an-unknown-crit-header"
runner = "daemon"
targets = ["--bin", "mae-daemon"]
filter = "test(an_unknown_critical_header_is_refused)"
ref = "jsonwebtoken 12.0.0: reject unknown critical extensions"
[[mutant.edit]]
file = "daemon/Cargo.toml"
find = '''jsonwebtoken = { version = "12", '''
replace = '''jsonwebtoken = { version = "=11.1.0", '''
[[mutant.edit]]
file = "daemon/Cargo.lock"
find = '''# It is not intended for manual editing.'''
replace = '''# It is not intended for manual editing (mutant).'''

[[mutant]]
id = "jsonwebtoken/external-validator-skips-aud"
runner = "daemon"
targets = ["--bin", "mae-daemon"]
# A token for another resource, with a well-formed string `aud`: what audience
# validation exists for. (The non-string test cannot see this mutant: since
# jsonwebtoken 12 a non-string `aud` fails parsing even with validation off.)
filter = "test(token_for_a_different_resource_is_rejected)"
[[mutant.edit]]
file = "daemon/src/oauth.rs"
find = '''    validation.validate_exp = true;
    // Stated, not inherited'''
replace = '''    validation.validate_exp = true;
    validation.validate_aud = false;
    // Stated, not inherited'''

[[mutant]]
id = "jsonwebtoken/external-validator-aud-not-required"
runner = "daemon"
targets = ["--bin", "mae-daemon"]
filter = "test(a_token_without_an_audience_is_refused)"
ref = "ADR-052: audience validated per RFC 8707; a token with no aud is not for this resource"
[[mutant.edit]]
file = "daemon/src/oauth.rs"
find = '''    validation.set_required_spec_claims(&["exp", "aud"]);'''
replace = '''    validation.set_required_spec_claims(&["exp"]);'''

[[mutant]]
id = "jsonwebtoken/self-issued-aud-not-required"
runner = "daemon"
# oauth_self_issue is in the library (daemon/src/lib.rs), not the binary.
targets = ["--lib"]
filter = "test(a_self_signed_token_without_aud_or_iss_is_refused)"
ref = "ADR-052: a self-issued token names this resource; one without aud is not for it"
[[mutant.edit]]
file = "daemon/src/oauth_self_issue.rs"
find = '''    validation.set_required_spec_claims(&["exp", "aud", "iss"]);'''
replace = '''    validation.set_required_spec_claims(&["exp", "iss"]);'''

[[mutant]]
id = "jsonwebtoken/self-issued-iss-not-required"
runner = "daemon"
# oauth_self_issue is in the library (daemon/src/lib.rs), not the binary.
targets = ["--lib"]
filter = "test(a_self_signed_token_without_aud_or_iss_is_refused)"
ref = "ADR-052: a self-issued token names this daemon as issuer; one without iss is not its own"
[[mutant.edit]]
file = "daemon/src/oauth_self_issue.rs"
find = '''    validation.set_required_spec_claims(&["exp", "aud", "iss"]);'''
replace = '''    validation.set_required_spec_claims(&["exp", "aud"]);'''
