# The mutation tool's own guards, each caught by the tool's own tests.

[[mutant]]
id = "tools-mutate/anchor-found-twice-accepted"
runner = "tools-mutate"
filter = "test(an_anchor_found_twice_is_refused)"
[[mutant.edit]]
file = "tools/mutate/src/config.rs"
find = "        if n != 1 {"
replace = "        if n == 0 {"

