# The listing gate (ADR-119 D7, Amendment 3): a query-only member reads pages
# but nothing that lists the whole KB. Tests: daemon/src/tests/
# site_list_gate_tests.rs, on a real signed op-log. Not declared: admitting a
# non-member to the gate, which load_gated already refuses before it is asked
# (defence in depth, invisible to any route test).

[[mutant]]
id = "daemon-site/list-gate-always-open"
runner = "daemon"
targets = ["--bin", "mae-daemon"]
filter = "test(a_query_only_member_reads_pages_but_nothing_that_lists_the_kb)"
[[mutant.edit]]
file = "daemon/src/kb_query.rs"
find = '''    let Some(principal) = principal else {
        return true;
    };
    matches!('''
replace = '''    let Some(principal) = principal else {
        return true;
    };
    true || matches!('''

