[[mutant]]
id = "crypto-sign-op/verify-op-ignores-claimed-author"
runner = "editor"
targets = ["-p", "mae-crypto-wasm", "--test", "outside_op"]
filter = "test(verify_op_refuses_what_the_daemon_refuses)"
