runner = "editor"
targets = ["-p", "mae-crypto-wasm", "--test", "outside_op"]
filter = "test(a_request_that_names_no_op_is_refused)"
ref = "ADR-036 D1: ids the encoding cannot carry are refused"
[[mutant.edit]]
