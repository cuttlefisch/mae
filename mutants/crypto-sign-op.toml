# op_canonical_bytes and verify_op (ADR-098 Amendment 2): the bytes a client
# signs outside the module, and the verdict on what it sent.
# Tests: shared/crypto-wasm/tests/outside_op.rs.

[[mutant]]
id = "crypto-sign-op/outside-author-claimed"
runner = "editor"
targets = ["-p", "mae-crypto-wasm", "--test", "outside_op"]
filter = "test(a_request_that_names_no_op_is_refused)"
ref = "ADR-098 A2: the author is the key, never claimed"
[[mutant.edit]]
file = "shared/crypto-wasm/src/api.rs"
find = '''    if req.author.as_deref().is_some_and(|a| a != op.author) {'''
replace = '''    if req.author.as_deref().is_some_and(|a| a.is_empty()) {'''

