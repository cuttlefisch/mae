# sign_op (ADR-036 F5): the content-op header every signer and the daemon's
# verifier share (shared/crypto/src/content_op.rs), the WASM op
# (shared/crypto-wasm/src/api.rs), and the daemon's decimal-text epoch
# (shared/sync/src/content_ops.rs). Tests: content_op's unit tests and
# shared/crypto-wasm/tests/sign_op.rs, which checks the WASM output against
# mae_sync::content_ops::SignedContentOp.

[[mutant]]
id = "crypto-sign-op/canonical-field-order"
runner = "editor"
targets = ["-p", "mae-crypto", "--lib"]
filter = "test(the_canonical_bytes_and_signature_are_pinned)"
[[mutant.edit]]
file = "shared/crypto/src/content_op.rs"
find = '''        field(&mut b, &self.kb_id);
        field(&mut b, &self.node_id);'''
replace = '''        field(&mut b, &self.node_id);
        field(&mut b, &self.kb_id);'''

[[mutant]]
id = "crypto-sign-op/payload-not-signed"
runner = "editor"
targets = ["-p", "mae-crypto", "--lib"]
filter = "test(a_signature_verifies_only_for_its_exact_header_payload_and_key)"
[[mutant.edit]]
file = "shared/crypto/src/content_op.rs"
find = '''        field(&mut b, &self.issued_at.to_string());
        b.extend_from_slice(payload);'''
replace = '''        field(&mut b, &self.issued_at.to_string());
        let _ = payload;'''

[[mutant]]
id = "crypto-sign-op/nul-accepted"
runner = "editor"
targets = ["-p", "mae-crypto", "--lib"]
filter = "test(ids_that_cannot_be_encoded_unambiguously_are_refused)"
[[mutant.edit]]
file = "shared/crypto/src/content_op.rs"
find = '''            if v.as_bytes().contains(&0) {'''
replace = '''            if false {'''

