# ADR-113 PR-5 (acts and publication): one mutant per guard, each named for
# the test that must catch it. Format: tools/mutate/README.md.

[[mutant]]
id = "daemon-review-pr5/agent-may-act"
runner = "daemon"
targets = ["--lib"]
filter = "test(authors_agents_and_unlisted_people_are_refused)"
ref = "D3, C3: an agent never acts"
[[mutant.edit]]
file = "daemon/src/review/acts.rs"
find = '''    if who.kind == PrincipalKind::Person {'''
replace = '''    if true {'''

